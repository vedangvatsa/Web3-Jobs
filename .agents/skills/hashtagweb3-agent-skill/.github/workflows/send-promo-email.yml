name: Send Promo Email

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (preview only, no emails sent)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  send-promo:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Send promo email
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npx tsx scripts/send-promo-email.ts --dry-run
          else
            npx tsx scripts/send-promo-email.ts
          fi
        env:
          # AWS SES
          AWS_SES_ACCESS_KEY_ID: ${{ secrets.AWS_SES_ACCESS_KEY_ID }}
          AWS_SES_SECRET_ACCESS_KEY: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY }}
          AWS_SES_REGION: us-west-1

          # Email config
          EMAIL_FROM: hi@hashtagweb3.com
          EMAIL_FROM_NAME: Hashtag Web3

          # Firebase Admin SDK
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
