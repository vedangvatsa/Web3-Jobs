name: Post Web3 jobs (Telegram only)

on:
  workflow_dispatch:

concurrency:
  group: telegram-web3-jobs-once
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci --ignore-scripts

      - name: Verify bot admin on @web3hiring and @jobsweb3
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          node <<'EOF'
          const token = process.env.TELEGRAM_BOT_TOKEN;
          if (!token) throw new Error('missing TELEGRAM_BOT_TOKEN');
          const api = (method, body) =>
            fetch(`https://api.telegram.org/bot${token}/${method}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            }).then((r) => r.json());

          const me = await api('getMe', {});
          if (!me.ok) throw new Error(JSON.stringify(me));
          console.log('bot:', me.result.username);

          for (const chat_id of ['@web3hiring', '@jobsweb3']) {
            const chat = await api('getChat', { chat_id });
            const member = await api('getChatMember', {
              chat_id,
              user_id: me.result.id,
            });
            console.log(JSON.stringify({
              chat_id,
              ok: chat.ok && member.ok,
              type: chat.result?.type,
              title: chat.result?.title,
              username: chat.result?.username,
              status: member.result?.status,
              error: chat.ok ? (member.ok ? null : member) : chat,
            }));
            if (!chat.ok || !member.ok || !['administrator', 'creator'].includes(member.result?.status)) {
              throw new Error(`Bot is not admin on ${chat_id}`);
            }
          }
          EOF

      - name: Force-post jobs to @web3hiring and @jobsweb3
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_EXTRA_CHANNEL_IDS: '@jobsweb3'
        run: |
          node scripts/telegram-post.mjs --force
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .telegram-posted*.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: update Web3 jobs Telegram dedup state [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break || sleep $((i * 3))
            done
          fi
