<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1080px;
      height: 1080px;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    .card {
      width: 1080px;
      height: 1080px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* Themes — light only */
    .card[data-theme="light"] {
      background: linear-gradient(160deg, #f8fafc 0%, #eef4f9 40%, #dce9f3 100%);
    }
    .card[data-theme="blue"] {
      background: linear-gradient(160deg, #e8f4fd 0%, #c4e0f5 40%, #a8d1ee 100%);
    }

    /* Decorative circles */
    .deco-circle-1 {
      position: absolute;
      top: -120px; right: -120px;
      width: 450px; height: 450px;
      border: 50px solid rgba(46,134,193,0.08);
      border-radius: 50%;
    }
    .deco-circle-2 {
      position: absolute;
      bottom: -80px; left: -80px;
      width: 300px; height: 300px;
      border: 35px solid rgba(46,134,193,0.06);
      border-radius: 50%;
    }
    .deco-line {
      position: absolute;
      top: 180px; right: 70px;
      width: 4px; height: 180px;
      background: rgba(46,134,193,0.12);
      border-radius: 2px;
    }

    /* Top accent bar */
    .top-bar {
      height: 6px;
      background: linear-gradient(90deg, #2e86c1, #3498db, #5dade2);
      flex-shrink: 0;
      position: relative; z-index: 2;
    }

    /* Header — logo centered */
    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 52px 0;
      position: relative; z-index: 2;
      flex-shrink: 0;
    }
    .header img { height: 44px; width: auto; }

    /* Content — fills entire middle */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 24px 52px;
      position: relative; z-index: 2;
    }

    /* Footer — just URL centered */
    .footer {
      padding: 28px 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative; z-index: 2;
      flex-shrink: 0;
    }
    .footer-url {
      font-size: 20px; font-weight: 700;
      color: #2e86c1; letter-spacing: -0.3px;
    }

    /* === TEXT STYLES === */
    .tag {
      display: inline-block;
      font-size: 16px; font-weight: 700;
      padding: 10px 24px; border-radius: 24px;
      text-transform: uppercase; letter-spacing: 2px;
      margin-bottom: 28px;
      width: fit-content;
    }
    .tag-filled { background: #2e86c1; color: white; }
    .tag-outline { background: rgba(46,134,193,0.12); color: #2e86c1; }

    .headline {
      font-size: 72px; font-weight: 900;
      color: #1a1a2e; line-height: 1.1;
      letter-spacing: -3px; margin-bottom: 28px;
    }

    .subtext {
      font-size: 30px; font-weight: 500;
      color: #4b5563; line-height: 1.5;
    }

    .accent-line {
      width: 60px; height: 5px;
      background: #2e86c1; border-radius: 3px;
      margin: 32px 0;
    }

    .callout-box {
      font-size: 30px; font-weight: 600; color: #2e86c1;
      line-height: 1.5;
      padding: 32px 36px;
      background: rgba(255,255,255,0.75);
      border-radius: 20px;
      border-left: 5px solid #2e86c1;
    }

    .hashtags {
      display: flex; gap: 10px; margin-top: 24px;
    }
    .hashtag {
      background: rgba(46,134,193,0.1); color: #2e86c1;
      font-size: 16px; font-weight: 700;
      padding: 8px 18px; border-radius: 20px;
    }

    .cta-text {
      margin-top: 24px;
      font-size: 20px; font-weight: 600; color: #9ca3af;
    }

    /* === JOBS === */
    .jobs-number {
      font-size: 180px; font-weight: 900;
      color: #1a1a2e; line-height: 1;
      letter-spacing: -8px; margin-bottom: 0;
    }
    .jobs-number span { color: #2e86c1; }
    .jobs-subtitle {
      font-size: 48px; font-weight: 700;
      color: #374151; letter-spacing: -1px;
      margin-bottom: 36px;
    }
    .jobs-label {
      font-size: 14px; font-weight: 700; color: #9ca3af;
      text-transform: uppercase; letter-spacing: 2px;
      margin-bottom: 14px;
    }
    .jobs-companies { display: flex; flex-wrap: wrap; gap: 10px; }
    .company-chip {
      background: rgba(255,255,255,0.85);
      border: 1.5px solid rgba(46,134,193,0.2);
      padding: 14px 26px; border-radius: 12px;
      font-size: 22px; font-weight: 600; color: #1a1a2e;
    }

    /* === DATA === */
    .bar-row {
      display: flex; align-items: center;
      margin-bottom: 14px; gap: 14px;
    }
    .bar-rank {
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      background: #2e86c1; color: white;
      font-size: 18px; font-weight: 800; border-radius: 10px;
      flex-shrink: 0;
    }
    .bar-info { width: 190px; flex-shrink: 0; }
    .bar-company { font-size: 22px; font-weight: 700; color: #1a1a2e; }
    .bar-count { font-size: 15px; color: #6b7280; font-weight: 500; }
    .bar-track {
      flex: 1; height: 32px;
      background: rgba(255,255,255,0.5);
      border-radius: 8px; overflow: hidden;
      border: 1px solid rgba(46,134,193,0.1);
    }
    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #2e86c1, #5dade2);
      border-radius: 8px;
    }
    .data-total {
      font-size: 20px; font-weight: 500; color: #6b7280;
      margin-top: 16px;
    }
    .data-total strong { color: #2e86c1; font-weight: 800; }

    /* === QUOTE === */
    .quote-mark {
      font-size: 140px; color: #2e86c1;
      font-weight: 900; line-height: 0.5;
      opacity: 0.4; margin-bottom: 28px;
    }
    .quote-text {
      font-size: 56px; font-weight: 700;
      color: #1a1a2e; line-height: 1.2;
      letter-spacing: -1px; margin-bottom: 36px;
    }
    .quote-attr {
      font-size: 24px; color: #6b7280; font-weight: 600;
      padding-left: 20px;
      border-left: 4px solid #2e86c1;
    }
  </style>
</head>
<body>
  <div class="card" id="card" data-theme="light">
    <div class="top-bar"></div>
    <div class="deco-circle-1"></div>
    <div class="deco-circle-2"></div>
    <div class="deco-line"></div>
    <div class="header">
      <img id="logo" src="" alt="Hashtag Web3">
    </div>
    <div class="content" id="content"></div>
    <div class="footer">
      <div class="footer-url">hashtagweb3.com</div>
    </div>
  </div>
</body>
</html>
