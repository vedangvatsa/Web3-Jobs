name: Article Checks

# Hard gates for news publishing. Fails the run when any News article has
# a missing/broken/placeholder hero image or lacks a photo credit, so broken
# article pages can never merge silently again.

on:
  push:
    branches: [main]
    paths:
      - 'content/articles/**'
      - 'public/images/news/**'
      - 'scripts/audit-article*.ts'
      - 'src/app/[slug]/page.tsx'
      - 'src/lib/articles.ts'
      - 'src/types/index.ts'
      - 'next.config.mjs'
  pull_request:
    paths:
      - 'content/articles/**'
      - 'public/images/news/**'
      - 'scripts/audit-article*.ts'
      - 'src/app/[slug]/page.tsx'
      - 'src/lib/articles.ts'
      - 'src/types/index.ts'
      - 'next.config.mjs'

permissions:
  contents: read

jobs:
  article-images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: News hero image audit (hard gate)
        run: npx tsx scripts/audit-article-images.ts

      - name: News duplicate-content audit (hard gate)
        run: npx tsx scripts/audit-article-duplicates.ts

      - name: Typecheck
        run: npx tsc --noEmit
