name: Content Checks

# Hard gates for news publishing. Fails the run when any News article has
# a missing/broken/placeholder hero image or lacks a photo credit, so broken
# article pages can never merge silently again.

on:
  push:
    branches: [main]
    paths:
      - 'content/articles/**'
      - 'public/images/news/**'
      - 'scripts/audit-article*.ts'
      - 'src/app/[slug]/page.tsx'
      - 'src/lib/articles.ts'
      - 'src/types/index.ts'
      - 'next.config.mjs'
      - 'content/jobs*.json'
      - 'content/job-description-shards/**'
      - 'content/events/**'
      - 'src/lib/**'
      - 'src/components/*detail*'
      - 'src/components/event-guide-content.tsx'
      - 'scripts/*formatting*.ts'
      - 'scripts/lib/description-format-checks.ts'
      - 'src/app/globals.css'
      - 'tailwind.config.ts'
      - '.github/workflows/article-checks.yml'
  pull_request:
    paths:
      - 'content/articles/**'
      - 'public/images/news/**'
      - 'scripts/audit-article*.ts'
      - 'src/app/[slug]/page.tsx'
      - 'src/lib/articles.ts'
      - 'src/types/index.ts'
      - 'next.config.mjs'
      - 'content/jobs*.json'
      - 'content/job-description-shards/**'
      - 'content/events/**'
      - 'src/lib/**'
      - 'src/components/*detail*'
      - 'src/components/event-guide-content.tsx'
      - 'scripts/*formatting*.ts'
      - 'scripts/lib/description-format-checks.ts'
      - 'src/app/globals.css'
      - 'tailwind.config.ts'
      - '.github/workflows/article-checks.yml'

permissions:
  contents: read

jobs:
  article-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: News hero image audit (hard gate)
        run: npx tsx scripts/audit-article-images.ts

      - name: News duplicate-content audit (hard gate)
        run: npx tsx scripts/audit-article-duplicates.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Job and event formatting regression tests
        run: npm run test:jobs-catalog && npm run test:detail-formatting

      - name: Validate company job associations
        run: npx tsx scripts/precompute-companies-runtime.ts && npx tsx scripts/generate-slug-types.ts && npm run test:company-jobs

      - name: Audit every published job and event description
        run: npm run audit:detail-formatting

      - name: Install browser for formatting checks
        run: npx playwright install --with-deps chromium

      - name: Check desktop and mobile description layouts
        run: npm run test:detail-formatting:browser
