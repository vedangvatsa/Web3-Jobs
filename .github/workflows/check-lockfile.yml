name: Check package lockfile

# Every pull request: lockfile must match package.json before merge.
# Push to main when package files change: catch direct commits that skip PR.
on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
  pull_request:
  workflow_dispatch:

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm run check:lockfile