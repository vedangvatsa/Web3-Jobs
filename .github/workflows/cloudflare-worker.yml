name: Cloudflare Worker deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wrangler.jsonc'
      - 'open-next.config.ts'
      - 'scripts/cf-opennext-prep.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.mjs'
      - 'src/**'
      - 'content/**'
      - 'public/**'
      - '.github/workflows/cloudflare-worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENNEXT_CLOUDFLARE: "1"
      FAH_FAST_PREBUILD: "1"
      CF_CONTAINER_BUILD: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Next.js and OpenNext worker
        run: npm run build:cloudflare
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.164.0 deploy