name: Cloudflare Worker deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wrangler.jsonc'
      - 'open-next.config.ts'
      - 'scripts/cf-opennext-prep.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.mjs'
      - 'src/**'
      - 'content/**'
      - 'public/**'
      - '.github/workflows/cloudflare-worker.yml'
  # GITHUB_TOKEN catalogue pushes from ingest do not fire push workflows.
  workflow_run:
    workflows: ['Refresh Jobs Ingest (daily)']
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: >-
      ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENNEXT_CLOUDFLARE: "1"
      FAH_FAST_PREBUILD: "1"
      CF_CONTAINER_BUILD: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          # Ingest may push a newer catalogue commit after workflow_run.head_sha was recorded.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Next.js and OpenNext worker
        run: npm run build:cloudflare
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set_secret() { printf '%s' "$2" | npx wrangler@4.164.0 secret put "$1"; }
          set_secret NEXT_PUBLIC_FIREBASE_API_KEY "${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}"
          set_secret NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN "${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}"
          set_secret NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET "${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}"
          set_secret NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID "${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}"
          set_secret NEXT_PUBLIC_FIREBASE_APP_ID "${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}"
          npx wrangler@4.164.0 deploy