name: Cloudflare Worker deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wrangler.jsonc'
      - 'cloudflare/**'
      - '.github/workflows/cloudflare-worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Deploy workers.dev mirror
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy