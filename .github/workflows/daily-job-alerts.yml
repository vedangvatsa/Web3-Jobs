name: Daily Job Alerts (Resend Broadcast)

on:
  schedule:
    # Run daily at 9:00 AM IST (03:30 UTC; GitHub cron is UTC-only)
    # Sends to the Resend audience segment as a broadcast (unlimited capacity)
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate without sending (creates + deletes a draft)'
        type: boolean
        default: false
jobs:
  send-job-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Send job alerts broadcast
        run: |
          ARGS="--limit 10"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          npx tsx scripts/send-resend-broadcast.ts $ARGS
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_SEGMENT_ID: ${{ secrets.RESEND_SEGMENT_ID }}
          EMAIL_FROM: Alex <alex@hi.hashtagweb3.com>
          NEXT_PUBLIC_SITE_URL: https://hashtagweb3.com

      - name: Commit back sent-job state
        if: ${{ inputs.dry_run != true }}
        run: |
          git add .resend-broadcast-sent.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No state changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: record broadcast-sent job ids [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main || true
              git push origin main && break
              sleep 2
            done
          fi
