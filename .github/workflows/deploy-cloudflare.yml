name: Deploy Cloudflare Worker (disabled)

# Production is Firebase App Hosting only. Re-enable only if Cloudflare is live again.
on:
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore job/company OG PNG cache
        uses: actions/cache@v4
        with:
          path: public/og
          key: og-cards-${{ hashFiles('content/jobs-runtime.json', 'scripts/precompute-og-images.ts') }}
          restore-keys: |
            og-cards-

      - name: Regenerate OG PNGs + preview shells (fingerprint-gated, fast when fresh)
        run: |
          npm run precompute:og-images
          npm run precompute:og-previews

      - name: Assert OG/preview assets generated
        run: npx tsx scripts/assert-og-assets.ts

      - name: Build for Cloudflare
        run: npm run build:cloudflare

      - name: Assert OG/preview assets bundled
        run: npx tsx scripts/assert-og-assets.ts --bundled

      - name: Deploy to Cloudflare
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke-test deployed pages and catalog assets
        run: npm run smoke:site
        env:
          SITE_TEST_BASE_URL: https://hashtagweb3.com
