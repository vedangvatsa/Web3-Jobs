name: Draft resources broadcast (one-off)
# ONE-OFF helper: creates an unsent Resend broadcast draft. Delete after use.
on:
  workflow_dispatch:
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npx tsx scripts/create-resources-broadcast-draft.ts
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
