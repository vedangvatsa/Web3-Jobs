name: FAH Cloud Run bypass deploy
on: workflow_dispatch
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_APPHOSTING_SERVICE_ACCOUNT_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: web3-jobs-aggregator
      - name: Probe Cloud Build + Cloud Run perms
        run: |
          set +e
          echo "=== whoami ==="
          python3 -c "import json,os; print(json.load(open(os.environ['GOOGLE_APPLICATION_CREDENTIALS']))['client_email'])"
          echo "=== builds submit dry? ==="
          # minimal empty build to test permission
          mkdir -p /tmp/cb && echo 'steps: [{name: "ubuntu", args: ["echo","hi"]}]' > /tmp/cb/cloudbuild.yaml
          echo 'ok' > /tmp/cb/hello.txt
          (cd /tmp/cb && gcloud builds submit --project=web3-jobs-aggregator --config=cloudbuild.yaml --no-source 2>&1 | head -20)
          (cd /tmp/cb && gcloud builds submit --project=web3-jobs-aggregator --config=cloudbuild.yaml . 2>&1 | head -40)
          echo "=== describe run service studio ==="
          gcloud run services describe studio --region=us-central1 --project=web3-jobs-aggregator 2>&1 | head -40
          gcloud run services describe web3-jobs --region=asia-south1 --project=web3-jobs-aggregator 2>&1 | head -40
          echo "=== AR repos ==="
          gcloud artifacts repositories list --project=web3-jobs-aggregator 2>&1 | head -20
          echo "=== try enable trigger ==="
          gcloud builds triggers update github 93fa7e84-db0f-4e83-bdcc-75633460b34c --project=web3-jobs-aggregator --region=global --clear-disabled 2>&1 | head -20
