name: FAH fix secrets and deploy
on:
  workflow_dispatch:
    inputs:
      grant_only:
        description: 'Only grant Firebase App Hosting admin. Do not build or roll out'
        type: boolean
        default: false
  workflow_call:

concurrency:
  group: fah-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/227783834156/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'antigravity-agent@web3-jobs-aggregator.iam.gserviceaccount.com'
      - uses: google-github-actions/setup-gcloud@v2
      - name: Grant deploy role + actAs on the App Hosting compute SA
        id: grant
        continue-on-error: true
        run: |
          set -euo pipefail
          SA="antigravity-agent@web3-jobs-aggregator.iam.gserviceaccount.com"
          echo "Granting roles/firebaseapphosting.admin to $SA"
          gcloud projects add-iam-policy-binding web3-jobs-aggregator \
            --member="serviceAccount:${SA}" \
            --role="roles/firebaseapphosting.admin" \
            --quiet
          echo "Granting roles/iam.serviceAccountUser on the App Hosting compute SA to $SA"
          gcloud iam service-accounts add-iam-policy-binding \
            firebase-app-hosting-compute@web3-jobs-aggregator.iam.gserviceaccount.com \
            --member="serviceAccount:${SA}" \
            --role="roles/iam.serviceAccountUser" \
            --quiet
      - name: Stop if this run cannot grant the deploy role
        if: ${{ inputs.grant_only == true && steps.grant.outcome != 'success' }}
        run: |
          echo "The deploy service account cannot grant itself Firebase App Hosting Admin."
          echo "An Owner of web3-jobs-aggregator has to add roles/firebaseapphosting.admin to antigravity-agent@web3-jobs-aggregator.iam.gserviceaccount.com."
          exit 1
      - uses: actions/setup-node@v4
        if: ${{ inputs.grant_only != true }}
        with:
          node-version: '22'
      - name: Grant App Hosting secret access + sync values
        if: ${{ inputs.grant_only != true }}
        env:
          FIREBASE_APPHOSTING_PROJECT_ID: web3-jobs-aggregator
          FIREBASE_APPHOSTING_BACKEND: studio
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          npm install -g firebase-tools@latest
          chmod +x scripts/sync-firebase-apphosting-secrets.sh
          bash scripts/sync-firebase-apphosting-secrets.sh
          # Explicit grant for the key that broke builds
          firebase apphosting:secrets:grantaccess NEXT_PUBLIC_FIREBASE_API_KEY \
            --project web3-jobs-aggregator \
            --backend studio \
            --non-interactive || true
      - name: Preflight - verify deploy permissions (fail fast)
        if: ${{ inputs.grant_only != true }}
        run: |
          set -euo pipefail
          TOKEN=$(gcloud auth print-access-token)
          ACTAS=$(curl -s -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            "https://iam.googleapis.com/v1/projects/-/serviceAccounts/firebase-app-hosting-compute@web3-jobs-aggregator.iam.gserviceaccount.com:testIamPermissions" \
            -d '{"permissions":["iam.serviceAccounts.actAs"]}')
          echo "actAs check: $ACTAS"
          if ! echo "$ACTAS" | python3 -c 'import sys,json; sys.exit(0 if "iam.serviceAccounts.actAs" in json.load(sys.stdin).get("permissions", []) else 1)'; then
            echo "PERMISSION GAP: the deploy service account cannot actAs firebase-app-hosting-compute@."
            echo "Fix (project Owner, one time): IAM & Admin -> IAM -> antigravity-agent@web3-jobs-aggregator.iam.gserviceaccount.com -> Grant access -> Role: Service Account User -> Save."
            echo "Aborting before creating a build that is guaranteed to 403."
            exit 1
          fi
          echo "Deploy permissions OK."
      - name: Create build + rollout for main
        if: ${{ inputs.grant_only != true }}
        run: |
          set -euo pipefail
          TOKEN=$(gcloud auth print-access-token)
          BUILD_ID="manual-$(date +%s)"
          echo "Creating build $BUILD_ID"
          RESP=$(curl -s -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            "https://firebaseapphosting.googleapis.com/v1beta/projects/web3-jobs-aggregator/locations/us-central1/backends/studio/builds?buildId=${BUILD_ID}" \
            -d '{"source":{"codebase":{"branch":"main"}}}')
          echo "$RESP" | head -c 3000
          echo
          if ! echo "$RESP" | python3 -c 'import sys,json; d=json.load(sys.stdin); sys.exit(0 if d.get("name") and not d.get("error") else 1)'; then
            echo "Build was not created. The deploy service account needs roles/firebaseapphosting.admin on web3-jobs-aggregator."
            exit 1
          fi
          # Poll build until READY or FAILED
          for i in $(seq 1 60); do
            B=$(curl -s -H "Authorization: Bearer $TOKEN" \
              "https://firebaseapphosting.googleapis.com/v1beta/projects/web3-jobs-aggregator/locations/us-central1/backends/studio/builds/${BUILD_ID}")
            STATE=$(echo "$B" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("state") or d.get("error",{}).get("message","unknown"))')
            echo "build state: $STATE"
            if echo "$STATE" | grep -qiE 'READY|FAILED|error|PERMISSION|denied|not found'; then
              echo "$B" | head -c 4000
              break
            fi
            sleep 30
          done
          if ! echo "$STATE" | grep -qi READY; then
            echo "Build did not become READY"
            exit 1
          fi
          ROLLOUT_ID="rollout-manual-$(date +%s)"
          echo "Creating rollout $ROLLOUT_ID"
          curl -s -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            "https://firebaseapphosting.googleapis.com/v1beta/projects/web3-jobs-aggregator/locations/us-central1/backends/studio/rollouts?rolloutId=${ROLLOUT_ID}" \
            -d "{\"build\":\"projects/web3-jobs-aggregator/locations/us-central1/backends/studio/builds/${BUILD_ID}\"}" | head -c 3000
          echo
          for i in $(seq 1 40); do
            R=$(curl -s -H "Authorization: Bearer $TOKEN" \
              "https://firebaseapphosting.googleapis.com/v1beta/projects/web3-jobs-aggregator/locations/us-central1/backends/studio/rollouts/${ROLLOUT_ID}")
            RS=$(echo "$R" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("state") or d.get("error",{}).get("message","unknown"))')
            echo "rollout state: $RS"
            if echo "$RS" | grep -qiE 'SUCCEEDED|FAILED|error'; then
              echo "$R" | head -c 2000
              break
            fi
            sleep 30
          done
          echo "$RS" | grep -qi SUCCEEDED
