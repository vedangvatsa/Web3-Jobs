name: FAH fix secrets and deploy
on:
  workflow_dispatch:
    inputs:
      grant_only:
        description: 'Only grant Firebase App Hosting admin. Do not build or roll out'
        type: boolean
        default: false
      sync_secrets:
        description: 'Explicit repair: synchronize App Hosting secrets and their access before deployment'
        type: boolean
        default: false
  workflow_call:
    inputs:
      date:
        description: 'UTC date of the single scheduled jobs and original-news rollout'
        type: string
        required: true
      sync_secrets:
        type: boolean
        default: false

concurrency:
  group: fah-deploy
  # Cancelling a run mid-poll strands its durable claim, so later runs queue instead.
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    # Must stay below STALE_CLAIM_MS in scripts/lib/daily-deploy.mjs (3 hours).
    timeout-minutes: 120
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test daily deployment policy
        run: node --test scripts/lib/daily-deploy.test.mjs
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/416755535358/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deployer@hashtagweb3-97583.iam.gserviceaccount.com'
      - uses: google-github-actions/setup-gcloud@v2
      - name: Recheck daily content and deployment state under the deployment lock
        id: plan
        env:
          DAILY_DEPLOY_DATE: ${{ inputs.date }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/daily-deploy.mjs plan
      - name: Grant deploy role + actAs on the App Hosting compute SA
        if: ${{ steps.plan.outputs.run == 'true' && inputs.grant_only == true }}
        id: grant
        continue-on-error: true
        run: |
          set -euo pipefail
          SA="github-deployer@hashtagweb3-97583.iam.gserviceaccount.com"
          echo "Granting roles/firebaseapphosting.admin to $SA"
          gcloud projects add-iam-policy-binding hashtagweb3-97583 \
            --member="serviceAccount:${SA}" \
            --role="roles/firebaseapphosting.admin" \
            --quiet
          echo "Granting roles/iam.serviceAccountUser on the App Hosting compute SA to $SA"
          gcloud iam service-accounts add-iam-policy-binding \
            firebase-app-hosting-compute@hashtagweb3-97583.iam.gserviceaccount.com \
            --member="serviceAccount:${SA}" \
            --role="roles/iam.serviceAccountUser" \
            --quiet
      - name: Preflight - verify deploy permissions (fail fast)
        if: ${{ steps.plan.outputs.run == 'true' }}
        id: preflight
        run: |
          set -euo pipefail
          TOKEN=$(gcloud auth print-access-token)
          ACTAS=$(curl -s -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            "https://iam.googleapis.com/v1/projects/-/serviceAccounts/firebase-app-hosting-compute@hashtagweb3-97583.iam.gserviceaccount.com:testIamPermissions" \
            -d '{"permissions":["iam.serviceAccounts.actAs"]}')
          echo "actAs check: $ACTAS"
          if ! echo "$ACTAS" | python3 -c 'import sys,json; sys.exit(0 if "iam.serviceAccounts.actAs" in json.load(sys.stdin).get("permissions", []) else 1)'; then
            echo "PERMISSION GAP: the deploy service account cannot actAs firebase-app-hosting-compute@."
            echo "Fix (project Owner, one time): IAM & Admin -> IAM -> github-deployer@hashtagweb3-97583.iam.gserviceaccount.com -> Grant access -> Role: Service Account User -> Save."
            echo "Aborting before creating a build that is guaranteed to 403."
            exit 1
          fi
          echo "Deploy permissions OK."
      - name: Stop if grant_only (permissions verified above)
        if: ${{ inputs.grant_only == true }}
        run: |
          echo "grant_only: effective deploy permissions verified, stopping before any build or rollout."
          exit 0
      - name: Verify secret synchronization behavior
        if: ${{ steps.plan.outputs.run == 'true' && inputs.grant_only != true }}
        run: node --test scripts/test-apphosting-secret-sync.mjs
      - name: Grant App Hosting secret access + sync values
        if: ${{ steps.plan.outputs.run == 'true' && inputs.grant_only != true && inputs.sync_secrets == true }}
        env:
          FIREBASE_APPHOSTING_PROJECT_ID: hashtagweb3-97583
          FIREBASE_APPHOSTING_BACKEND: web
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          npm install -g firebase-tools@latest
          chmod +x scripts/sync-firebase-apphosting-secrets.sh
          bash scripts/sync-firebase-apphosting-secrets.sh
          # Explicit grant for the key that broke builds
          firebase apphosting:secrets:grantaccess NEXT_PUBLIC_FIREBASE_API_KEY \
            --project hashtagweb3-97583 \
            --backend web \
            --non-interactive || true
      - name: Deploy the validated daily jobs and news revision
        id: daily
        if: ${{ steps.plan.outputs.mode == 'daily' && steps.plan.outputs.run == 'true' }}
        env:
          DAILY_DEPLOY_DATE: ${{ inputs.date }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export FIREBASE_ACCESS_TOKEN="$(gcloud auth print-access-token)"
          node scripts/daily-deploy.mjs deploy
      - name: Create explicit operator build + rollout for main
        id: manual
        if: ${{ steps.plan.outputs.mode == 'manual' && inputs.grant_only != true }}
        run: |
          set -euo pipefail
          TOKEN=$(gcloud auth print-access-token)
          BUILD_ID="manual-$(date +%s)"
          echo "DEPLOY_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "Creating build $BUILD_ID"
          RESP=$(curl -s -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            "https://firebaseapphosting.googleapis.com/v1beta/projects/hashtagweb3-97583/locations/us-central1/backends/web/builds?buildId=${BUILD_ID}" \
            -d '{"source":{"codebase":{"branch":"main"}}}')
          echo "$RESP"
          if ! echo "$RESP" | python3 -c 'import sys,json; d=json.load(sys.stdin); sys.exit(0 if d.get("name") and not d.get("error") else 1)'; then
            if echo "$RESP" | grep -q 'unable to queue the operation'; then
              echo "Build not queued (409): another App Hosting build is already in flight for backend web."
              echo "Wait for it in Firebase Console (App Hosting → web → Activity) or cancel the other Actions run, then retry once."
              exit 1
            fi
            echo "Build was not created. Grant roles/firebaseapphosting.admin to the deploy service account on hashtagweb3-97583."
            exit 1
          fi
          # Poll build until READY or FAILED (refresh token each round; OAuth expires ~60m)
          for i in $(seq 1 160); do
            TOKEN=$(gcloud auth print-access-token)
            B=$(curl -s -H "Authorization: Bearer $TOKEN" \
              "https://firebaseapphosting.googleapis.com/v1beta/projects/hashtagweb3-97583/locations/us-central1/backends/web/builds/${BUILD_ID}")
            STATE=$(echo "$B" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("state") or "")')
            if [ -z "$STATE" ]; then
              MSG=$(echo "$B" | python3 -c 'import sys,json; d=json.load(sys.stdin); e=d.get("error",{}); print((e.get("message") or e.get("status") or "unknown")[:240])')
              echo "build poll: $MSG"
              if echo "$MSG" | grep -qi 'invalid authentication credentials'; then
                echo "::error::Poll used rejected OAuth credentials. This run is obsolete; cancel it and re-run FAH deploy on main (token refresh each poll)."
                exit 1
              fi
            else
              echo "build state: $STATE"
            fi
            if echo "$STATE" | grep -qiE '^(READY|FAILED|CANCELLED)$'; then
              echo "$B"
              break
            fi
            sleep 30
          done
          if ! echo "$STATE" | grep -qi READY; then
            echo "Build did not become READY"
            exit 1
          fi
          ROLLOUT_ID="rollout-manual-$(date +%s)"
          echo "Creating rollout $ROLLOUT_ID"
          curl -s -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            "https://firebaseapphosting.googleapis.com/v1beta/projects/hashtagweb3-97583/locations/us-central1/backends/web/rollouts?rolloutId=${ROLLOUT_ID}" \
            -d "{\"build\":\"projects/hashtagweb3-97583/locations/us-central1/backends/web/builds/${BUILD_ID}\"}"
          for i in $(seq 1 40); do
            TOKEN=$(gcloud auth print-access-token)
            R=$(curl -s -H "Authorization: Bearer $TOKEN" \
              "https://firebaseapphosting.googleapis.com/v1beta/projects/hashtagweb3-97583/locations/us-central1/backends/web/rollouts/${ROLLOUT_ID}")
            RS=$(echo "$R" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("state") or "")')
            if [ -z "$RS" ]; then
              echo "$R" | python3 -c 'import sys,json; d=json.load(sys.stdin); e=d.get("error",{}); print((e.get("message") or e.get("status") or "unknown")[:240])' | sed 's/^/rollout poll: /'
            else
              echo "rollout state: $RS"
            fi
            if echo "$RS" | grep -qiE '^(SUCCEEDED|FAILED|CANCELLED)$'; then
              echo "$R"
              break
            fi
            sleep 30
          done
          echo "$RS" | grep -qi SUCCEEDED
      - name: Verify live catalogues match the new deployment
        if: ${{ steps.daily.outputs.deployed == 'true' || steps.manual.outcome == 'success' }}
        run: node scripts/verify-live-catalogs.mjs
      - name: Preserve daily deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: .cache/daily-deploy/
          if-no-files-found: ignore
          retention-days: 90
