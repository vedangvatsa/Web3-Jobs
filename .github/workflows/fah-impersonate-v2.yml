name: FAH impersonate v2
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_APPHOSTING_SERVICE_ACCOUNT_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: web3-jobs-aggregator
      - name: Try impersonation paths
        run: |
          set +e
          TOKEN=$(gcloud auth print-access-token)
          for SA in \
            firebase-app-hosting-compute@web3-jobs-aggregator.iam.gserviceaccount.com \
            227783834156-compute@developer.gserviceaccount.com \
            firebase-adminsdk-fbsvc@web3-jobs-aggregator.iam.gserviceaccount.com
          do
            echo "=== impersonate $SA ==="
            gcloud auth print-access-token --impersonate-service-account="$SA" 2>&1 | head -8
            IT=$(gcloud auth print-access-token --impersonate-service-account="$SA" 2>/dev/null || true)
            if [ -n "$IT" ]; then
              BUILD_ID="imp-$(date +%s)"
              echo "Creating build as $SA id=$BUILD_ID"
              curl -s -X POST -H "Authorization: Bearer $IT" -H 'Content-Type: application/json' \
                "https://firebaseapphosting.googleapis.com/v1beta/projects/web3-jobs-aggregator/locations/us-central1/backends/studio/builds?buildId=${BUILD_ID}" \
                -d '{"source":{"codebase":{"branch":"main"}}}' | head -c 2500
              echo
            fi
          done
          echo "=== List FAH builds ==="
          curl -s -H "Authorization: Bearer $TOKEN" \
            'https://firebaseapphosting.googleapis.com/v1beta/projects/web3-jobs-aggregator/locations/us-central1/backends/studio/builds?pageSize=15' \
            > /tmp/builds.json
          python3 -c 'import json;d=json.load(open("/tmp/builds.json"));
[print(b.get("state"), (b.get("createTime") or "")[:19], b.get("name","").split("/")[-1], ((b.get("source") or {}).get("codebase") or {}).get("hash","")[:8], (((b.get("source") or {}).get("codebase") or {}).get("commitMessage") or "")[:60]) for b in d.get("builds") or []]'
