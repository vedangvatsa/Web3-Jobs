name: FAH probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_APPHOSTING_SERVICE_ACCOUNT_KEY || secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Probe permissions
        run: |
          set +e
          gcloud config set project web3-jobs-aggregator
          echo '=== SA email ==='
          python3 -c "import json,os; print(json.load(open(os.environ['GOOGLE_APPLICATION_CREDENTIALS']))['client_email'])"
          echo '=== backends get ==='
          npx -y firebase-tools@latest apphosting:backends:get studio --project web3-jobs-aggregator --non-interactive
          echo '=== builds list ==='
          gcloud builds list --limit=5 --format='table(id,status,createTime,source.repoSource.revision)' 2>&1 | head -20
          echo '=== run services ==='
          gcloud run services list --region=us-central1 2>&1 | head -20
          echo '=== enable developerconnect? ==='
          gcloud services enable developerconnect.googleapis.com 2>&1 | head -10
          echo '=== iam policy SA roles snippet ==='
          gcloud projects get-iam-policy web3-jobs-aggregator --flatten='bindings[].members' --filter='bindings.members:serviceAccount' --format='table(bindings.role)' 2>&1 | head -40
