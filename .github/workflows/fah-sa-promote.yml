name: FAH SA promote and deploy
on: workflow_dispatch
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Auth with FIREBASE_SERVICE_ACCOUNT_KEY
        id: auth_primary
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Inspect SA and attempt IAM + build
        env:
          APPHOSTING_KEY: ${{ secrets.FIREBASE_APPHOSTING_SERVICE_ACCOUNT_KEY }}
        run: |
          set -euo pipefail
          echo "=== Primary SA ==="
          python3 -c "import json,os; print(json.load(open(os.environ['GOOGLE_APPLICATION_CREDENTIALS']))['client_email'])"
          TOKEN=$(gcloud auth print-access-token)
          echo "=== Test builds.create with primary ==="
          BUILD_ID="manual-$(date +%s)"
          RESP=$(curl -s -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            "https://firebaseapphosting.googleapis.com/v1beta/projects/web3-jobs-aggregator/locations/us-central1/backends/studio/builds?buildId=${BUILD_ID}" \
            -d '{"source":{"codebase":{"branch":"main"}}}')
          echo "$RESP" | head -c 2500
          echo
          if echo "$RESP" | grep -q '"name"'; then
            echo "BUILD_OK=$BUILD_ID" >> "$GITHUB_ENV"
            echo "CREATE_OK=1" >> "$GITHUB_ENV"
          else
            echo "Primary cannot create builds; trying IAM grant + apphosting SA"
            # Grant App Hosting Admin + Developer Connect Viewer to antigravity-agent if we can
            AGENT="serviceAccount:antigravity-agent@web3-jobs-aggregator.iam.gserviceaccount.com"
            for ROLE in \
              roles/firebase.admin \
              roles/firebaseapphosting.admin \
              roles/developerconnect.admin \
              roles/secretmanager.admin
            do
              gcloud projects add-iam-policy-binding web3-jobs-aggregator \
                --member="$AGENT" \
                --role="$ROLE" \
                --condition=None 2>&1 | tail -5 || true
            done
            # Re-auth as apphosting SA and retry
            echo "$APPHOSTING_KEY" > /tmp/apphosting-sa.json
            gcloud auth login --cred-file=/tmp/apphosting-sa.json --quiet || true
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/apphosting-sa.json
            gcloud auth activate-service-account --key-file=/tmp/apphosting-sa.json
            TOKEN=$(gcloud auth print-access-token)
            echo "=== Apphosting SA email ==="
            python3 -c "import json; print(json.load(open('/tmp/apphosting-sa.json'))['client_email'])"
            BUILD_ID="manual-$(date +%s)"
            RESP=$(curl -s -X POST \
              -H "Authorization: Bearer $TOKEN" \
              -H 'Content-Type: application/json' \
              "https://firebaseapphosting.googleapis.com/v1beta/projects/web3-jobs-aggregator/locations/us-central1/backends/studio/builds?buildId=${BUILD_ID}" \
              -d '{"source":{"codebase":{"branch":"main"}}}')
            echo "$RESP" | head -c 2500
            echo
            if echo "$RESP" | grep -q '"name"'; then
              echo "BUILD_OK=$BUILD_ID" >> "$GITHUB_ENV"
              echo "CREATE_OK=1" >> "$GITHUB_ENV"
            else
              echo "CREATE_OK=0" >> "$GITHUB_ENV"
              # Also try firebase CLI rollout with primary key restored
              echo "$APPHOSTING_KEY" >/dev/null
            fi
          fi

      - name: Poll build and create rollout
        if: env.CREATE_OK == '1'
        run: |
          set -euo pipefail
          TOKEN=$(gcloud auth print-access-token)
          BUILD_ID="${BUILD_OK}"
          for i in $(seq 1 80); do
            B=$(curl -s -H "Authorization: Bearer $TOKEN" \
              "https://firebaseapphosting.googleapis.com/v1beta/projects/web3-jobs-aggregator/locations/us-central1/backends/studio/builds/${BUILD_ID}")
            STATE=$(echo "$B" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("state") or d.get("error",{}).get("message","unknown"))')
            echo "build state: $STATE"
            if echo "$STATE" | grep -qiE 'READY|FAILED|error|PERMISSION'; then
              echo "$B" | head -c 5000
              break
            fi
            sleep 30
          done
          echo "$STATE" | grep -qi READY
          ROLLOUT_ID="rollout-manual-$(date +%s)"
          curl -s -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            "https://firebaseapphosting.googleapis.com/v1beta/projects/web3-jobs-aggregator/locations/us-central1/backends/studio/rollouts?rolloutId=${ROLLOUT_ID}" \
            -d "{\"build\":\"projects/web3-jobs-aggregator/locations/us-central1/backends/studio/builds/${BUILD_ID}\"}" | head -c 3000
          echo
          for i in $(seq 1 40); do
            R=$(curl -s -H "Authorization: Bearer $TOKEN" \
              "https://firebaseapphosting.googleapis.com/v1beta/projects/web3-jobs-aggregator/locations/us-central1/backends/studio/rollouts/${ROLLOUT_ID}")
            RS=$(echo "$R" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("state") or d.get("error",{}).get("message","unknown"))')
            echo "rollout state: $RS"
            if echo "$RS" | grep -qiE 'SUCCEEDED|FAILED|error'; then
              echo "$R" | head -c 2000
              break
            fi
            sleep 30
          done
          echo "$RS" | grep -qi SUCCEEDED

      - name: Fail if create blocked
        if: env.CREATE_OK != '1'
        run: |
          echo "Could not create FAH build with available service accounts"
          exit 1
