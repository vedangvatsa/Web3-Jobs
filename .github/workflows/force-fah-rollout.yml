name: Force Firebase App Hosting rollout

on:
  workflow_dispatch:
    inputs:
      backend:
        description: App Hosting backend ID
        required: true
        default: web3-jobs-aggregator
      project_id:
        description: Firebase / GCP project ID
        required: true
        default: web3-jobs-aggregator
      git_commit:
        description: Git commit SHA to deploy (empty = current main HEAD)
        required: false
        default: ''

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_APPHOSTING_SERVICE_ACCOUNT_KEY || secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create App Hosting rollout
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          BACKEND_ID: ${{ inputs.backend }}
          GIT_COMMIT: ${{ inputs.git_commit }}
        run: |
          set -euo pipefail
          npm install -g firebase-tools@latest
          COMMIT="${GIT_COMMIT:-}"
          if [ -z "$COMMIT" ]; then
            COMMIT="$(git rev-parse HEAD)"
          fi
          echo "Creating rollout for backend=$BACKEND_ID project=$PROJECT_ID commit=$COMMIT"
          firebase apphosting:backends:list --project "$PROJECT_ID" --non-interactive || true
          firebase apphosting:rollouts:create "$BACKEND_ID" \
            --project "$PROJECT_ID" \
            --git-commit "$COMMIT" \
            --force \
            --non-interactive
