name: Force Firebase App Hosting rollout

on:
  workflow_dispatch:
    inputs:
      backend:
        description: App Hosting backend ID
        required: true
        default: studio
      project_id:
        description: Firebase / GCP project ID
        required: true
        default: web3-jobs-aggregator
      git_commit:
        description: Git commit SHA to deploy (empty = current main HEAD)
        required: false
        default: ''

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_APPHOSTING_SERVICE_ACCOUNT_KEY || secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create App Hosting rollout
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          BACKEND_ID: ${{ inputs.backend }}
          GIT_COMMIT: ${{ inputs.git_commit }}
        run: |
          set -euo pipefail
          npm install -g firebase-tools@latest
          echo "Listing backends..."
          firebase apphosting:backends:list --project "$PROJECT_ID" --non-interactive
          if [ -n "${GIT_COMMIT:-}" ]; then
            echo "Creating rollout for backend=$BACKEND_ID project=$PROJECT_ID commit=$GIT_COMMIT"
            firebase apphosting:rollouts:create "$BACKEND_ID" \
              --project "$PROJECT_ID" \
              --git-commit "$GIT_COMMIT" \
              --force \
              --non-interactive
          else
            echo "Creating rollout for backend=$BACKEND_ID project=$PROJECT_ID branch=main"
            firebase apphosting:rollouts:create "$BACKEND_ID" \
              --project "$PROJECT_ID" \
              --git-branch main \
              --force \
              --non-interactive
          fi
