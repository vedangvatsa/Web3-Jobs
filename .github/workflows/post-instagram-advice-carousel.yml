name: Post Daily Instagram Advice Carousel

on:
  schedule:
    # 6:00 PM IST / 12:30 PM UTC
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Render and preview without publishing'
        type: boolean
        default: false

concurrency:
  group: instagram-advice-carousel
  cancel-in-progress: false

jobs:
  post-carousel:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Render and post advice carousel
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID || '17841473830256790' }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          npx tsx scripts/social/post-advice-carousel.ts $ARGS

      - name: Commit carousel state
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/social/carousels-posted.json
          if git diff --staged --quiet; then
            echo "No carousel state changes to commit."
          else
            git commit -m "chore(social): update Instagram carousel state [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
