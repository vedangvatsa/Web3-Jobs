name: Post Job Openings to X, Threads, Bluesky, Farcaster, LinkedIn, Facebook, Reddit & Instagram

on:
  schedule:
    # Runs 8 times a day (every 3 hours): 01:21, 04:21, 07:21, 10:21, 13:21, 16:21, 19:21, 22:21 UTC
    # Off-peak minute :21 prevents GitHub Actions queue delays and dropped events
    - cron: '21 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform (all, x, threads, bluesky, farcaster, linkedin, facebook, reddit, instagram)'
        type: choice
        options:
          - all
          - x
          - threads
          - bluesky
          - farcaster
          - linkedin
          - facebook
          - reddit
          - instagram
        default: all
      dry_run:
        description: 'Dry run mode (preview without posting)'
        type: boolean
        default: false
      slug:
        description: 'Optional specific job slug to post'
        type: string
        default: ''
      force:
        description: 'Republish a platform even if its post was already recorded'
        type: boolean
        default: false

concurrency:
  group: social-job-postings
  cancel-in-progress: false

jobs:
  post-opening:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Post Job Opening
        id: publish
        continue-on-error: true
        env:
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          BLUESKY_HANDLE: hashtagweb3.bsky.social
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          NEYNAR_API_KEY: ${{ secrets.NEYNAR_API_KEY }}
          FARCASTER_SIGNER_UUID: ${{ secrets.FARCASTER_SIGNER_UUID }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUFFER_LINKEDIN_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_CHANNEL_ID || '69c5b139af47dacb695b5feb' }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID || '17841473830256790' }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          SOCIAL_PLATFORM: ${{ github.event.inputs.platform || 'all' }}
          SOCIAL_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          SOCIAL_SLUG: ${{ github.event.inputs.slug || '' }}
          SOCIAL_FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          ARGS=(--platform "$SOCIAL_PLATFORM")
          if [ "$SOCIAL_DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ -n "$SOCIAL_SLUG" ]; then
            ARGS+=(--slug "$SOCIAL_SLUG")
          fi
          if [ "$SOCIAL_FORCE" = "true" ]; then
            ARGS+=(--force)
          fi
          echo "Running social poster for platform: $SOCIAL_PLATFORM"
          npx tsx scripts/social/post-job-openings.ts "${ARGS[@]}"

      - name: Let scrapers fetch before redeploy
        # LinkedIn/Meta/X scrape new post URLs within minutes of publishing.
        # Pushing state triggers an ~8 min App Hosting rollout (cold starts),
        # so hold here to let scrapers cache the good render first. Without
        # this wait, every publish is followed ~1 min later by a deploy and
        # scrapes land on migrating instances -> no preview card (cached ~7d).
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          echo "Waiting 15 minutes for link-preview scrapes before pushing state (avoids deploy collision)..."
          sleep 900

      - name: Commit and Push Posted State
        id: persist_state
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/social/jobs-social-posted.json
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore(social): update social job posting state [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main || true
              if git push origin main; then
                exit 0
              fi
              sleep 2
            done
            echo "Unable to push social posting state after three attempts."
            exit 1
          fi

      - name: Fail incomplete social publish or state persistence
        if: ${{ always() && github.event.inputs.dry_run != 'true' && (steps.publish.outcome == 'failure' || steps.persist_state.outcome == 'failure') }}
        run: |
          if [ "${{ steps.publish.outcome }}" = "failure" ]; then
            echo "Social publishing did not verify every requested platform. Any verified partial state was persisted for safe retry."
          fi
          if [ "${{ steps.persist_state.outcome }}" = "failure" ]; then
            echo "Social posting state could not be persisted; retry before publishing again."
          fi
          exit 1
