name: Post Job Openings to X, Threads, Bluesky, Farcaster, LinkedIn & Facebook

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform (all, x, threads, bluesky, farcaster, linkedin, facebook). Instagram uses the video workflow.'
        type: choice
        options:
          - all
          - x
          - threads
          - bluesky
          - farcaster
          - linkedin
          - facebook
        default: all
      dry_run:
        description: 'Dry run mode (preview without posting)'
        type: boolean
        default: false
      slug:
        description: 'Optional specific job slug to post'
        type: string
        default: ''
      force:
        description: 'Republish a platform even if its post was already recorded'
        type: boolean
        default: false
  workflow_call:
    inputs:
      platform:
        description: 'Target platform (all, x, threads, bluesky, farcaster, linkedin, facebook). Instagram uses the video workflow.'
        type: string
        default: all
      dry_run:
        description: 'Dry run mode (preview without posting)'
        type: boolean
        default: false
      slug:
        description: 'Optional specific job slug to post'
        type: string
        default: ''
      force:
        description: 'Republish a platform even if its post was already recorded'
        type: boolean
        default: false

concurrency:
  group: social-job-postings
  cancel-in-progress: false

jobs:
  post-opening:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test Buffer publishing and account-specific receipts
        run: npx tsx --test scripts/social/buffer-x.test.ts scripts/social/linkedin-targets.test.ts scripts/social/linkedin-personal.test.ts scripts/social/job-image-policy.test.ts

      - name: Post Job Opening
        id: publish
        continue-on-error: true
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          BLUESKY_HANDLE: hashtagweb3.bsky.social
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          NEYNAR_API_KEY: ${{ secrets.NEYNAR_API_KEY }}
          FARCASTER_SIGNER_UUID: ${{ secrets.FARCASTER_SIGNER_UUID }}
          FARCASTER_CHANNEL_IDS: ${{ vars.FARCASTER_CHANNEL_IDS || 'jobs,web3,bounties,crypto,dev,developers,build,founders,base,ethereum,solana,defi,ai,product,design,growth' }}
          FARCASTER_POST_TO_PROFILE: ${{ vars.FARCASTER_POST_TO_PROFILE || 'true' }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_X_CHANNEL_ID: ${{ vars.BUFFER_X_CHANNEL_ID || '6ab62682ea19ca0bdee284bd' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUFFER_LINKEDIN_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_CHANNEL_ID || '69c5b139af47dacb695b5feb' }}
          BUFFER_CVINBIO_CHANNEL_ID: ${{ vars.BUFFER_CVINBIO_CHANNEL_ID || '6a134180c687a22dd420e089' }}
          LINKEDIN_PERSONAL_ENABLED: ${{ vars.LINKEDIN_PERSONAL_ENABLED || 'false' }}
          LINKEDIN_PERSONAL_ACCESS_TOKEN: ${{ secrets.LINKEDIN_PERSONAL_ACCESS_TOKEN }}
          LINKEDIN_PERSONAL_MEMBER_ID: ${{ secrets.LINKEDIN_PERSONAL_MEMBER_ID }}
          LINKEDIN_PERSONAL_TOKEN_EXPIRES_AT: ${{ secrets.LINKEDIN_PERSONAL_TOKEN_EXPIRES_AT }}
          LINKEDIN_API_VERSION: ${{ vars.LINKEDIN_API_VERSION || '202609' }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          SOCIAL_PLATFORM: ${{ inputs.platform || 'all' }}
          SOCIAL_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          SOCIAL_SLUG: ${{ inputs.slug || '' }}
          SOCIAL_FORCE: ${{ inputs.force && 'true' || 'false' }}
        run: |
          ARGS=(--platform "$SOCIAL_PLATFORM")
          if [ "$SOCIAL_DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ -n "$SOCIAL_SLUG" ]; then
            ARGS+=(--slug "$SOCIAL_SLUG")
          fi
          if [ "$SOCIAL_FORCE" = "true" ]; then
            ARGS+=(--force)
          fi
          echo "Running social poster for platform: $SOCIAL_PLATFORM"
          npx tsx scripts/social/post-job-openings.ts "${ARGS[@]}"

      - name: Commit and Push Posted State
        id: persist_state
        if: ${{ always() && !inputs.dry_run }}
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/social/jobs-social-posted.json
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore(social): update social job posting state [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main || true
              if git push origin main; then
                exit 0
              fi
              sleep 2
            done
            echo "Unable to push social posting state after three attempts."
            exit 1
          fi

      - name: Fail incomplete social publish or state persistence
        if: ${{ always() && !inputs.dry_run && (steps.publish.outcome == 'failure' || steps.persist_state.outcome == 'failure') }}
        run: |
          if [ "${{ steps.publish.outcome }}" = "failure" ]; then
            echo "Social publishing did not verify every requested platform. Any verified partial state was persisted for safe retry."
          fi
          if [ "${{ steps.persist_state.outcome }}" = "failure" ]; then
            echo "Social posting state could not be persisted; retry before publishing again."
          fi
          exit 1
