name: Post Native Articles to Telegram

# Posts newly published native News articles to the Telegram news channel.
# Each slug is sent AT MOST ONCE (persistent state file). Runs after pushes
# that add articles, plus a daily sweep for anything missed.

on:
  push:
    branches: [main]
    paths:
      - 'content/articles/*.md'
  schedule:
    # daily sweep (catches anything the push trigger missed)
    - cron: '45 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List queue without sending'
        type: boolean
        default: false
      max_posts:
        description: 'Cap posts this run'
        default: '5'

permissions:
  contents: write

concurrency:
  group: telegram-native-articles
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_NEWS_CHANNEL_ID: ${{ secrets.TELEGRAM_NEWS_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Post new native articles
        run: node scripts/telegram-native-articles.mjs ${{ inputs.dry_run == true && '--dry-run' || '' }} --max ${{ inputs.max_posts || '5' }}

      - name: Commit back posted state
        if: ${{ inputs.dry_run != true }}
        run: |
          git add .telegram-native-posted.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No state changes"
          else
            git config user.name "hashtagweb3-bot"
            git config user.email "bot@hashtagweb3.com"
            git commit -m "chore: record telegram-posted native articles [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main || true
              git push origin main && break
              sleep 2
            done
          fi
