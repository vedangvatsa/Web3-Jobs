name: Precompute OG share images

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max jobs to render (empty = all missing)'
        required: false
        default: ''

jobs:
  og-images:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci --no-audit --no-fund

      - name: Restore job/company OG PNG cache
        uses: actions/cache@v4
        with:
          path: public/og
          key: og-cards-${{ hashFiles('content/jobs-runtime.json', 'scripts/precompute-og-images.ts') }}
          restore-keys: |
            og-cards-

      - name: Runtime JSON for catalogs
        run: |
          npx tsx scripts/precompute-jobs-runtime.ts
          npx tsx scripts/precompute-companies-runtime.ts

      - name: Render missing PNGs
        env:
          OG_CONCURRENCY: "6"
        run: |
          if [ -n "${{ inputs.limit }}" ]; then
            npx tsx scripts/precompute-og-images.ts --if-missing --limit "${{ inputs.limit }}"
            exit 0
          fi
          # Batched runs: steady logs, less memory spike than 6k renders in one process.
          # Fingerprint-gated (no --if-missing): unchanged cards skip, changed ones rewrite.
          for offset in 0 1200 2400 3600 4800 6000; do
            echo "::group::OG jobs offset=${offset}"
            npx tsx scripts/precompute-og-images.ts --offset "${offset}" --limit 1200 --skip-companies
            echo "::endgroup::"
          done
          npx tsx scripts/precompute-og-images.ts --companies-only
