name: Publish News Articles

# Writes 0-2 fully-reported News articles per run via opencode Zen,
# gated by the repo's article audits. Slow-news days exit cleanly.

on:
  schedule:
    # 3x daily, staggered from the jobs/social runs
    - cron: '30 0 * * *'
    - cron: '30 8 * * *'
    - cron: '30 16 * * *'
  workflow_dispatch:
    inputs:
      max_articles:
        description: 'Max articles this run (1-2)'
        default: '2'
      model:
        description: 'Zen model override (default: opencode/muse-spark-1.3-contributor-free)'
        default: ''
      dry_run:
        description: 'Run gates without committing'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-news
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      NEWS_MODEL: ${{ inputs.model || 'opencode/muse-spark-1.3-contributor-free' }}
      NEWS_MAX: ${{ inputs.max_articles || '2' }}
      NEWS_DRY_RUN: ${{ inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install opencode
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Disable push in dry-run mode
        if: ${{ inputs.dry_run == true }}
        run: git remote set-url origin ./__dryrun_disabled__

      - name: Record HEAD for dry-run check
        if: ${{ inputs.dry_run == true }}
        run: echo "BASE_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Publish news run
        run: |
          PROMPT="$(cat scripts/news-agent-brief.md)"
          PROMPT="${PROMPT//\$TODAY/$(date -u +%F)}"
          PROMPT="${PROMPT//\$MAX_ARTICLES/$NEWS_MAX}"
          PROMPT="${PROMPT//\$DRY_RUN/$NEWS_DRY_RUN}"
          "$HOME/.opencode/bin/opencode" run --model "$NEWS_MODEL" "$PROMPT"

      - name: Verify dry-run made no commits
        if: ${{ inputs.dry_run == true }}
        run: |
          test "$(git rev-parse HEAD)" = "$BASE_SHA" || { echo "DRY-RUN VIOLATION: commits were created"; git log --oneline -3; exit 1; }
          echo "Dry-run clean: no commits, no pushes."
