name: Query PostHog Side Events Analytics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query-posthog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Run PostHog HogQL queries for /ibw and /devcon side events
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
          POSTHOG_API_HOST: ${{ secrets.POSTHOG_API_HOST || 'https://us.posthog.com' }}
        run: npx tsx scripts/query-posthog-side-events.ts
