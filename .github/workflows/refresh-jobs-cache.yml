name: Refresh Jobs Cache & Post Social

on:
  schedule:
    # 1 AM IST = 7:30 PM UTC (previous day)
    - cron: '30 19 * * *'
    # 9 AM IST = 3:30 AM UTC
    - cron: '30 3 * * *'
    # 5 PM IST = 11:30 AM UTC
    - cron: '30 11 * * *'
  workflow_dispatch:

jobs:
  refresh-and-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch RSS feeds and update cache
        run: npx tsx scripts/refresh-jobs-cache.ts
        continue-on-error: true

      - name: Post to X
        env:
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: npx tsx scripts/social/publish-social.ts --platform twitter
        continue-on-error: true

      - name: Post to Bluesky
        env:
          BLUESKY_HANDLE: hashtagweb3.bsky.social
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: npx tsx scripts/social/publish-social.ts --platform bluesky
        continue-on-error: true

      - name: Refill Buffer queue (LinkedIn + Instagram)
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_ORG_ID: ${{ secrets.BUFFER_ORG_ID }}
        run: npx tsx scripts/social/buffer-refill.ts
        continue-on-error: true

      - name: Post to Telegram (Jobs)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: node scripts/telegram-post.mjs
        continue-on-error: true

      - name: Post to Telegram (News)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_NEWS_BOT_TOKEN }}
          TELEGRAM_NEWS_CHANNEL_ID: ${{ secrets.TELEGRAM_NEWS_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/telegram-news.mjs
        continue-on-error: true

      - name: Post to Telegram (AI News)
        env:
          TELEGRAM_AI_BOT_TOKEN: ${{ secrets.TELEGRAM_AI_BOT_TOKEN }}
          TELEGRAM_AI_CHANNEL_ID: ${{ secrets.TELEGRAM_AI_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/telegram-ai-news.mjs
        continue-on-error: true

      - name: Post to Telegram (AI Jobs)
        env:
          TELEGRAM_AI_BOT_TOKEN: ${{ secrets.TELEGRAM_AI_BOT_TOKEN }}
          TELEGRAM_AI_CHANNEL_ID: ${{ secrets.TELEGRAM_AI_CHANNEL_ID }}
        run: node scripts/telegram-ai-jobs.mjs
        continue-on-error: true

      - name: Commit and push updated cache and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Pull latest to avoid push conflicts from concurrent runs
          git pull --rebase origin main || true

          # Stage all changed state/cache files (ignore missing ones)
          git add --ignore-errors content/jobs-cache.json scripts/social/publish-state.json scripts/social/buffer-refill-state.json .telegram-posted.json .telegram-news-posted.json .telegram-ai-news-posted.json .telegram-ai-jobs-posted.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh jobs cache + social post [skip ci]"
            # Retry push up to 3 times in case of race conditions
            for i in 1 2 3; do
              git push && break
              echo "Push attempt $i failed, pulling and retrying..."
              git pull --rebase origin main || true
              sleep 2
            done
          fi
