name: Publish Jobs, Events & Social

# Three slots a day. GitHub's own cron on this public repo is delivered
# hours late (the 03:30 UTC / 9:00 IST event routinely starts ~08:00–09:10 UTC),
# so the on-time clock is an external workflow_dispatch (Mac launchd or
# Cloud Scheduler). The cron below stays as a backup. Successful daily work,
# rollouts, and social slots have separate completion stamps.
# Telegram publishers run independently from event fetching. A slot can send
# during its first 60 minutes; late backups cannot catch up with extra posts.
#
# morning (03:30 UTC): ingest, news drafts, one Firebase rollout, then
# Resend alerts, social, and Telegram. Auto-deploy stays off.
# A news failure does not skip that rollout. The jobs catalog still ships.
# If that morning run never starts, the next slot the same UTC day runs
# the morning work instead of skipping it.
# afternoon (11:30 UTC) and evening (19:30 UTC): social + Telegram, plus
# any unfinished daily work or failed rollout from earlier that day.

on:
  schedule:
    # 9 AM IST / 11:30 AM SGT = 3:30 AM UTC — backup only; do not rely on this for 9:00
    - cron: '30 3 * * *'
    # 5 PM IST / 7:30 PM SGT = 11:30 AM UTC
    - cron: '30 11 * * *'
    # 1 AM IST / 3:30 AM SGT = 7:30 PM UTC
    - cron: '30 19 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Which publish slot to run'
        type: choice
        options:
          - morning
          - afternoon
          - evening
        default: morning
      force_news:
        description: 'Bypass news cooldown; scheduled window and duplicate guards still apply'
        type: boolean
        default: false
      diagnose_telegram:
        description: 'Only diagnose bot/channel access (no posts)'
        type: boolean
        default: false
      diagnose_content:
        description: 'With diagnose_telegram: also preview jobs, events and news without sending'
        type: boolean
        default: false
      news_model:
        description: 'Zen model override for article drafting'
        default: ''
      news_dry_run:
        description: 'Draft+gate articles without committing'
        type: boolean
        default: false
      only_news:
        description: 'Draft news articles only. No ingest, email, posts, or deploy'
        type: boolean
        default: false

concurrency:
  # One group per slot so the afternoon run cannot cancel a morning run still going.
  group: "${{ github.event.inputs.only_news == 'true' && 'publish-news-only' || github.event.inputs.diagnose_telegram == 'true' && 'publish-diagnose' || (github.event.schedule == '30 3 * * *' && 'publish-slot-morning' || github.event.schedule == '30 11 * * *' && 'publish-slot-afternoon' || github.event.schedule == '30 19 * * *' && 'publish-slot-evening' || github.event.inputs.slot == 'afternoon' && 'publish-slot-afternoon' || github.event.inputs.slot == 'evening' && 'publish-slot-evening' || 'publish-slot-morning') }}"
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      morning: ${{ steps.set.outputs.morning }}
      news: ${{ steps.set.outputs.news }}
      social: ${{ steps.set.outputs.social }}
      slot: ${{ steps.set.outputs.slot }}
      skip: ${{ steps.set.outputs.skip }}
      deploy: ${{ steps.set.outputs.deploy }}
      date: ${{ steps.set.outputs.date }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: |
          set -euo pipefail
          node --test scripts/social/publish-slot-plan.test.mjs
          CRON="${{ github.event.schedule }}"
          INPUT="${{ github.event.inputs.slot }}"
          DIAG="${{ github.event.inputs.diagnose_telegram }}"
          if [ "$DIAG" = "true" ]; then
            echo "morning=false" >> "$GITHUB_OUTPUT"
            echo "news=false" >> "$GITHUB_OUTPUT"
            echo "social=false" >> "$GITHUB_OUTPUT"
            echo "slot=diagnose" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event.inputs.only_news }}" = "true" ]; then
            echo "morning=false" >> "$GITHUB_OUTPUT"
            echo "news=true" >> "$GITHUB_OUTPUT"
            echo "social=false" >> "$GITHUB_OUTPUT"
            echo "slot=news" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Drafting news only."
            exit 0
          fi
          SLOT=""
          case "$CRON" in
            "30 3 * * *") SLOT=morning ;;
            "30 11 * * *") SLOT=afternoon ;;
            "30 19 * * *") SLOT=evening ;;
          esac
          if [ -z "$SLOT" ]; then
            SLOT="${INPUT:-morning}"
          fi
          case "$SLOT" in
            morning|afternoon|evening) ;;
            *)
              echo "Unknown slot: $SLOT" >&2
              exit 1
              ;;
          esac
          TODAY=$(date -u +%F)
          STATE="scripts/social/publish-slot-state.json"
          node scripts/social/publish-slot-plan.mjs plan "$STATE" "$SLOT" "$TODAY" | tee -a "$GITHUB_OUTPUT"

  ingest:
    needs: [gate]
    if: ${{ needs.gate.outputs.skip != 'true' && needs.gate.outputs.morning == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/refresh-jobs-ingest.yml
    secrets: inherit

  deploy:
    needs: [gate, ingest, publish-news]
    if: ${{ always() && needs.gate.result == 'success' && needs.gate.outputs.skip != 'true' && needs.gate.outputs.deploy == 'true' && (needs.ingest.result == 'success' || (needs.gate.outputs.morning == 'false' && needs.ingest.result == 'skipped')) && needs.publish-news.result != 'cancelled' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/fah-fix-and-deploy.yml
    secrets: inherit

  job-alerts:
    needs: [gate, ingest, deploy]
    if: ${{ always() && needs.gate.outputs.skip != 'true' && needs.gate.outputs.morning == 'true' && needs.ingest.result == 'success' && needs.deploy.result != 'cancelled' }}
    permissions:
      contents: write
    uses: ./.github/workflows/daily-job-alerts.yml
    secrets: inherit

  post-openings:
    needs: [gate, ingest, deploy]
    if: ${{ always() && needs.gate.outputs.skip != 'true' && needs.gate.outputs.social == 'true' && needs.ingest.result != 'cancelled' && needs.deploy.result != 'cancelled' }}
    permissions:
      contents: write
      checks: read
    uses: ./.github/workflows/post-job-openings-social.yml
    secrets: inherit

  diagnose:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.diagnose_telegram == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Diagnose Telegram access
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_NEWS_BOT_TOKEN: ${{ secrets.TELEGRAM_NEWS_BOT_TOKEN }}
          TELEGRAM_AI_BOT_TOKEN: ${{ secrets.TELEGRAM_AI_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_NEWS_CHANNEL_ID: ${{ secrets.TELEGRAM_NEWS_CHANNEL_ID }}
          TELEGRAM_AI_CHANNEL_ID: ${{ secrets.TELEGRAM_AI_CHANNEL_ID }}
          TELEGRAM_HW3_GROUP_ID: ${{ secrets.TELEGRAM_HW3_GROUP_ID }}
        run: node scripts/telegram-diagnose.mjs

      - name: Install preview dependencies
        id: preview_deps
        if: ${{ !cancelled() && inputs.diagnose_content == true }}
        run: npm ci --no-audit --no-fund

      - name: Preview Telegram jobs without sending
        if: ${{ !cancelled() && steps.preview_deps.outcome == 'success' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_EXTRA_CHANNEL_IDS: '@jobsweb3'
        run: node scripts/social/prepare-telegram-slot.mjs jobs && npx tsx scripts/telegram-post.mjs --dry-run --force

      - name: Preview Telegram events without sending
        if: ${{ !cancelled() && steps.preview_deps.outcome == 'success' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_EVENTS_CHANNEL_ID: ${{ secrets.TELEGRAM_HW3_GROUP_ID }}
          TELEGRAM_EVENTS_MIRROR_CHANNEL_ID: '@eventsweb3'
          TELEGRAM_THREAD_ID: '1454'
        run: node scripts/social/prepare-telegram-slot.mjs events && npx tsx scripts/telegram-events.ts --dry-run --force

      - name: Preview Web3 news without sending
        if: ${{ !cancelled() && steps.preview_deps.outcome == 'success' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_NEWS_CHANNEL_ID: ${{ secrets.TELEGRAM_NEWS_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/telegram-news.mjs --dry-run --force

      - name: Preview AI news without sending
        if: ${{ !cancelled() && steps.preview_deps.outcome == 'success' }}
        env:
          TELEGRAM_AI_BOT_TOKEN: ${{ secrets.TELEGRAM_AI_BOT_TOKEN }}
          TELEGRAM_AI_CHANNEL_ID: ${{ secrets.TELEGRAM_AI_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/telegram-ai-news.mjs --dry-run --force

  publish-news:
    needs: [gate]
    if: ${{ needs.gate.outputs.skip != 'true' && needs.gate.outputs.news == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    concurrency:
      group: publish-news
      cancel-in-progress: false
    env:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      NEWS_MODEL: ${{ inputs.news_model || 'opencode/muse-spark-1.3-contributor-free' }}
      NEWS_DRY_RUN: ${{ inputs.news_dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install opencode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # opencode.ai sits behind Cloudflare and answers GitHub-hosted
          # runners with a non-200. curl -fsSL then exits 1 with an empty log.
          mkdir -p "$HOME/.opencode/bin"
          VERSION=$(curl -fsSL --retry 5 --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/anomalyco/opencode/releases/latest \
            | jq -r '.tag_name')
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Could not read the latest opencode release tag"
            exit 1
          fi
          echo "Installing opencode $VERSION"
          curl -fL --retry 5 --retry-delay 2 -o /tmp/opencode.tar.gz \
            "https://github.com/anomalyco/opencode/releases/download/${VERSION}/opencode-linux-x64.tar.gz"
          tar -xzf /tmp/opencode.tar.gz -C "$HOME/.opencode/bin" opencode
          chmod 755 "$HOME/.opencode/bin/opencode"
          "$HOME/.opencode/bin/opencode" --version

      - name: Configure git identity (agent commits as bot)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install image tooling (Pillow fallback for Linux resize)
        run: pip install --quiet pillow

      - name: Disable push in dry-run mode
        if: ${{ inputs.news_dry_run == true }}
        run: git remote set-url origin ./__dryrun_disabled__

      - name: Record HEAD for dry-run check
        if: ${{ inputs.news_dry_run == true }}
        run: echo "BASE_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Publish news run
        id: draft
        continue-on-error: true
        run: |
          echo "ARTICLES_BEFORE=$(git ls-files 'content/articles/*.md' | wc -l)" >> "$GITHUB_ENV"
          RULE="Do not launch the site and do not signal other processes. This is a fresh checkout: read tips, discover and research fresh stories, then write qualifying articles. Validate each article and its image on disk before committing and pushing. A clean working tree is not a reason to skip discovery."
          PROMPT="$RULE"$'\n'"$(cat scripts/news-agent-brief.md)"
          PROMPT="${PROMPT//\$TODAY/$(date -u +%F)}"
          PROMPT="${PROMPT//\$DRY_RUN/$NEWS_DRY_RUN}"
          "$HOME/.opencode/bin/opencode" run --model "$NEWS_MODEL" "$PROMPT"

      - name: News duplicate audit (hard gate)
        if: ${{ inputs.news_dry_run != true }}
        run: npx tsx scripts/audit-article-duplicates.ts

      - name: Commit articles if the drafter stopped first
        if: ${{ always() && inputs.news_dry_run != true }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, sys
          from pathlib import Path

          def run(args, check=True):
              return subprocess.run(args, check=check, text=True, capture_output=True)

          status = run(["git", "status", "--porcelain", "--untracked-files=all", "--", "content/articles", "public/images/news", "content/news-tips.md"]).stdout
          articles = []
          for line in status.splitlines():
              path = line[3:].strip()
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              if path.startswith("content/articles/") and path.endswith(".md") and not path.endswith("AGENTS.md"):
                  articles.append(Path(path).name)
          marker = Path("/tmp/news-commit-needed")
          if not articles:
              marker.write_text("no")
              if "${{ steps.draft.outcome }}" != "success":
                  print("News drafter failed and left no article files.")
                  sys.exit(1)
              print("No uncommitted articles.")
              sys.exit(0)
          marker.write_text("yes")

          quality = json.loads(subprocess.check_output(["npx", "tsx", "scripts/audit-article-quality.ts", "--report", "--verbose"], text=True))
          images = json.loads(subprocess.check_output(["npx", "tsx", "scripts/audit-article-images.ts", "--report"], text=True))
          bad = []
          for issue in quality.get("issues", []):
              if issue.get("file") in articles:
                  bad.append(f"{issue['file']}: {', '.join(issue.get('issues', []))}")
          for issue in images.get("issues", []):
              if issue.get("file") in articles:
                  bad.append(f"{issue['file']} image: {', '.join(issue.get('issues', []))}")
          if bad:
              print("New articles failed an audit and were not committed:")
              print("\n".join(bad))
              sys.exit(1)
          print("Uncommitted articles passed quality and image audits:", ", ".join(articles))
          PY
          if [ "$(cat /tmp/news-commit-needed)" != "yes" ]; then
            exit 0
          fi
          npx tsx scripts/generate-articles-index.ts
          npm run update:prebuild-hashes
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/articles content/articles-index.json content/prebuild-input-hashes.json content/news-tips.md public/images/news
          git reset HEAD -- content/articles/AGENTS.md || true
          if git diff --staged --quiet; then
            echo "Article files were already committed."
            if [ "${{ steps.draft.outcome }}" != "success" ]; then
              exit 1
            fi
            exit 0
          fi
          TODAY=$(date -u +%F)
          git commit -m "news: add drafted articles for ${TODAY}"
          git reset --hard HEAD
          for i in 1 2 3; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              git reset --hard HEAD
              echo "Article rebase attempt $i failed"
              sleep 2
              continue
            fi
            if git push origin main; then
              exit 0
            fi
            echo "Article push attempt $i failed, retrying..."
            sleep 2
          done
          echo "Failed to push drafted articles"
          exit 1

      - name: Verify drafter output against discovery
        if: ${{ always() && inputs.news_dry_run != true }}
        run: |
          set -euo pipefail
          BEFORE="${ARTICLES_BEFORE:-0}"
          AFTER=$(git ls-files 'content/articles/*.md' | wc -l)
          echo "Article files before=$BEFORE after=$AFTER"
          if [ "$AFTER" -gt "$BEFORE" ]; then
            echo "Drafter produced new articles."
            exit 0
          fi
          CANDIDATES=$(node scripts/news-discover.mjs --hours 48 --max 40 | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          echo "Novel discovery candidates (48h): $CANDIDATES"
          if [ "$CANDIDATES" -ge 5 ]; then
            echo "::error::News drafter wrote zero articles despite $CANDIDATES novel discovery candidates. The agent likely crashed or errored silently (draft step is continue-on-error). Inspect the 'Publish news run' step log."
            exit 1
          fi
          echo "No new articles and few/no candidates — legitimate slow-news day."

      - name: Verify dry-run made no commits
        if: ${{ inputs.news_dry_run == true }}
        run: |
          test "$(git rev-parse HEAD)" = "$BASE_SHA" || { echo "DRY-RUN VIOLATION: commits were created"; git log --oneline -3; exit 1; }
          echo "Dry-run clean: no commits, no pushes."

  refresh-news-snapshot:
    needs: [gate]
    if: ${{ needs.gate.outputs.skip != 'true' && inputs.news_dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Refresh RSS news snapshot
        run: |
          set -euo pipefail
          npx tsx scripts/refresh-news-cache.ts
          npx tsx scripts/test-news-cache.ts
          if git diff --quiet -- content/news-cache.json; then
            echo "News snapshot unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/news-cache.json
          git commit -m "news: refresh RSS snapshot $(date -u +%F)"
          for i in 1 2 3; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              git reset --hard HEAD
              echo "News snapshot rebase attempt $i failed"
              sleep 2
              continue
            fi
            if git push origin main; then
              exit 0
            fi
            echo "News snapshot push attempt $i failed, retrying..."
            sleep 2
          done
          echo "Failed to push news snapshot"
          exit 1

  refresh-and-post:
    name: Telegram (${{ matrix.kind }})
    needs: [gate, ingest, deploy]
    if: ${{ always() && needs.gate.outputs.skip != 'true' && needs.gate.outputs.social == 'true' && needs.ingest.result != 'cancelled' && needs.deploy.result != 'cancelled' && github.event.inputs.diagnose_telegram != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        kind: [jobs, events, news, group-news, ai-news]
    permissions:
      contents: write
    env:
      TELEGRAM_PUBLISH_SLOT: ${{ needs.gate.outputs.slot }}
      TELEGRAM_PUBLISH_DATE: ${{ needs.gate.outputs.date }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test Telegram delivery and schedule guards
        run: |
          node --test scripts/social/posting-slot.test.mjs scripts/social/gemini-json.test.mjs scripts/social/telegram-jobs-delivery.test.mjs scripts/social/telegram-news-delivery.test.mjs
          npx tsx --test scripts/telegram-event-mirror.test.ts scripts/telegram-event-delivery.test.ts scripts/telegram-event-state.test.ts

      - name: Check posting window and load published catalogs
        id: ready
        run: node scripts/social/prepare-telegram-slot.mjs '${{ matrix.kind }}'

      - name: Post to Telegram (Jobs → @web3hiring + @jobsweb3)
        if: ${{ matrix.kind == 'jobs' && steps.ready.outcome == 'success' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_EXTRA_CHANNEL_IDS: '@jobsweb3'
        run: npx tsx scripts/telegram-post.mjs

      - name: Post to Telegram (Jobs → hashtagweb3 group)
        if: ${{ !cancelled() && matrix.kind == 'jobs' && steps.ready.outcome == 'success' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_HW3_GROUP_ID }}
          TELEGRAM_THREAD_ID: '1457'
        run: npx tsx scripts/telegram-post.mjs

      - name: Post to Telegram (Events → hashtagweb3 group + @eventsweb3)
        if: ${{ matrix.kind == 'events' && steps.ready.outcome == 'success' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_EVENTS_CHANNEL_ID: ${{ secrets.TELEGRAM_HW3_GROUP_ID }}
          TELEGRAM_EVENTS_MIRROR_CHANNEL_ID: '@eventsweb3'
          TELEGRAM_THREAD_ID: '1454'
        run: npx tsx scripts/telegram-events.ts

      - name: Post to Telegram (News)
        if: ${{ matrix.kind == 'news' && steps.ready.outcome == 'success' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_NEWS_CHANNEL_ID: ${{ secrets.TELEGRAM_NEWS_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_NEWS: ${{ github.event.inputs.force_news == 'true' && '1' || '' }}
        run: node scripts/telegram-news.mjs

      - name: Post to Telegram (News → hashtagweb3 group)
        if: ${{ matrix.kind == 'group-news' && steps.ready.outcome == 'success' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_NEWS_CHANNEL_ID: ${{ secrets.TELEGRAM_HW3_GROUP_ID }}
          TELEGRAM_THREAD_ID: '4016'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_NEWS: ${{ github.event.inputs.force_news == 'true' && '1' || '' }}
        run: node scripts/telegram-news.mjs

      - name: Post to Telegram (AI News)
        if: ${{ matrix.kind == 'ai-news' && steps.ready.outcome == 'success' }}
        env:
          TELEGRAM_AI_BOT_TOKEN: ${{ secrets.TELEGRAM_AI_BOT_TOKEN }}
          TELEGRAM_AI_CHANNEL_ID: ${{ secrets.TELEGRAM_AI_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_NEWS: ${{ github.event.inputs.force_news == 'true' && '1' || '' }}
        run: node scripts/telegram-ai-news.mjs

      - name: Preserve Telegram receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-${{ matrix.kind }}-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .telegram-news-*.json
            .telegram-ai-news-*.json
            .telegram-events-*.json
            .telegram-jobs-deliveries-*.json
            .telegram-posted-*.json
            .telegram-job-urls-*.json

      - name: Persist Telegram history independently
        if: ${{ always() && !cancelled() }}
        run: |
          case '${{ matrix.kind }}' in
            jobs) node scripts/social/telegram-jobs-delivery.mjs ;;
            events) npx tsx scripts/social/telegram-event-state.ts ;;
            *) node scripts/social/telegram-news-state.mjs ;;
          esac

  refresh-events:
    name: Refresh event catalog
    needs: [gate, ingest, deploy]
    if: ${{ always() && needs.gate.outputs.skip != 'true' && needs.gate.outputs.social == 'true' && needs.ingest.result != 'cancelled' && needs.deploy.result != 'cancelled' && github.event.inputs.diagnose_telegram != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci

      - name: Test event discovery helpers
        run: |
          node --test scripts/lib/luma-calendar.test.mjs scripts/lib/event-dates.test.mjs scripts/lib/event-image-utils.test.mjs
          npx tsx --test scripts/test-token2049-import.ts scripts/test-catalog-root-order.ts

      - name: Import verified TOKEN2049 events before the broad calendar crawl
        id: token2049
        continue-on-error: true
        run: npx tsx scripts/sync-token2049-events.ts --write

      - name: Report retained verified catalog
        if: ${{ steps.token2049.outcome == 'failure' }}
        run: echo '::warning::TOKEN2049 discovery failed; retaining the previously verified event source. Telegram delivery is independent.'

      - name: Fetch Web3 Events from Luma
        run: node scripts/fetch-web3-events.mjs
        continue-on-error: true
      - name: Enrich event cover images
        run: node scripts/enrich-event-images.mjs
        continue-on-error: true
      - name: Enrich event speakers from official pages
        run: node scripts/enrich-event-speakers.mjs
        continue-on-error: true
      - name: Validate event description formatting
        run: npx tsx scripts/test-event-formatting.ts
      - name: Precompute and verify event catalogs
        run: npx tsx scripts/precompute-events-runtime.ts && npx tsx scripts/test-token2049-catalog.ts && npm run precompute:og-previews
      - name: Backfill missing self-hosted event covers
        run: npx tsx scripts/backfill-missing-event-covers.ts
        continue-on-error: true
      - name: Prune and verify event covers
        run: npx tsx scripts/prune-stale-event-covers.ts && npm run test:stale-event-covers
      - name: Refresh prebuild input hashes
        run: npm run update:prebuild-hashes

      - name: Commit and push updated cache and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Replay only the catalog commit onto the latest main.
          git fetch origin main

          # Telegram receipts and job catalogs have independent writers.
          git add content/events/ content/events-runtime.json content/prebuild-input-hashes.json public/preview/ public/events/

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh verified event catalog"
            for i in 1 2 3; do
              if ! git rebase origin/main; then
                git rebase --abort
                echo "Event catalog conflicts with newer main; preserving remote changes."
                exit 1
              fi
              git push origin main && exit 0
              echo "Push attempt $i failed, reconciling and retrying..."
              git fetch origin main
              sleep 2
            done
            exit 1
          fi

      - name: Fail visibly when source discovery needs another attempt
        if: ${{ steps.token2049.outcome == 'failure' }}
        run: exit 1

  record-slot:
    needs: [gate, ingest, publish-news, refresh-news-snapshot, deploy, job-alerts, post-openings, refresh-and-post, refresh-events]
    if: ${{ always() && needs.gate.outputs.skip != 'true' && needs.gate.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Report due-job outcomes (never fails the slot)
        if: always()
        env:
          MORNING: ${{ needs.gate.outputs.morning }}
          SOCIAL: ${{ needs.gate.outputs.social }}
          INGEST: ${{ needs.ingest.result }}
          NEWS: ${{ needs.publish-news.result }}
          ALERTS: ${{ needs.job-alerts.result }}
          POSTS: ${{ needs.post-openings.result }}
          TELEGRAM: ${{ needs.refresh-and-post.result }}
          SNAPSHOT: ${{ needs.refresh-news-snapshot.result }}
          DEPLOY_DUE: ${{ needs.gate.outputs.deploy }}
          DEPLOY: ${{ needs.deploy.result }}
        run: |
          set -euo pipefail
          fail=0
          if [ "$DEPLOY_DUE" = "true" ] && [ "$DEPLOY" != "success" ]; then
            echo "::warning::deploy was $DEPLOY — rollout remains due for the next slot."
            fail=1
          fi
          if [ "$MORNING" = "true" ]; then
            for pair in "ingest:$INGEST" "publish-news:$NEWS" "job-alerts:$ALERTS" "news-snapshot:$SNAPSHOT"; do
              name="${pair%%:*}"
              result="${pair#*:}"
              if [ "$result" != "success" ]; then
                echo "::warning::$name was $result — morning work must run, not skip."
                fail=1
              fi
            done
          fi
          if [ "$SOCIAL" = "true" ]; then
            for pair in "post-openings:$POSTS" "refresh-and-post:$TELEGRAM"; do
              name="${pair%%:*}"
              result="${pair#*:}"
              if [ "$result" != "success" ]; then
                echo "::warning::$name was $result — the publish slot must run, not skip."
                fail=1
              fi
            done
          fi
          if [ "$fail" != "0" ]; then
            echo "::warning::One or more due jobs did not succeed; each job is independent and other work already completed. See per-job results above."
          fi
          echo "Slot audit complete; only successful work receives a completion stamp."
      - name: Record successful work independently
        if: always()
        env:
          PUBLISH_PLAN: ${{ toJSON(needs.gate.outputs) }}
          PUBLISH_RESULTS: '{"ingest":"${{ needs.ingest.result }}","news":"${{ needs.publish-news.result }}","deploy":"${{ needs.deploy.result }}","posts":"${{ needs.post-openings.result }}","telegram":"${{ needs.refresh-and-post.result }}"}'
        run: |
          set -euo pipefail
          SLOT="${{ needs.gate.outputs.slot }}"
          TODAY="${{ needs.gate.outputs.date }}"
          STATE="scripts/social/publish-slot-state.json"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            node scripts/social/publish-slot-plan.mjs record "$STATE"
            git add "$STATE"
            if git diff --staged --quiet; then
              echo "No new successful work to stamp."
              exit 0
            fi
            git commit -m "chore: record successful publish work ${SLOT} for ${TODAY} [skip ci]"
            git push origin main && exit 0
            echo "Stamp push attempt $i failed, retrying..."
            sleep 2
          done
          exit 1
