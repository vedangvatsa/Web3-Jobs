name: Publish Jobs, Events & Social

# Three slots a day. GitHub's own cron on this public repo is delivered
# hours late (the 03:30 UTC / 9:00 IST event routinely starts ~08:00–09:10 UTC),
# so the on-time clock is an external workflow_dispatch (Mac launchd or
# Cloud Scheduler). The cron below stays as a backup. A slot that already
# completed today is skipped, and a later slot does not cancel an earlier one.
#
# morning (03:30 UTC): ingest, news drafts, one Firebase rollout, then
# Resend alerts, social, and Telegram. Auto-deploy stays off.
# A news failure does not skip that rollout. The jobs catalog still ships.
# If that morning run never starts, the next slot the same UTC day runs
# the morning work instead of skipping it.
# afternoon (11:30 UTC) and evening (19:30 UTC): social + Telegram, after
# the morning work for that date has already completed.

on:
  schedule:
    # 9 AM IST / 11:30 AM SGT = 3:30 AM UTC — backup only; do not rely on this for 9:00
    - cron: '30 3 * * *'
    # 5 PM IST / 7:30 PM SGT = 11:30 AM UTC
    - cron: '30 11 * * *'
    # 1 AM IST / 3:30 AM SGT = 7:30 PM UTC
    - cron: '30 19 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Which publish slot to run'
        type: choice
        options:
          - morning
          - afternoon
          - evening
        default: morning
      force_news:
        description: 'Bypass news cooldown and post digests now'
        type: boolean
        default: false
      diagnose_telegram:
        description: 'Only diagnose bot/channel access (no posts)'
        type: boolean
        default: false
      news_model:
        description: 'Zen model override for article drafting'
        default: ''
      news_dry_run:
        description: 'Draft+gate articles without committing'
        type: boolean
        default: false
      only_news:
        description: 'Draft news articles only. No ingest, email, posts, or deploy'
        type: boolean
        default: false

concurrency:
  # One group per slot so the afternoon run cannot cancel a morning run still going.
  group: "${{ github.event.inputs.only_news == 'true' && 'publish-news-only' || github.event.inputs.diagnose_telegram == 'true' && 'publish-diagnose' || (github.event.schedule == '30 3 * * *' && 'publish-slot-morning' || github.event.schedule == '30 11 * * *' && 'publish-slot-afternoon' || github.event.schedule == '30 19 * * *' && 'publish-slot-evening' || github.event.inputs.slot == 'afternoon' && 'publish-slot-afternoon' || github.event.inputs.slot == 'evening' && 'publish-slot-evening' || 'publish-slot-morning') }}"
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      morning: ${{ steps.set.outputs.morning }}
      news: ${{ steps.set.outputs.news }}
      social: ${{ steps.set.outputs.social }}
      slot: ${{ steps.set.outputs.slot }}
      skip: ${{ steps.set.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: |
          set -euo pipefail
          CRON="${{ github.event.schedule }}"
          INPUT="${{ github.event.inputs.slot }}"
          DIAG="${{ github.event.inputs.diagnose_telegram }}"
          if [ "$DIAG" = "true" ]; then
            echo "morning=false" >> "$GITHUB_OUTPUT"
            echo "news=false" >> "$GITHUB_OUTPUT"
            echo "social=false" >> "$GITHUB_OUTPUT"
            echo "slot=diagnose" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event.inputs.only_news }}" = "true" ]; then
            echo "morning=false" >> "$GITHUB_OUTPUT"
            echo "news=true" >> "$GITHUB_OUTPUT"
            echo "social=false" >> "$GITHUB_OUTPUT"
            echo "slot=news" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Drafting news only."
            exit 0
          fi
          SLOT=""
          case "$CRON" in
            "30 3 * * *") SLOT=morning ;;
            "30 11 * * *") SLOT=afternoon ;;
            "30 19 * * *") SLOT=evening ;;
          esac
          if [ -z "$SLOT" ]; then
            SLOT="${INPUT:-morning}"
          fi
          case "$SLOT" in
            morning|afternoon|evening) ;;
            *)
              echo "Unknown slot: $SLOT" >&2
              exit 1
              ;;
          esac
          echo "social=true" >> "$GITHUB_OUTPUT"
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          TODAY=$(date -u +%F)
          STATE="scripts/social/publish-slot-state.json"
          DONE=""
          MORNING_DONE=""
          if [ -f "$STATE" ]; then
            DONE=$(node -e "const fs=require('fs'); const s=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); process.stdout.write(s[process.argv[2]]||'')" "$STATE" "$SLOT")
            MORNING_DONE=$(node -e "const fs=require('fs'); const s=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); process.stdout.write(s.morning||'')" "$STATE")
          fi
          # Morning work is not tied to the 03:30 cron string. GitHub often
          # never delivers that event, and the later slots used to skip
          # ingest, news, and email for the whole day.
          if [ "$SLOT" = "morning" ] || [ "$MORNING_DONE" != "$TODAY" ]; then
            echo "morning=true" >> "$GITHUB_OUTPUT"
            echo "news=true" >> "$GITHUB_OUTPUT"
            echo "Morning work is due (slot=$SLOT, morning stamp=${MORNING_DONE:-none})."
          else
            echo "morning=false" >> "$GITHUB_OUTPUT"
            echo "news=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$DONE" = "$TODAY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Slot $SLOT already completed for $TODAY — skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Running slot $SLOT for $TODAY."
          fi

  ingest:
    needs: [gate]
    if: ${{ needs.gate.outputs.skip != 'true' && needs.gate.outputs.morning == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/refresh-jobs-ingest.yml
    secrets: inherit

  deploy:
    needs: [gate, ingest, publish-news]
    if: ${{ always() && needs.gate.outputs.skip != 'true' && needs.gate.outputs.morning == 'true' && needs.ingest.result == 'success' && needs.publish-news.result != 'cancelled' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/fah-fix-and-deploy.yml
    secrets: inherit

  job-alerts:
    needs: [gate, ingest, deploy]
    if: ${{ always() && needs.gate.outputs.skip != 'true' && needs.gate.outputs.morning == 'true' && needs.ingest.result == 'success' && needs.deploy.result != 'cancelled' }}
    permissions:
      contents: write
    uses: ./.github/workflows/daily-job-alerts.yml
    secrets: inherit

  post-openings:
    needs: [gate, ingest, deploy]
    if: ${{ always() && needs.gate.outputs.skip != 'true' && needs.gate.outputs.social == 'true' && needs.ingest.result != 'cancelled' && needs.deploy.result != 'cancelled' }}
    permissions:
      contents: write
      checks: read
    uses: ./.github/workflows/post-job-openings-social.yml
    secrets: inherit

  diagnose:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.diagnose_telegram == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Diagnose Telegram access
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_NEWS_BOT_TOKEN: ${{ secrets.TELEGRAM_NEWS_BOT_TOKEN }}
          TELEGRAM_AI_BOT_TOKEN: ${{ secrets.TELEGRAM_AI_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_NEWS_CHANNEL_ID: ${{ secrets.TELEGRAM_NEWS_CHANNEL_ID }}
          TELEGRAM_AI_CHANNEL_ID: ${{ secrets.TELEGRAM_AI_CHANNEL_ID }}
          TELEGRAM_HW3_GROUP_ID: ${{ secrets.TELEGRAM_HW3_GROUP_ID }}
        run: node scripts/telegram-diagnose.mjs

  publish-news:
    needs: [gate]
    if: ${{ needs.gate.outputs.skip != 'true' && needs.gate.outputs.news == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    concurrency:
      group: publish-news
      cancel-in-progress: false
    env:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      NEWS_MODEL: ${{ inputs.news_model || 'opencode/muse-spark-1.3-contributor-free' }}
      NEWS_DRY_RUN: ${{ inputs.news_dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install opencode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # opencode.ai sits behind Cloudflare and answers GitHub-hosted
          # runners with a non-200. curl -fsSL then exits 1 with an empty log.
          mkdir -p "$HOME/.opencode/bin"
          VERSION=$(curl -fsSL --retry 5 --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/anomalyco/opencode/releases/latest \
            | jq -r '.tag_name')
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Could not read the latest opencode release tag"
            exit 1
          fi
          echo "Installing opencode $VERSION"
          curl -fL --retry 5 --retry-delay 2 -o /tmp/opencode.tar.gz \
            "https://github.com/anomalyco/opencode/releases/download/${VERSION}/opencode-linux-x64.tar.gz"
          tar -xzf /tmp/opencode.tar.gz -C "$HOME/.opencode/bin" opencode
          chmod 755 "$HOME/.opencode/bin/opencode"
          "$HOME/.opencode/bin/opencode" --version

      - name: Configure git identity (agent commits as bot)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install image tooling (Pillow fallback for Linux resize)
        run: pip install --quiet pillow

      - name: Disable push in dry-run mode
        if: ${{ inputs.news_dry_run == true }}
        run: git remote set-url origin ./__dryrun_disabled__

      - name: Record HEAD for dry-run check
        if: ${{ inputs.news_dry_run == true }}
        run: echo "BASE_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Publish news run
        id: draft
        continue-on-error: true
        run: |
          RULE="Do not launch the site and do not signal other processes. Check the article file and its image on disk, then commit and push."
          PROMPT="$RULE"$'\n'"$(cat scripts/news-agent-brief.md)"
          PROMPT="${PROMPT//\$TODAY/$(date -u +%F)}"
          PROMPT="${PROMPT//\$DRY_RUN/$NEWS_DRY_RUN}"
          "$HOME/.opencode/bin/opencode" run --model "$NEWS_MODEL" "$PROMPT"

      - name: News duplicate audit (hard gate)
        if: ${{ inputs.news_dry_run != true }}
        run: npx tsx scripts/audit-article-duplicates.ts

      - name: Commit articles if the drafter stopped first
        if: ${{ always() && inputs.news_dry_run != true }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, sys
          from pathlib import Path

          def run(args, check=True):
              return subprocess.run(args, check=check, text=True, capture_output=True)

          status = run(["git", "status", "--porcelain", "--untracked-files=all", "--", "content/articles", "public/images/news", "content/news-tips.md"]).stdout
          articles = []
          for line in status.splitlines():
              path = line[3:].strip()
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              if path.startswith("content/articles/") and path.endswith(".md") and not path.endswith("AGENTS.md"):
                  articles.append(Path(path).name)
          marker = Path("/tmp/news-commit-needed")
          if not articles:
              marker.write_text("no")
              if "${{ steps.draft.outcome }}" != "success":
                  print("News drafter failed and left no article files.")
                  sys.exit(1)
              print("No uncommitted articles.")
              sys.exit(0)
          marker.write_text("yes")

          quality = json.loads(subprocess.check_output(["npx", "tsx", "scripts/audit-article-quality.ts", "--report", "--verbose"], text=True))
          images = json.loads(subprocess.check_output(["npx", "tsx", "scripts/audit-article-images.ts", "--report"], text=True))
          bad = []
          for issue in quality.get("issues", []):
              if issue.get("file") in articles:
                  bad.append(f"{issue['file']}: {', '.join(issue.get('issues', []))}")
          for issue in images.get("issues", []):
              if issue.get("file") in articles:
                  bad.append(f"{issue['file']} image: {', '.join(issue.get('issues', []))}")
          if bad:
              print("New articles failed an audit and were not committed:")
              print("\n".join(bad))
              sys.exit(1)
          print("Uncommitted articles passed quality and image audits:", ", ".join(articles))
          PY
          if [ "$(cat /tmp/news-commit-needed)" != "yes" ]; then
            exit 0
          fi
          npx tsx scripts/generate-articles-index.ts
          npm run update:prebuild-hashes
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/articles content/articles-index.json content/prebuild-input-hashes.json content/news-tips.md public/images/news
          git reset HEAD -- content/articles/AGENTS.md || true
          if git diff --staged --quiet; then
            echo "Article files were already committed."
            if [ "${{ steps.draft.outcome }}" != "success" ]; then
              exit 1
            fi
            exit 0
          fi
          TODAY=$(date -u +%F)
          git commit -m "news: add drafted articles for ${TODAY}"
          git reset --hard HEAD
          for i in 1 2 3; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              git reset --hard HEAD
              echo "Article rebase attempt $i failed"
              sleep 2
              continue
            fi
            if git push origin main; then
              exit 0
            fi
            echo "Article push attempt $i failed, retrying..."
            sleep 2
          done
          echo "Failed to push drafted articles"
          exit 1

      - name: Refresh RSS news snapshot
        if: ${{ always() && inputs.news_dry_run != true }}
        run: |
          set -euo pipefail
          npx tsx scripts/refresh-news-cache.ts
          npx tsx scripts/test-news-cache.ts
          if git diff --quiet -- content/news-cache.json; then
            echo "News snapshot unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/news-cache.json
          git commit -m "news: refresh RSS snapshot $(date -u +%F)"
          for i in 1 2 3; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              git reset --hard HEAD
              echo "News snapshot rebase attempt $i failed"
              sleep 2
              continue
            fi
            if git push origin main; then
              exit 0
            fi
            echo "News snapshot push attempt $i failed, retrying..."
            sleep 2
          done
          echo "Failed to push news snapshot"
          exit 1

      - name: Verify dry-run made no commits
        if: ${{ inputs.news_dry_run == true }}
        run: |
          test "$(git rev-parse HEAD)" = "$BASE_SHA" || { echo "DRY-RUN VIOLATION: commits were created"; git log --oneline -3; exit 1; }
          echo "Dry-run clean: no commits, no pushes."

  refresh-and-post:
    needs: [gate, ingest, deploy]
    if: ${{ always() && needs.gate.outputs.skip != 'true' && needs.gate.outputs.social == 'true' && needs.ingest.result != 'cancelled' && needs.deploy.result != 'cancelled' && github.event.inputs.diagnose_telegram != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Backfill Telegram URL audit log
        run: npx tsx scripts/backfill-telegram-job-url-log.ts
        continue-on-error: true

      - name: Verify Telegram job URLs resolve
        run: npx tsx scripts/verify-telegram-job-urls.ts
        continue-on-error: true

      - name: Fetch Web3 Events from Luma
        run: node scripts/fetch-web3-events.mjs
        continue-on-error: true
      - name: Enrich event cover images
        run: node scripts/enrich-event-images.mjs
        continue-on-error: true
      - name: Enrich event speakers from official pages
        run: node scripts/enrich-event-speakers.mjs
        continue-on-error: true

      - name: Validate event description formatting before publishing
        run: npx tsx scripts/test-event-formatting.ts

      - name: Precompute events runtime (listing + previews)
        run: npx tsx scripts/precompute-events-runtime.ts && npm run precompute:og-previews

      - name: Backfill missing self-hosted event covers
        run: npx tsx scripts/backfill-missing-event-covers.ts
        continue-on-error: true

      - name: Prune stale self-hosted event covers
        run: npx tsx scripts/prune-stale-event-covers.ts

      - name: Verify event cover files
        run: npm run test:stale-event-covers

      - name: Refresh prebuild input hashes
        run: npm run update:prebuild-hashes

      - name: Post to Telegram (Jobs → @web3hiring + @jobsweb3)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_EXTRA_CHANNEL_IDS: '@jobsweb3'
        run: npx tsx scripts/telegram-post.mjs
        continue-on-error: true

      - name: Post to Telegram (Jobs → hashtagweb3 group)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_HW3_GROUP_ID }}
          TELEGRAM_THREAD_ID: '1457'
        run: npx tsx scripts/telegram-post.mjs
        continue-on-error: true

      - name: Post to Telegram (Events → hashtagweb3 group)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_EVENTS_CHANNEL_ID: ${{ secrets.TELEGRAM_HW3_GROUP_ID }}
          TELEGRAM_THREAD_ID: '1454'
        run: npx tsx scripts/telegram-events.ts
        continue-on-error: true

      - name: Post to Telegram (News)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_NEWS_CHANNEL_ID: ${{ secrets.TELEGRAM_NEWS_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_NEWS: ${{ github.event.inputs.force_news == 'true' && '1' || '' }}
        run: node scripts/telegram-news.mjs
        continue-on-error: true

      - name: Post to Telegram (News → hashtagweb3 group)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_NEWS_CHANNEL_ID: ${{ secrets.TELEGRAM_HW3_GROUP_ID }}
          TELEGRAM_THREAD_ID: '4016'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_NEWS: ${{ github.event.inputs.force_news == 'true' && '1' || '' }}
        run: node scripts/telegram-news.mjs
        continue-on-error: true

      - name: Post to Telegram (AI News)
        env:
          TELEGRAM_AI_BOT_TOKEN: ${{ secrets.TELEGRAM_AI_BOT_TOKEN }}
          TELEGRAM_AI_CHANNEL_ID: ${{ secrets.TELEGRAM_AI_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_NEWS: ${{ github.event.inputs.force_news == 'true' && '1' || '' }}
        run: node scripts/telegram-ai-news.mjs
        continue-on-error: true

      # - name: Post to Telegram (AI Jobs)
      #   env:
      #     TELEGRAM_AI_BOT_TOKEN: ${{ secrets.TELEGRAM_AI_BOT_TOKEN }}
      #     TELEGRAM_AI_CHANNEL_ID: ${{ secrets.TELEGRAM_AI_CHANNEL_ID }}
      #   run: node scripts/telegram-ai-jobs.mjs
      #   continue-on-error: true


      - name: Commit and push updated cache and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch remote to ensure origin/main is fresh for the merge script
          git fetch origin main

          # Merge local state files with remote to prevent rebase conflicts
          npx tsx scripts/social/merge-state.ts

          # Events + social/Telegram state only. Jobs cache files are owned
          # by the daily ingest (refresh-jobs-ingest.yml) — never stage them
          # here, or intraday runs will fight the morning ingest on rebase.
          git add content/events/ content/events-runtime.json content/legacy-slugs-archive.json content/prebuild-input-hashes.json scripts/social/*.json .telegram*.json .resend-broadcast-sent.json public/preview/ public/events/ 2>/dev/null || true
          # Owned by record-slot. Staging it here races the daily stamp.
          git reset HEAD -- scripts/social/publish-slot-state.json 2>/dev/null || true
          git checkout -- scripts/social/publish-slot-state.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: publish jobs/events/social state"
            for i in 1 2 3; do
              git pull --rebase origin main || git pull --rebase -X theirs origin main || true
              git push origin main && break
              echo "Push attempt $i failed, reconciling and retrying..."
              sleep 2
            done
          fi

  record-slot:
    needs: [gate, ingest, publish-news, deploy, job-alerts, post-openings, refresh-and-post]
    if: ${{ always() && needs.gate.outputs.skip != 'true' && needs.gate.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Stamp morning after a rollout so a later slot does not deploy again
        if: ${{ needs.gate.outputs.morning == 'true' && needs.ingest.result == 'success' && needs.deploy.result == 'success' }}
        run: |
          set -euo pipefail
          TODAY=$(date -u +%F)
          STATE="scripts/social/publish-slot-state.json"
          node -e "const fs=require('fs'); const p=process.argv[1]; const s=fs.existsSync(p)?JSON.parse(fs.readFileSync(p,'utf8')):{}; s.morning=process.argv[2]; fs.writeFileSync(p, JSON.stringify(s,null,2)+'\n');" "$STATE" "$TODAY"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$STATE"
          if git diff --staged --quiet; then
            echo "Morning already stamped"
            exit 0
          fi
          git commit -m "chore: record morning rollout for ${TODAY} [skip ci]"
          git reset --hard HEAD
          for i in 1 2 3; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              git reset --hard HEAD
              echo "Morning stamp rebase attempt $i failed"
              sleep 2
              continue
            fi
            if git push origin main; then
              exit 0
            fi
            echo "Morning stamp push attempt $i failed, retrying..."
            sleep 2
          done
          exit 1
      - name: Fail if a due job was skipped
        if: always()
        env:
          MORNING: ${{ needs.gate.outputs.morning }}
          SOCIAL: ${{ needs.gate.outputs.social }}
          INGEST: ${{ needs.ingest.result }}
          NEWS: ${{ needs.publish-news.result }}
          ALERTS: ${{ needs.job-alerts.result }}
          POSTS: ${{ needs.post-openings.result }}
          TELEGRAM: ${{ needs.refresh-and-post.result }}
        run: |
          set -euo pipefail
          fail=0
          if [ "$MORNING" = "true" ]; then
            for pair in "ingest:$INGEST" "publish-news:$NEWS" "job-alerts:$ALERTS"; do
              name="${pair%%:*}"
              result="${pair#*:}"
              if [ "$result" != "success" ]; then
                echo "$name was $result — morning work must run, not skip."
                fail=1
              fi
            done
          fi
          if [ "$SOCIAL" = "true" ]; then
            for pair in "post-openings:$POSTS" "refresh-and-post:$TELEGRAM"; do
              name="${pair%%:*}"
              result="${pair#*:}"
              if [ "$result" != "success" ]; then
                echo "$name was $result — the publish slot must run, not skip."
                fail=1
              fi
            done
          fi
          if [ "$fail" != "0" ]; then
            exit 1
          fi
      - name: Record completed slot so a late GitHub cron does not run it again
        run: |
          set -euo pipefail
          SLOT="${{ needs.gate.outputs.slot }}"
          MORNING="${{ needs.gate.outputs.morning }}"
          TODAY=$(date -u +%F)
          STATE="scripts/social/publish-slot-state.json"
          node -e "const fs=require('fs'); const p=process.argv[1]; const s=fs.existsSync(p)?JSON.parse(fs.readFileSync(p,'utf8')):{}; s[process.argv[2]]=process.argv[3]; if (process.argv[4]==='true') s.morning=process.argv[3]; fs.writeFileSync(p, JSON.stringify(s,null,2)+'\n');" "$STATE" "$SLOT" "$TODAY" "$MORNING"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$STATE"
          if git diff --staged --quiet; then
            echo "Slot stamp already recorded"
            exit 0
          fi
          git commit -m "chore: record publish slot ${SLOT} for ${TODAY} [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main || true
            git push origin main && exit 0
            echo "Stamp push attempt $i failed, retrying..."
            sleep 2
          done
          exit 1
