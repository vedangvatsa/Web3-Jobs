name: Refresh Jobs Cache

on:
  schedule:
    # Every 8 hours: midnight, 8am, 4pm UTC
    - cron: '0 0,8,16 * * *'
  workflow_dispatch:

jobs:
  refresh-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to push updated cache

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch RSS feeds and update cache
        run: npx tsx scripts/refresh-jobs-cache.ts

      - name: Commit and push updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/jobs-cache.json
          if git diff --staged --quiet; then
            echo "No changes to jobs cache"
          else
            git commit -m "chore: refresh jobs cache [skip ci]"
            git push
          fi
