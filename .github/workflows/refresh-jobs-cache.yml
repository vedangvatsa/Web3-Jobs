name: Refresh Jobs Cache & Post Social

on:
  schedule:
    # 9 AM IST / 11:30 AM SGT = 3:30 AM UTC
    - cron: '30 3 * * *'
    # 5 PM IST / 7:30 PM SGT = 11:30 AM UTC
    - cron: '30 11 * * *'
    # 1 AM IST / 3:30 AM SGT = 7:30 PM UTC
    - cron: '30 19 * * *'
  workflow_dispatch:
    inputs:
      force_news:
        description: 'Bypass news cooldown and post digests now'
        type: boolean
        default: false
      diagnose_telegram:
        description: 'Only diagnose bot/channel access (no posts)'
        type: boolean
        default: false

concurrency:
  group: social-syndication
  cancel-in-progress: true

jobs:
  diagnose:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.diagnose_telegram == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Diagnose Telegram access
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_NEWS_BOT_TOKEN: ${{ secrets.TELEGRAM_NEWS_BOT_TOKEN }}
          TELEGRAM_AI_BOT_TOKEN: ${{ secrets.TELEGRAM_AI_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_NEWS_CHANNEL_ID: ${{ secrets.TELEGRAM_NEWS_CHANNEL_ID }}
          TELEGRAM_AI_CHANNEL_ID: ${{ secrets.TELEGRAM_AI_CHANNEL_ID }}
          TELEGRAM_HW3_GROUP_ID: ${{ secrets.TELEGRAM_HW3_GROUP_ID }}
        run: node scripts/telegram-diagnose.mjs

  refresh-and-post:
    if: ${{ github.event.inputs.diagnose_telegram != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch RSS feeds and update cache
        run: npx tsx scripts/refresh-jobs-cache.ts
        continue-on-error: true

      - name: Ingest Mercuryo BambooHR jobs
        run: npx tsx scripts/ingest-mercuryo-bamboo.ts
        continue-on-error: true

      - name: Ingest Official CoinDCX job openings
        run: npx tsx scripts/ingest-coindcx-official.ts
        continue-on-error: true

      - name: Ingest Regional ATS Web3 feeds (Africa, Japan, Singapore, HK)
        run: npx tsx scripts/ingest-regional-feeds.ts
        continue-on-error: true

      - name: Ingest Global Ecosystem Web3 ATS feeds (Fireblocks, Gemini, BitGo, Render, Phantom, Uniswap)
        run: npx tsx scripts/ingest-global-ecosystem-feeds.ts
        continue-on-error: true

      - name: Ingest Untracked Web3, AI & Security ATS feeds (Cantina, Switchboard, Turnkey, Hyperbolic, Grass, Chainstack, Magic Eden)
        run: npx tsx scripts/ingest-untracked-web3-companies.ts
        continue-on-error: true

      - name: Ingest Franklin Templeton Official Jobs
        run: npx tsx scripts/ingest-franklin-templeton-jobs.ts
        continue-on-error: true

      - name: Ingest PwC Crypto & Web3 Jobs
        run: npx tsx scripts/ingest-pwc-jobs.ts
        continue-on-error: true

      - name: Ingest KuCoin Official MokaHR Jobs
        run: npx tsx scripts/ingest-kucoin-mokahr-jobs.ts
        continue-on-error: true

      - name: Ingest Marketnode Official Openings
        run: npx tsx scripts/ingest-marketnode-xt-jobs.ts
        continue-on-error: true

      - name: Ingest Revolut Crypto Jobs
        run: npx tsx scripts/ingest-revolut-crypto-job.ts
        continue-on-error: true

      - name: Pre-bake job slugs into cache
        run: node scripts/prebake_slugs.js

      - name: Verify jobs cache integrity
        run: npx tsx scripts/verify-jobs-integrity.ts

      - name: Fetch Web3 Events from Luma
        run: node scripts/fetch-web3-events.mjs
        continue-on-error: true
      # Note: X and Threads postings have been migrated to the dedicated
      # job openings workflow (.github/workflows/post-job-openings-social.yml)
      - name: Post to Bluesky
        env:
          BLUESKY_HANDLE: hashtagweb3.bsky.social
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: npx tsx scripts/social/publish-social.ts --platform bluesky
        continue-on-error: true

      - name: Post to LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORG_ID: ${{ secrets.LINKEDIN_ORG_ID }}
        run: npx tsx scripts/social/publish-social.ts --platform linkedin
        continue-on-error: true

      - name: Refill Buffer queue (LinkedIn + Instagram)
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_ORG_ID: ${{ secrets.BUFFER_ORG_ID }}
        run: npx tsx scripts/social/buffer-refill.ts
        continue-on-error: true

      - name: Post to Telegram (Jobs → @web3hiring + @jobsweb3)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_EXTRA_CHANNEL_IDS: '@jobsweb3'
        run: node scripts/telegram-post.mjs
        continue-on-error: true

      - name: Post to Telegram (Jobs → hashtagweb3 group)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_HW3_GROUP_ID }}
          TELEGRAM_THREAD_ID: '1457'
        run: node scripts/telegram-post.mjs
        continue-on-error: true

      - name: Post to Telegram (News)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_NEWS_CHANNEL_ID: ${{ secrets.TELEGRAM_NEWS_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_NEWS: ${{ github.event.inputs.force_news == 'true' && '1' || '' }}
        run: node scripts/telegram-news.mjs
        continue-on-error: true

      - name: Post to Telegram (News → hashtagweb3 group)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_NEWS_CHANNEL_ID: ${{ secrets.TELEGRAM_HW3_GROUP_ID }}
          TELEGRAM_THREAD_ID: '4016'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_NEWS: ${{ github.event.inputs.force_news == 'true' && '1' || '' }}
        run: node scripts/telegram-news.mjs
        continue-on-error: true

      - name: Post to Telegram (AI News)
        env:
          TELEGRAM_AI_BOT_TOKEN: ${{ secrets.TELEGRAM_AI_BOT_TOKEN }}
          TELEGRAM_AI_CHANNEL_ID: ${{ secrets.TELEGRAM_AI_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_NEWS: ${{ github.event.inputs.force_news == 'true' && '1' || '' }}
        run: node scripts/telegram-ai-news.mjs
        continue-on-error: true

      # - name: Post to Telegram (AI Jobs)
      #   env:
      #     TELEGRAM_AI_BOT_TOKEN: ${{ secrets.TELEGRAM_AI_BOT_TOKEN }}
      #     TELEGRAM_AI_CHANNEL_ID: ${{ secrets.TELEGRAM_AI_CHANNEL_ID }}
      #   run: node scripts/telegram-ai-jobs.mjs
      #   continue-on-error: true


      - name: Commit and push updated cache and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch remote to ensure origin/main is fresh for the merge script
          git fetch origin main

          # Merge local state files with remote to prevent rebase conflicts
          npx tsx scripts/social/merge-state.ts

          # Stage all cache and state files (including job-descriptions.json)
          git add content/jobs-cache.json content/job-descriptions.json content/events-cache.json scripts/social/*.json .telegram*.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh jobs cache + social post"
            for i in 1 2 3; do
              git pull --rebase origin main || git pull --rebase -X theirs origin main || true
              git push origin main && break
              echo "Push attempt $i failed, reconciling and retrying..."
              sleep 2
            done
          fi
