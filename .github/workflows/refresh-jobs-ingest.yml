name: Refresh Jobs Ingest (daily)

# Once-a-day ingestion: RSS + ATS feeds, slug prebake, runtime
# precompute, OG images, integrity guards. Called by the 03:30 UTC
# publish run. Intraday publish runs skip this workflow.

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: jobs-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch RSS feeds and update cache
        run: npx tsx scripts/refresh-jobs-cache.ts
        continue-on-error: true

      - name: Ingest Mercuryo BambooHR jobs
        run: npx tsx scripts/ingest-mercuryo-bamboo.ts
        continue-on-error: true

      - name: Ingest Official CoinDCX job openings
        run: npx tsx scripts/ingest-coindcx-official.ts
        continue-on-error: true

      - name: Ingest Regional ATS Web3 feeds (Africa, Japan, Singapore, HK)
        run: npx tsx scripts/ingest-regional-feeds.ts
        continue-on-error: true

      - name: Ingest Global Ecosystem Web3 ATS feeds (Fireblocks, Gemini, BitGo, Render, Phantom, Uniswap)
        run: npx tsx scripts/ingest-global-ecosystem-feeds.ts
        continue-on-error: true

      - name: Ingest Untracked Web3, AI & Security ATS feeds (Cantina, Switchboard, Turnkey, Hyperbolic, Grass, Chainstack, Magic Eden)
        run: npx tsx scripts/ingest-untracked-web3-companies.ts
        continue-on-error: true

      - name: Ingest Franklin Templeton Official Jobs
        run: npx tsx scripts/ingest-franklin-templeton-jobs.ts
        continue-on-error: true

      - name: Ingest PwC Crypto & Web3 Jobs
        run: npx tsx scripts/ingest-pwc-jobs.ts
        continue-on-error: true

      - name: Ingest KuCoin Official MokaHR Jobs
        run: npx tsx scripts/ingest-kucoin-mokahr-jobs.ts
        continue-on-error: true

      - name: Ingest Marketnode Official Openings
        run: npx tsx scripts/ingest-marketnode-xt-jobs.ts
        continue-on-error: true

      - name: Ingest Revolut Crypto Jobs
        run: npx tsx scripts/ingest-revolut-crypto-job.ts
        continue-on-error: true

      - name: Pre-bake job slugs into cache
        run: node scripts/prebake_slugs.js

      - name: Precompute jobs runtime listing
        run: npx tsx scripts/precompute-jobs-runtime.ts

      - name: Validate job description formatting before publishing
        run: npx tsx scripts/test-job-description-formatting.ts && npx tsx scripts/audit-detail-formatting.ts --jobs

      - name: Restore job/company OG PNG cache
        uses: actions/cache@v4
        with:
          path: public/og
          key: og-cards-${{ hashFiles('content/jobs-runtime.json', 'scripts/precompute-og-images.ts') }}
          restore-keys: |
            og-cards-

      - name: Precompute companies runtime (OG company cards)
        run: npx tsx scripts/precompute-companies-runtime.ts

      - name: Verify company role counts and associations
        run: npx tsx scripts/generate-slug-types.ts && npm run test:company-jobs

      - name: Precompute missing job/company OG PNGs
        run: npm run precompute:og-incremental
        continue-on-error: true

      - name: Refresh prebuild input hashes
        run: npm run update:prebuild-hashes

      - name: Regenerate sitemap (ingest owns route list)
        run: npx tsx scripts/generate-sitemap-json.ts

      - name: Guard job slug uniqueness
        run: npx tsx scripts/test-job-slug-reserved.ts && npx tsx scripts/check-slug-collisions.ts

      - name: Ensure company logo PNGs for OG cards
        run: npx tsx scripts/ensure-company-logos.ts
        continue-on-error: true

      - name: Verify jobs cache integrity
        run: npx tsx scripts/verify-jobs-integrity.ts
        continue-on-error: true

      - name: Commit and push refreshed jobs cache
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          # The catalog commit has to sit on local main. checkout leaves a
          # detached HEAD, and `git push origin main` would then push the
          # stale local branch instead of this commit.
          git checkout -B main
          npx tsx scripts/social/merge-state.ts
          git add content/jobs-cache.json content/jobs-runtime.json content/homepage-jobs.json content/companies-runtime.json content/slug-types.json content/job-description-shards/ content/prebuild-input-hashes.json content/sitemap-routes.json public/sitemap.xml public/.well-known/sitemap.json
          git add public/og/ public/preview/ public/logo/companies/ || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: refresh jobs cache (daily ingest)"
          # merge-state rewrites social JSON this job does not commit.
          # pull --rebase refuses a dirty tree, and the old loop still
          # exited 0 after origin rejected the push.
          git reset --hard HEAD
          for i in 1 2 3; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              git reset --hard HEAD
              if ! git pull --rebase -X theirs origin main; then
                git rebase --abort || true
                echo "Rebase attempt $i failed"
                sleep 2
                continue
              fi
            fi
            if git push origin main; then
              exit 0
            fi
            echo "Push attempt $i failed, reconciling and retrying..."
            sleep 2
          done
          echo "Failed to push the jobs catalog to main"
          exit 1
