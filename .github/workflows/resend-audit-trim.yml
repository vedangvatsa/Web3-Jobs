name: Resend Audience Audit & Trim

# Audit is read-only (counts + structure). Trim is destructive and additionally
# requires --keep-count and the literal --confirm DELETE input.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'audit = read-only counts; probe = endpoint recon; rank = engagement ranking (masked artifacts); segment = add top-N to segment; trim = destructive delete'
        required: true
        type: choice
        default: 'audit'
        options:
          - audit
          - probe
          - rank
          - segment
          - trim
      keep_count:
        description: 'rank/segment/trim: contacts to keep'
        required: false
        default: '1000'
      keep_strategy:
        description: 'trim only: which contacts survive'
        required: false
        type: choice
        default: 'newest'
        options:
          - newest
          - segment-first
      segment_id:
        description: 'segment mode: target segment (e.g. Daily1000)'
        required: false
        default: 'd707e197-265c-4029-9f94-304b6534857b'
      confirm:
        description: 'trim only: must be the literal word DELETE'
        required: false
        default: ''

concurrency:
  group: resend-audit-trim
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Run
        run: node scripts/resend-audience-trim.mjs --mode "${{ inputs.mode }}" --keep-count "${{ inputs.keep_count }}" --keep-strategy "${{ inputs.keep_strategy }}" --segment-id "${{ inputs.segment_id }}" --confirm "${{ inputs.confirm }}" --out-dir resend-rank-out
      - name: Upload masked artifacts
        if: always() && hashFiles('resend-rank-out/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: resend-out-${{ github.run_id }}
          path: resend-rank-out/
          retention-days: 14
