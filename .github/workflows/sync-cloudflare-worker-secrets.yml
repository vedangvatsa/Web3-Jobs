name: Sync Cloudflare Worker secrets (legacy)

# Production is Firebase App Hosting. Manual only if Cloudflare Workers are re-enabled.
on:
  workflow_dispatch:

jobs:
  sync-secrets:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install -g wrangler@4

      - name: Push secrets to Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set in GitHub repository secrets."
            exit 1
          fi
          export CLOUDFLARE_ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID:-98dc3d9d6a9efe3231032ff064ac0a01}"
          put_if_set() {
            local name="$1"
            local value="$2"
            if [ -n "${value}" ]; then
              printf '%s' "$value" | wrangler secret put "$name" --config wrangler.jsonc --name hashtagweb3
              echo "Synced $name"
            else
              echo "Skip $name (empty in GitHub secrets)"
            fi
          }
          put_if_set CRON_SECRET "${CRON_SECRET:-}"
          put_if_set UNSUBSCRIBE_SECRET "${UNSUBSCRIBE_SECRET:-}"
          put_if_set RESEND_API_KEY "${RESEND_API_KEY:-}"
          put_if_set NEXT_PUBLIC_FIREBASE_API_KEY "${NEXT_PUBLIC_FIREBASE_API_KEY:-}"
          put_if_set NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN "${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}"
          put_if_set NEXT_PUBLIC_FIREBASE_PROJECT_ID "${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}"
          put_if_set NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET "${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}"
          put_if_set NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID "${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}"
          put_if_set NEXT_PUBLIC_FIREBASE_APP_ID "${NEXT_PUBLIC_FIREBASE_APP_ID:-}"
          put_if_set NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID "${NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID:-}"
          put_if_set FIREBASE_SERVICE_ACCOUNT_KEY "${FIREBASE_SERVICE_ACCOUNT_KEY:-}"
          put_if_set FIREBASE_SERVICE_ACCOUNT_JSON "${FIREBASE_SERVICE_ACCOUNT_JSON:-}"
