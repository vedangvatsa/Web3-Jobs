name: Sync Firebase App Hosting secrets

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: Firebase / GCP project ID (App Hosting)
        required: true
        default: web3-jobs-aggregator
      backend:
        description: App Hosting backend ID (optional if --force on secrets:set is enough)
        required: false
        default: studio

jobs:
  sync-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_APPHOSTING_SERVICE_ACCOUNT_KEY || secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

      - name: Show service account email (for IAM on App Hosting project)
        run: |
          node -e "
          const fs = require('fs');
          const p = process.env.GOOGLE_APPLICATION_CREDENTIALS;
          const j = JSON.parse(fs.readFileSync(p, 'utf8'));
          console.log('Grant this principal roles on project ' + '${{ inputs.project_id }}' + ':');
          console.log(j.client_email);
          console.log('Roles: Secret Manager Admin, Service Usage Consumer, Firebase App Hosting Admin (or Editor).');
          "

      - name: Sync Secret Manager secrets for App Hosting
        env:
          FIREBASE_APPHOSTING_PROJECT_ID: ${{ inputs.project_id }}
          FIREBASE_APPHOSTING_BACKEND: ${{ inputs.backend }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${NEXT_PUBLIC_FIREBASE_API_KEY:-}" ]; then
            echo "NEXT_PUBLIC_FIREBASE_API_KEY is missing in GitHub secrets."
            exit 1
          fi
          if [ "${NEXT_PUBLIC_FIREBASE_PROJECT_ID}" != "${FIREBASE_APPHOSTING_PROJECT_ID}" ]; then
            echo "WARNING: NEXT_PUBLIC_FIREBASE_PROJECT_ID (${NEXT_PUBLIC_FIREBASE_PROJECT_ID}) != App Hosting project (${FIREBASE_APPHOSTING_PROJECT_ID})."
            echo "Update GitHub secrets to the new Firebase web app config, or App Hosting will use wrong Firebase project at runtime."
          fi
          chmod +x scripts/sync-firebase-apphosting-secrets.sh
          bash scripts/sync-firebase-apphosting-secrets.sh
