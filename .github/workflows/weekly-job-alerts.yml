name: Send Weekly Job Alerts

on:
  schedule:
    # Every Tuesday at 9:00 AM UTC
    - cron: '0 9 * * 2'
  workflow_dispatch:

jobs:
  send-weekly-alerts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Send new job alerts for the week
        run: npm run send-new-jobs -- --days 7 --limit 15
        env:
          # Email service
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

          # Firebase Admin SDK (base64-encoded service account JSON)
          # Generate: base64 -i service-account.json | tr -d '\n'
          # Add to GitHub → Settings → Secrets → FIREBASE_SERVICE_ACCOUNT_KEY
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

          # Site configuration
          NEXT_PUBLIC_SITE_URL: https://hashtagweb3.com
