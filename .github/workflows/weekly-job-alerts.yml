name: Send Weekly Job Alerts

on:
  schedule:
    # Every Tuesday at 9:00 AM UTC (adjust timezone as needed)
    # Cron: minute hour day-of-month month day-of-week
    # 0 9 * * 2 = 9:00 AM every Tuesday
    - cron: '0 9 * * 2'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  send-weekly-alerts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Send job alerts
        run: npm run send-alerts -- --limit 15
        env:
          # Email service
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          
          # Firebase configuration
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          
          # Site configuration
          NEXT_PUBLIC_SITE_URL: https://hashtagweb3.com

      - name: Log success
        if: success()
        run: echo "✅ Weekly job alerts sent successfully!"

      - name: Log failure
        if: failure()
        run: echo "❌ Failed to send weekly job alerts"
