name: Weekly Job Alerts

on:
  schedule:
    # Run Mon, Tue, Wed at 9:00 AM UTC
    # Batches ~211 subscribers across 3 days (100/day Resend free-tier limit)
    # All subscribers receive the same weekly digest once
    - cron: '0 9 * * 1,2,3'
  workflow_dispatch:

jobs:
  send-weekly-alerts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Send job alerts (weekly, batched 100/day)
        run: npm run send-new-jobs -- --days 7 --limit 15 --batch-size 100
        env:
          # Email service
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

          # Firebase Admin SDK (base64-encoded service account JSON)
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

          # Site configuration
          NEXT_PUBLIC_SITE_URL: https://hashtagweb3.com
