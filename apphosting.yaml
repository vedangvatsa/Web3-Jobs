# Production: Firebase App Hosting on GCP (project web3-jobs-aggregator).
# See docs/FIREBASE_AND_CLOUDFLARE.md and docs/GCP_COST_OPTIMIZATION.md.
# https://firebase.google.com/docs/app-hosting/configure

# The command that installs dependencies.
fetch: npm ci --prefer-offline --no-audit --no-fund

# The command that installs dependencies and builds your app.
build: npm run build

# The command to start your app.
serve: npm run start

env:
  - variable: NEXT_PUBLIC_POSTHOG_KEY
    value: phc_KjSiNbbK5PNCGDgs2s7kYefJ2kwoSNR0JjLKFg6CuRj
  - variable: NEXT_PUBLIC_POSTHOG_HOST
    value: https://us.i.posthog.com
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: web3-jobs-aggregator
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://hashtagweb3.com

  - variable: NODE_OPTIONS
    value: --max-old-space-size=3072
    availability:
      - BUILD
      - RUNTIME

  # Per-job PNGs + bot previews live in git (refresh-jobs-ingest / publish workflows).
  # Do not set OG_PRECOMPUTE=1 on FAH unless forcing a full regen.
  - variable: OG_PRECOMPUTE
    value: "0"
    availability:
      - BUILD

  # Ingest commits public/og; no build-time OG pass on FAH.
  - variable: OG_FILL_MISSING
    value: "0"
    availability:
      - BUILD

  # Skip heavy prebuild/regen on App Hosting (ingest commits data + OG + sitemap).
  - variable: FAH_FAST_PREBUILD
    value: "1"
    availability:
      - BUILD

runConfig:
  cpu: 1
  memoryMiB: 2048
  # minInstances: 1 costs ~24/7 Cloud Run-style billing (was a major GCP bill driver).
  minInstances: 0
  maxInstances: 1
  # Number of concurrent requests a single instance can handle.
  concurrency: 80
