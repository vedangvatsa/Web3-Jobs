# LEGACY — production is Cloudflare Workers (see docs/FIREBASE_AND_CLOUDFLARE.md).
# Firebase App Hosting on this repo is expensive (Cloud Build + always-on instances).
# Disable backends in Firebase Console and disconnect GitHub before re-enabling GCP billing.
# https://firebase.google.com/docs/app-hosting/configure

# The command that installs dependencies.
fetch: npm ci --prefer-offline --no-audit --no-fund

# The command that installs dependencies and builds your app.
build: npm run build

# The command to start your app.
serve: npm run start

env:
  - variable: NEXT_PUBLIC_POSTHOG_KEY
    value: phc_KjSiNbbK5PNCGDgs2s7kYefJ2kwoSNR0JjLKFg6CuRj
  - variable: NEXT_PUBLIC_POSTHOG_HOST
    value: https://us.i.posthog.com
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: NEXT_PUBLIC_FIREBASE_API_KEY
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    secret: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    secret: NEXT_PUBLIC_FIREBASE_PROJECT_ID
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    secret: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: NEXT_PUBLIC_FIREBASE_APP_ID
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    secret: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://hashtagweb3.com
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
  - variable: CRON_SECRET
    secret: CRON_SECRET

  - variable: NODE_OPTIONS
    value: --max-old-space-size=3072
    availability:
      - BUILD
      - RUNTIME

runConfig:
  cpu: 1
  memoryMiB: 2048
  # minInstances: 1 costs ~24/7 Cloud Run-style billing (was a major GCP bill driver).
  minInstances: 0
  maxInstances: 1
  # Number of concurrent requests a single instance can handle.
  concurrency: 80
