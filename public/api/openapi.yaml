openapi: 3.1.0
info:
  title: Hashtag Web3 static catalogs
  version: 1.1.0
  description: >
    Canonical machine-readable catalogs live at https://hashtagweb3.com/openapi.json.
    Data is served as static JSON under /data/ (CDN). Legacy REST /api/v1/* routes are not hosted.
servers:
  - url: https://hashtagweb3.com
paths:
  /data/jobs-runtime.json:
    get:
      operationId: getJobsCatalog
      summary: Jobs catalog snapshot
      responses:
        '200':
          description: JSON array of jobs (no descriptions)
  /data/events-runtime.json:
    get:
      operationId: getEventsCatalog
      summary: Events catalog snapshot
      responses:
        '200':
          description: JSON events catalog
  /data/glossary-runtime.json:
    get:
      operationId: getGlossaryCatalog
      summary: Glossary catalog snapshot
      responses:
        '200':
          description: JSON glossary catalog
  /data/news-cache.json:
    get:
      operationId: getNewsCatalog
      summary: News headlines cache
      responses:
        '200':
          description: JSON news cache
  /agent-view.json:
    get:
      operationId: getAgentView
      summary: Agent capability index
      responses:
        '200':
          description: Static agent overview JSON
