<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Favicon preview</title>
  <link rel="icon" href="/favicon.ico" />
  <style>
    body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f4f4f5; color: #111; }
    main { max-width: 760px; margin: 48px auto; padding: 0 24px 48px; }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
    p { margin: 0 0 24px; color: #3f3f46; line-height: 1.5; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    .card { background: #fff; border: 1px solid #e4e4e7; border-radius: 12px; padding: 16px; }
    .card.dark { background: #18181b; border-color: #27272a; color: #fafafa; }
    .card strong { display: block; font-size: 12px; margin-bottom: 12px; color: inherit; }
    .row { display: flex; align-items: end; gap: 12px; min-height: 64px; }
    img.tab { width: 16px; height: 16px; image-rendering: pixelated; }
    img.mid { width: 32px; height: 32px; }
    img.big { width: 48px; height: 48px; }
  </style>
</head>
<body>
  <main>
    <h1>Site favicon</h1>
    <p>Upright “#” with round caps, padded for tabs (16–48px), Android/high-DPI (192px), and iOS home screen (180px).</p>
    <div class="grid">
      <div class="card">
        <strong>Tab · light</strong>
        <div class="row">
          <img class="tab" src="/favicon.ico" width="16" height="16" alt="" />
          <img class="mid" src="/icon.png" width="32" height="32" alt="" />
          <img class="big" src="/icon.png" width="48" height="48" alt="" />
        </div>
      </div>
      <div class="card dark">
        <strong>Tab · dark</strong>
        <div class="row">
          <img class="tab" src="/favicon.ico" width="16" height="16" alt="" />
          <img class="mid" src="/icon.png" width="32" height="32" alt="" />
          <img class="big" src="/icon.png" width="48" height="48" alt="" />
        </div>
      </div>
      <div class="card">
        <strong>iOS · 180</strong>
        <div class="row"><img src="/apple-icon.png" width="72" height="72" alt="" /></div>
      </div>
      <div class="card">
        <strong>Android / metadata · 192</strong>
        <div class="row"><img src="/icon.png" width="72" height="72" alt="" /></div>
      </div>
    </div>
  </main>
</body>
</html>
