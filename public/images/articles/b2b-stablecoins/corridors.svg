<svg viewBox="0 0 900 480" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <text x="450" y="44" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="0.5">GLOBAL COMMERCIAL STABLECOIN CORRIDORS</text>
  <text x="450" y="68" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="400">Monthly cross-border transaction volume &amp; high-volume trade routes</text>
  
  <line x1="40" y1="84" x2="860" y2="84" stroke="#334155" stroke-width="1"/>

  <!-- Horizontal Connection Line & Arrows -->
  <path d="M 400 165 L 500 165" stroke="url(#accentGrad)" stroke-width="3" stroke-dasharray="6,4"/>
  <polygon points="495,160 507,165 495,170" fill="#ec4899"/>
  <polygon points="405,160 393,165 405,170" fill="#3b82f6"/>
  <rect x="410" y="148" width="80" height="34" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="450" y="169" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="600">Cross-Border</text>

  <!-- Vertical Connection Line Left -->
  <path d="M 220 230 L 220 280" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="215,275 220,285 225,275" fill="#3b82f6"/>
  <text x="230" y="260" fill="#94a3b8" font-size="11">Finished Goods / Raw Materials</text>

  <!-- Vertical Connection Line Right -->
  <path d="M 680 230 L 680 280" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="675,275 680,285 685,275" fill="#8b5cf6"/>
  <text x="690" y="260" fill="#94a3b8" font-size="11">Electronics &amp; Tech Components</text>

  <!-- Card 1: North America -->
  <rect x="40" y="105" width="350" height="125" rx="12" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="40" y="105" width="6" height="125" rx="3" fill="#3b82f6"/>
  <text x="62" y="133" fill="#60a5fa" font-size="15" font-weight="700">NORTH AMERICA</text>
  <text x="62" y="158" fill="#f8fafc" font-size="14" font-weight="600">US Inflow: <tspan fill="#38bdf8">~$127B / month</tspan></text>
  <text x="62" y="182" fill="#cbd5e1" font-size="12">• Consumer &amp; Wholesale Procurement</text>
  <text x="62" y="202" fill="#cbd5e1" font-size="12">• Primary liquidity source for global trade</text>

  <!-- Card 2: Greater China & Asia-Pac -->
  <rect x="510" y="105" width="350" height="125" rx="12" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1.5"/>
  <rect x="510" y="105" width="6" height="125" rx="3" fill="#8b5cf6"/>
  <text x="532" y="133" fill="#c084fc" font-size="15" font-weight="700">GREATER CHINA &amp; ASIA-PAC</text>
  <text x="532" y="158" fill="#f8fafc" font-size="13" font-weight="600">China: <tspan fill="#a855f7">~$71B/mo</tspan> | Hong Kong: <tspan fill="#a855f7">~$51B/mo</tspan></text>
  <text x="532" y="182" fill="#cbd5e1" font-size="12">• Singapore Regional Liquidity Hub</text>
  <text x="532" y="202" fill="#cbd5e1" font-size="12">• Same-day bill of lading settlement</text>

  <!-- Card 3: Latin America -->
  <rect x="40" y="290" width="350" height="150" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
  <rect x="40" y="290" width="6" height="150" rx="3" fill="#10b981"/>
  <text x="62" y="318" fill="#34d399" font-size="15" font-weight="700">LATIN AMERICA</text>
  <text x="62" y="343" fill="#f8fafc" font-size="14" font-weight="600">Total Inflow: <tspan fill="#34d399">~$174 Billion</tspan></text>
  <text x="62" y="367" fill="#cbd5e1" font-size="12">• US to Mexico: $61.8B (-4.5% shift)</text>
  <text x="62" y="387" fill="#cbd5e1" font-size="12">• Intra-LATAM &amp; South America: <tspan fill="#f59e0b">$112.2B</tspan></text>
  <text x="62" y="407" fill="#cbd5e1" font-size="12">• Balance-sheet dollarization &amp; Pix/SPEI</text>

  <!-- Card 4: Sub-Saharan Africa & Middle East -->
  <rect x="510" y="290" width="350" height="150" rx="12" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="510" y="290" width="6" height="150" rx="3" fill="#f59e0b"/>
  <text x="532" y="318" fill="#fbbf24" font-size="15" font-weight="700">SUB-SAHARAN AFRICA &amp; ME</text>
  <text x="532" y="343" fill="#f8fafc" font-size="14" font-weight="600">SWIFT Friction: <tspan fill="#ef4444">&gt;6.0% Avg Cost</tspan></text>
  <text x="532" y="367" fill="#cbd5e1" font-size="12">• Turkey: High-spread inflation hedge</text>
  <text x="532" y="387" fill="#cbd5e1" font-size="12">• Mobile Money Integration (M-Pesa, MTN)</text>
  <text x="532" y="407" fill="#cbd5e1" font-size="12">• Direct instant off-ramps bypass SWIFT</text>

  <!-- Legend / Footnote -->
  <text x="450" y="464" text-anchor="middle" fill="#64748b" font-size="11">Data Sources: Artemis Analytics, World Bank Remittance Database, Castle Island Ventures</text>
</svg>
