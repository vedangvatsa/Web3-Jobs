<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#182234"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gov-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="agent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="crypto-violet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="600" fill="url(#bg)" rx="16"/>

  <text x="500" y="45" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" letter-spacing="0.5">
    Agentic AI Governance Framework: Autonomous Control & Safeguards
  </text>
  <text x="500" y="70" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">
    Multi-Tier Alignment: Policy Engine, Zero-Knowledge Verification, On-Chain Multi-Sig Circuit Breakers
  </text>

  <!-- Layer 1: Policy Engine & Value Alignment -->
  <g transform="translate(40, 110)">
    <rect width="270" height="210" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
    <rect width="270" height="6" rx="3" fill="url(#gov-emerald)"/>
    <text x="20" y="35" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="700">1. Pre-Execution Policy Engine</text>

    <rect x="15" y="55" width="240" height="36" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="25" y="77" fill="#e2e8f0" font-family="sans-serif" font-size="12">Constitutional AI Rulesets</text>

    <rect x="15" y="100" width="240" height="36" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="25" y="122" fill="#e2e8f0" font-family="sans-serif" font-size="12">RLHF Boundary Guardrails</text>

    <rect x="15" y="145" width="240" height="36" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="25" y="167" fill="#e2e8f0" font-family="sans-serif" font-size="12">Static Value Alignment Checks</text>
  </g>

  <!-- Flow 1 to 2 -->
  <path d="M 310 215 L 360 215" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Layer 2: Autonomous Agent Execution -->
  <g transform="translate(365, 110)">
    <rect width="270" height="210" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
    <rect width="270" height="6" rx="3" fill="url(#agent-cyan)"/>
    <text x="20" y="35" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="700">2. Autonomous Reasoning Loop</text>

    <rect x="15" y="55" width="240" height="36" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="25" y="77" fill="#e2e8f0" font-family="sans-serif" font-size="12">Tool Use & API Execution</text>

    <rect x="15" y="100" width="240" height="36" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="25" y="122" fill="#e2e8f0" font-family="sans-serif" font-size="12">Memory Vector Store Retrieval</text>

    <rect x="15" y="145" width="240" height="36" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="25" y="167" fill="#e2e8f0" font-family="sans-serif" font-size="12">Multi-Agent Negotiation Protocols</text>
  </g>

  <!-- Flow 2 to 3 -->
  <path d="M 635 215 L 685 215" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Layer 3: Web3 Cryptographic Enforcement -->
  <g transform="translate(690, 110)">
    <rect width="270" height="210" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
    <rect width="270" height="6" rx="3" fill="url(#crypto-violet)"/>
    <text x="20" y="35" fill="#a78bfa" font-family="sans-serif" font-size="14" font-weight="700">3. On-Chain Circuit Breakers</text>

    <rect x="15" y="55" width="240" height="36" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="25" y="77" fill="#e2e8f0" font-family="sans-serif" font-size="12">zkML Inference Verifiers</text>

    <rect x="15" y="100" width="240" height="36" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="25" y="122" fill="#e2e8f0" font-family="sans-serif" font-size="12">Smart Contract Spending Limits</text>

    <rect x="15" y="145" width="240" height="36" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="25" y="167" fill="#e2e8f0" font-family="sans-serif" font-size="12">Human-in-the-Loop Override Multi-Sig</text>
  </g>

  <!-- Bottom Section: Governance Pillars -->
  <g transform="translate(40, 350)">
    <rect width="920" height="210" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="35" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">Core Governance Pillars for Autonomous Agentic Infrastructure</text>

    <rect x="25" y="55" width="275" height="135" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="40" y="85" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="700">Interpretability & Auditing</text>
    <text x="40" y="108" fill="#94a3b8" font-family="sans-serif" font-size="12">Cryptographic audit trails</text>
    <text x="40" y="126" fill="#94a3b8" font-family="sans-serif" font-size="12">for internal reasoning chains</text>
    <text x="40" y="144" fill="#94a3b8" font-family="sans-serif" font-size="12">and tool invocation logs.</text>

    <rect x="322" y="55" width="275" height="135" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="337" y="85" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700">Bounded Autonomy</text>
    <text x="337" y="108" fill="#94a3b8" font-family="sans-serif" font-size="12">Hard-coded economic caps,</text>
    <text x="337" y="126" fill="#94a3b8" font-family="sans-serif" font-size="12">rate limiters, and mandatory</text>
    <text x="337" y="144" fill="#94a3b8" font-family="sans-serif" font-size="12">human signature thresholds.</text>

    <rect x="620" y="55" width="275" height="135" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="635" y="85" fill="#a78bfa" font-family="sans-serif" font-size="13" font-weight="700">Decentralized Attestation</text>
    <text x="635" y="108" fill="#94a3b8" font-family="sans-serif" font-size="12">TEEs (Trusted Execution Enclaves)</text>
    <text x="635" y="126" fill="#94a3b8" font-family="sans-serif" font-size="12">and zero-knowledge proofs ensuring</text>
    <text x="635" y="144" fill="#94a3b8" font-family="sans-serif" font-size="12">unaltered model weights.</text>
  </g>

</svg>
