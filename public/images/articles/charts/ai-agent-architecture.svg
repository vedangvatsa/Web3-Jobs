<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <text x="600" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#f8fafc" text-anchor="middle">AUTONOMOUS AI AGENT SYSTEM ARCHITECTURE</text>
  <text x="600" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#a78bfa" text-anchor="middle">Perception, Reasoning, Tool Calling, Vector Memory &amp; Execution Environment</text>

  <!-- Agent Core Container -->
  <rect x="350" y="110" width="500" height="380" rx="16" fill="url(#boxGrad)" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="350" y="110" width="500" height="45" rx="16" fill="#8b5cf6"/>
  <text x="600" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Agent Core (LLM Reasoning Engine)</text>

  <!-- Modules inside Core -->
  <rect x="380" y="175" width="210" height="85" rx="8" fill="#020617" stroke="#4c1d95"/>
  <text x="485" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#c084fc" text-anchor="middle">Planning &amp; ReAct</text>
  <text x="485" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Task Decomposition &amp; Reflection</text>

  <rect x="610" y="175" width="210" height="85" rx="8" fill="#020617" stroke="#4c1d95"/>
  <text x="715" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#c084fc" text-anchor="middle">Memory Engine</text>
  <text x="715" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Short-term &amp; Vector Embeddings</text>

  <rect x="380" y="280" width="440" height="180" rx="8" fill="#020617" stroke="#4c1d95"/>
  <text x="600" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">Tool Calling &amp; Execution Dispatcher</text>

  <rect x="400" y="330" width="180" height="50" rx="6" fill="#1e293b" stroke="#0284c7"/>
  <text x="490" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#7dd3fc" text-anchor="middle">REST APIs / RPCs</text>

  <rect x="600" y="330" width="200" height="50" rx="6" fill="#1e293b" stroke="#0284c7"/>
  <text x="700" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#7dd3fc" text-anchor="middle">Web Browser Automation</text>

  <rect x="400" y="395" width="400" height="50" rx="6" fill="#1e293b" stroke="#059669"/>
  <text x="600" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6ee7b7" text-anchor="middle">On-Chain Smart Contract Exec (x402 / ERC-4337)</text>

  <!-- Left: Perception Sensors -->
  <rect x="60" y="200" width="230" height="200" rx="12" fill="url(#boxGrad)" stroke="#3b82f6" stroke-width="2"/>
  <text x="175" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#60a5fa" text-anchor="middle">Perception &amp; Inputs</text>
  <text x="175" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">• User Prompts &amp; Intent</text>
  <text x="175" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">• Web Scraping &amp; DOM</text>
  <text x="175" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">• On-Chain Event Feeds</text>
  <text x="175" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">• Sensor &amp; Telemetry Data</text>

  <!-- Right: Environment / Action -->
  <rect x="910" y="200" width="230" height="200" rx="12" fill="url(#boxGrad)" stroke="#10b981" stroke-width="2"/>
  <text x="1025" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#34d399" text-anchor="middle">Environment &amp; Output</text>
  <text x="1025" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">• DeFi Yield Transfers</text>
  <text x="1025" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">• Database Mutations</text>
  <text x="1025" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">• Code Generation &amp; Commit</text>
  <text x="1025" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">• Autonomous Transactions</text>

  <!-- Connections -->
  <path d="M 290 300 L 350 300" stroke="#3b82f6" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 850 300 L 910 300" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Footer -->
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Hashtag Web3 AI Agent System Architecture Series</text>
</svg>
