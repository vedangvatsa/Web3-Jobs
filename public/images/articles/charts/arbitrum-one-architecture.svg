<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1d2a44"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="arb-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#28a0f0"/>
      <stop offset="100%" stop-color="#0052ff"/>
    </linearGradient>
    <linearGradient id="nitro-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7e5f"/>
      <stop offset="100%" stop-color="#feb47b"/>
    </linearGradient>
    <linearGradient id="eth-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#627eea"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="600" fill="url(#bg)" rx="16"/>

  <text x="500" y="45" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" letter-spacing="0.5">
    Arbitrum One Architecture: Rollup Execution & Fraud Proving
  </text>
  <text x="500" y="70" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">
    Off-Chain Nitro Execution Engine, Sequencer Batching, Interactive Multi-Round Fraud Proofs & L1 Settlement
  </text>

  <!-- L2 Sequencer Block -->
  <g transform="translate(40, 110)">
    <rect width="270" height="210" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
    <rect width="270" height="6" rx="3" fill="url(#arb-blue)"/>
    <text x="20" y="35" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="700">1. Arbitrum Nitro Engine</text>

    <rect x="15" y="55" width="240" height="36" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="25" y="77" fill="#e2e8f0" font-family="sans-serif" font-size="12">Geth Core (EVM Equivalence)</text>

    <rect x="15" y="100" width="240" height="36" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="25" y="122" fill="#e2e8f0" font-family="sans-serif" font-size="12">Sub-second Sequencer Feed</text>

    <rect x="15" y="145" width="240" height="36" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="25" y="167" fill="#e2e8f0" font-family="sans-serif" font-size="12">Brotli Batch Compression</text>
  </g>

  <!-- Flow 1 to 2 -->
  <path d="M 310 215 L 360 215" stroke="#28a0f0" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Fraud Proving Engine -->
  <g transform="translate(365, 110)">
    <rect width="270" height="210" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
    <rect width="270" height="6" rx="3" fill="url(#nitro-orange)"/>
    <text x="20" y="35" fill="#ff7e5f" font-family="sans-serif" font-size="14" font-weight="700">2. Multi-Round Fraud Proofs</text>

    <rect x="15" y="55" width="240" height="36" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="25" y="77" fill="#e2e8f0" font-family="sans-serif" font-size="12">Interactive Bisection Game</text>

    <rect x="15" y="100" width="240" height="36" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="25" y="122" fill="#e2e8f0" font-family="sans-serif" font-size="12">WASM One-Step Execution</text>

    <rect x="15" y="145" width="240" height="36" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="25" y="167" fill="#e2e8f0" font-family="sans-serif" font-size="12">7-Day Challenge Window</text>
  </g>

  <!-- Flow 2 to 3 -->
  <path d="M 635 215 L 685 215" stroke="#ff7e5f" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Ethereum L1 Settlement -->
  <g transform="translate(690, 110)">
    <rect width="270" height="210" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
    <rect width="270" height="6" rx="3" fill="url(#eth-purple)"/>
    <text x="20" y="35" fill="#c084fc" font-family="sans-serif" font-size="14" font-weight="700">3. Ethereum Mainnet L1</text>

    <rect x="15" y="55" width="240" height="36" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="25" y="77" fill="#e2e8f0" font-family="sans-serif" font-size="12">Bridge & Inbox Contracts</text>

    <rect x="15" y="100" width="240" height="36" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="25" y="122" fill="#e2e8f0" font-family="sans-serif" font-size="12">EIP-4844 Blob Data Availability</text>

    <rect x="15" y="145" width="240" height="36" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="25" y="167" fill="#e2e8f0" font-family="sans-serif" font-size="12">Rollup State Root Finality</text>
  </g>

  <!-- Bottom Section: Ecosystem Comparison -->
  <g transform="translate(40, 350)">
    <rect width="920" height="210" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="35" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">Arbitrum Ecosystem Stack: Arbitrum One vs Nova vs Stylus</text>

    <rect x="25" y="55" width="275" height="135" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="40" y="85" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700">Arbitrum One (Rollup)</text>
    <text x="40" y="108" fill="#94a3b8" font-family="sans-serif" font-size="12">Full L1 security model.</text>
    <text x="40" y="126" fill="#94a3b8" font-family="sans-serif" font-size="12">Ideal for DeFi protocols</text>
    <text x="40" y="144" fill="#94a3b8" font-family="sans-serif" font-size="12">& asset management TVL.</text>

    <rect x="322" y="55" width="275" height="135" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="337" y="85" fill="#ff7e5f" font-family="sans-serif" font-size="13" font-weight="700">Arbitrum Nova (AnyTrust)</text>
    <text x="337" y="108" fill="#94a3b8" font-family="sans-serif" font-size="12">Data Availability Committee.</text>
    <text x="337" y="126" fill="#94a3b8" font-family="sans-serif" font-size="12">Ultra-low transaction fees</text>
    <text x="337" y="144" fill="#94a3b8" font-family="sans-serif" font-size="12">for gaming & social apps.</text>

    <rect x="620" y="55" width="275" height="135" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="635" y="85" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="700">Arbitrum Stylus (Multi-Lang)</text>
    <text x="635" y="108" fill="#94a3b8" font-family="sans-serif" font-size="12">WASM VM co-processing.</text>
    <text x="635" y="126" fill="#94a3b8" font-family="sans-serif" font-size="12">Write contracts in Rust,</text>
    <text x="635" y="144" fill="#94a3b8" font-family="sans-serif" font-size="12">C, C++ with EVM interoperability.</text>
  </g>

</svg>
