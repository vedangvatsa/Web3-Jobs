<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="bm-title bm-desc">
<title id="bm-title">Balancer Weighted Pool Math and Multi-Asset Architecture</title>
<desc id="bm-desc">Architectural diagram explaining Balancer Constant Mean Market Maker formula, arbitrary weight distribution (80/20 pools), and impermanent loss mitigation.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:11px;fill:#334155}
.header{font-weight:700;fill:#1e293b;font-size:12px}
.card{fill:#ffffff;stroke:#e2e8f0}
.box-vault{fill:#eff6ff;stroke:#2563eb;stroke-width:1.5}
.box-math{fill:#f8fafc;stroke:#64748b;stroke-width:1.5}
.pie1{fill:#3b82f6}
.pie2{fill:#10b981}
.pie3{fill:#f59e0b}
.pie4{fill:#8b5cf6}
@media (prefers-color-scheme:dark){
text{fill:#cbd5e1}.header{fill:#f1f5f9}.card{fill:#0f172a;stroke:#1e293b}
.box-vault{fill:#172554;stroke:#60a5fa}.box-math{fill:#1e293b;stroke:#475569}
}
</style>

<rect class="card" x="1" y="1" width="638" height="358" rx="12"/>
<text x="24" y="30" font-weight="700" font-size="15">Balancer Weighted Pools: Constant Mean Architecture</text>
<text x="24" y="48" font-size="11" fill="#64748b">Generalized N-dimensional automated market maker supporting custom asset weights</text>

<!-- Vault Architecture Left -->
<rect class="box-vault" x="24" y="70" width="280" height="255" rx="8"/>
<text x="36" y="94" class="header" fill="#2563eb">The Balancer Single Vault Architecture</text>

<text x="36" y="118" font-weight="600">Decoupled Accounting &amp; Logic:</text>
<text x="36" y="132" font-size="10" fill="#64748b">All tokens held in a single central Vault</text>
<text x="36" y="146" font-size="10" fill="#64748b">Pools are isolated mathematical contracts</text>

<text x="36" y="172" font-weight="600">80/20 Pool Weight Example:</text>
<text x="36" y="186" font-size="10" fill="#64748b">80% Protocol Token / 20% WETH</text>

<!-- Mini visual ratio bar -->
<rect x="36" y="198" width="180" height="14" rx="4" fill="#3b82f6"/>
<rect x="216" y="198" width="45" height="14" rx="4" fill="#10b981"/>
<text x="100" y="209" fill="#ffffff" font-size="9" font-weight="700">80% BAL</text>
<text x="222" y="209" fill="#ffffff" font-size="9" font-weight="700">20% ETH</text>

<text x="36" y="234" font-weight="600">Impermanent Loss Mitigation:</text>
<text x="36" y="248" font-size="10" fill="#64748b">80/20 pools reduce IL by over 65%</text>
<text x="36" y="262" font-size="10" fill="#64748b">compared to standard 50/50 AMMs</text>

<text x="36" y="288" font-weight="600">Gas-Efficient Multi-Hops:</text>
<text x="36" y="302" font-size="10" fill="#16a34a">Batch swaps execute without token transfers</text>

<!-- Math Details Right -->
<rect class="box-math" x="320" y="70" width="296" height="255" rx="8"/>
<text x="332" y="94" class="header">Constant Mean Value Function</text>

<text x="332" y="120" font-family="monospace" font-size="12" fill="#2563eb">V = \prod_{i=1}^n B_i^{w_i}</text>

<text x="332" y="146" font-weight="600">Invariant Rule:</text>
<text x="332" y="160" font-size="10" fill="#64748b">The value function V must remain invariant</text>
<text x="332" y="174" font-size="10" fill="#64748b">before and after every trade (less fees).</text>

<text x="332" y="200" font-weight="600">Out-Given-In Swap Formula:</text>
<text x="332" y="218" font-family="monospace" font-size="10" fill="#2563eb">A_{out} = B_{out} \cdot \left(1 - \left(rac{B_{in}}{B_{in} + A_{in} \cdot (1 - \gamma)}ight)^{rac{w_{in}}{w_{out}}}ight)</text>

<text x="332" y="246" font-weight="600">Multi-Asset Index Portfolios:</text>
<text x="332" y="260" font-size="10" fill="#64748b">- Pools support up to 8 assets simultaneously</text>
<text x="332" y="274" font-size="10" fill="#64748b">- Automatically rebalances via external arbitrage</text>
<text x="332" y="288" font-size="10" fill="#64748b">- LPs collect fees instead of paying management fees</text>
</svg>