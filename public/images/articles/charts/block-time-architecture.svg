<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <text x="600" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#f8fafc" text-anchor="middle">BLOCK TIME &amp; FINALITY ARCHITECTURE ACROSS BLOCKCHAINS</text>
  <text x="600" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">P2P Network Propagation, Slot Mechanics, Difficulty Adjustment &amp; Finality Trade-Offs</text>

  <!-- Bitcoin Column -->
  <rect x="50" y="120" width="250" height="440" rx="12" fill="url(#boxGrad)" stroke="#f59e0b" stroke-width="2"/>
  <rect x="50" y="120" width="250" height="45" rx="12" fill="#d97706"/>
  <text x="175" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Bitcoin (PoW)</text>
  <text x="175" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#fbbf24" text-anchor="middle" font-weight="bold">Target Block Time: ~10 min</text>

  <text x="70" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e2e8f0">• Consensus: Nakamoto PoW</text>
  <text x="70" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e2e8f0">• Difficulty Retarget: 2016 Blocks</text>
  <text x="70" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e2e8f0">• Finality Model: Probabilistic</text>
  <text x="70" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e2e8f0">• Safe Confirmations: 6 Blocks (~60m)</text>
  <text x="70" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">• Focus: Max Security &amp; P2P Sync</text>

  <rect x="70" y="360" width="210" height="170" rx="8" fill="#020617" stroke="#475569"/>
  <text x="175" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#fbbf24" text-anchor="middle">Difficulty Adjustment Equation</text>
  <text x="175" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">NextDiff = OldDiff *</text>
  <text x="175" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">(ActualTime / 20160 min)</text>

  <!-- Ethereum Column -->
  <rect x="335" y="120" width="250" height="440" rx="12" fill="url(#boxGrad)" stroke="#6366f1" stroke-width="2"/>
  <rect x="335" y="120" width="250" height="45" rx="12" fill="#4f46e5"/>
  <text x="460" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Ethereum (PoS Gasper)</text>
  <text x="460" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#a5b4fc" text-anchor="middle" font-weight="bold">Slot Time: Exactly 12 sec</text>

  <text x="355" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e2e8f0">• Epoch Structure: 32 Slots (6.4m)</text>
  <text x="355" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e2e8f0">• Finality Model: Casper FFG</text>
  <text x="355" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e2e8f0">• Safe Finality: 2 Epochs (~12.8m)</text>
  <text x="355" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e2e8f0">• Slashing Resistance: 33% / 66%</text>
  <text x="355" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">• Focus: Predictability &amp; Smart State</text>

  <rect x="355" y="360" width="210" height="170" rx="8" fill="#020617" stroke="#475569"/>
  <text x="460" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#a5b4fc" text-anchor="middle">Slot &amp; Epoch Architecture</text>
  <text x="460" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">1 Slot = 1 Block Proposal</text>
  <text x="460" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">32 Slots = 1 Attestation Epoch</text>

  <!-- Solana Column -->
  <rect x="620" y="120" width="250" height="440" rx="12" fill="url(#boxGrad)" stroke="#10b981" stroke-width="2"/>
  <rect x="620" y="120" width="250" height="45" rx="12" fill="#059669"/>
  <text x="745" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Solana (PoH + Tower BFT)</text>
  <text x="745" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#6ee7b7" text-anchor="middle" font-weight="bold">Slot Time: ~400 ms</text>

  <text x="640" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e2e8f0">• Proof of History: Verifiable Time</text>
  <text x="640" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e2e8f0">• Turbine P2P Shredding Protocol</text>
  <text x="640" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e2e8f0">• Finality Model: Tower BFT</text>
  <text x="640" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e2e8f0">• Optimistic Finality: ~1.2 sec</text>
  <text x="640" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">• Focus: High Throughput &amp; Orderbook</text>

  <rect x="640" y="360" width="210" height="170" rx="8" fill="#020617" stroke="#475569"/>
  <text x="745" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6ee7b7" text-anchor="middle">PoH Hash Clock Pipeline</text>
  <text x="745" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">SHA-256 Sequential Loop</text>
  <text x="745" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Verifiable Delay Function (VDF)</text>

  <!-- L2 Rollups Column -->
  <rect x="905" y="120" width="245" height="440" rx="12" fill="url(#boxGrad)" stroke="#0284c7" stroke-width="2"/>
  <rect x="905" y="120" width="245" height="45" rx="12" fill="#0369a1"/>
  <text x="1027" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Arbitrum / Optimism (L2)</text>
  <text x="1027" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#7dd3fc" text-anchor="middle" font-weight="bold">Block Time: ~250 ms</text>

  <text x="922" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e2e8f0">• Sequencer: Instant Off-Chain Soft</text>
  <text x="922" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e2e8f0">• L1 Batch Submission: Every 1-3m</text>
  <text x="922" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e2e8f0">• Dispute Window: 7-Day Fraud</text>
  <text x="922" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e2e8f0">• ZK Rollup Finality: Minutes</text>
  <text x="922" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">• Focus: Instant Soft UI Settlement</text>

  <rect x="922" y="360" width="210" height="170" rx="8" fill="#020617" stroke="#475569"/>
  <text x="1027" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#7dd3fc" text-anchor="middle">Two-Tier Finality Pipeline</text>
  <text x="1027" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">1. Soft Finality: Sequencer UI</text>
  <text x="1027" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">2. Hard Finality: L1 Ethereum</text>

  <text x="600" y="595" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Hashtag Web3 Consensus &amp; Protocol Architecture Series</text>
</svg>
