<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="op-title op-desc">
<title id="op-title">The Blockchain Oracle Problem and Decentralized Resolution Architecture</title>
<desc id="op-desc">Architectural diagram explaining why isolated deterministic blockchains cannot access external APIs, and how decentralized oracle networks bridge this boundary.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:11px;fill:#334155}
.header{font-weight:700;fill:#1e293b;font-size:12px}
.card{fill:#ffffff;stroke:#e2e8f0}
.box-off{fill:#f8fafc;stroke:#64748b;stroke-width:1.5}
.box-don{fill:#eff6ff;stroke:#2563eb;stroke-width:1.5}
.box-on{fill:#f0fdf4;stroke:#16a34a;stroke-width:1.5}
.arrow{stroke:#64748b;stroke-width:1.5;fill:none;marker-end:url(#arrowhead-op)}
@media (prefers-color-scheme:dark){
text{fill:#cbd5e1}.header{fill:#f1f5f9}.card{fill:#0f172a;stroke:#1e293b}
.box-off{fill:#1e293b;stroke:#475569}.box-don{fill:#172554;stroke:#60a5fa}.box-on{fill:#064e3b;stroke:#34d399}
.arrow{stroke:#94a3b8}
}
</style>
<defs>
<marker id="arrowhead-op" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
<polygon points="0 0, 6 3, 0 6" fill="#64748b" />
</marker>
</defs>

<rect class="card" x="1" y="1" width="638" height="358" rx="12"/>
<text x="24" y="30" font-weight="700" font-size="15">The Blockchain Oracle Problem: Architecture &amp; Bridge Mechanics</text>
<text x="24" y="48" font-size="11" fill="#64748b">Decoupling deterministic smart contract execution from non-deterministic external reality</text>

<!-- Column 1: External World -->
<rect class="box-off" x="24" y="70" width="170" height="250" rx="8"/>
<text x="36" y="94" class="header">Off-Chain World</text>
<text x="36" y="112" font-size="10" fill="#64748b">Asynchronous &amp; Non-Deterministic</text>

<text x="36" y="138" font-weight="600">Financial Markets:</text>
<text x="36" y="152" font-size="10" fill="#64748b">Binance, Coinbase, Nasdaq</text>

<text x="36" y="176" font-weight="600">Real-World Sensors:</text>
<text x="36" y="190" font-size="10" fill="#64748b">Weather stations, IoT, GPS</text>

<text x="36" y="214" font-weight="600">Web APIs &amp; Enterprise:</text>
<text x="36" y="228" font-size="10" fill="#64748b">REST endpoints, SQL DBs</text>

<text x="36" y="252" font-weight="600">The Problem:</text>
<text x="36" y="266" font-size="10" fill="#ef4444">Nodes cannot agree on</text>
<text x="36" y="280" font-size="10" fill="#ef4444">external HTTP responses</text>

<!-- Arrow 1 to 2 -->
<path class="arrow" d="M194 195 L224 195"/>

<!-- Column 2: Decentralized Oracle Network -->
<rect class="box-don" x="226" y="70" width="188" height="250" rx="8"/>
<text x="238" y="94" class="header" fill="#2563eb">Decentralized Oracle (DON)</text>
<text x="238" y="112" font-size="10" fill="#2563eb">Consensus &amp; Attestation Layer</text>

<text x="238" y="138" font-weight="600">Independent Node Operators:</text>
<text x="238" y="152" font-size="10" fill="#64748b">Diverse institutional runners</text>

<text x="238" y="176" font-weight="600">Off-Chain Reporting (OCR):</text>
<text x="238" y="190" font-size="10" fill="#64748b">P2P round protocol gathers data</text>

<text x="238" y="214" font-weight="600">Fault Tolerant Aggregation:</text>
<text x="238" y="228" font-size="10" fill="#64748b">Medianization filters outliers</text>

<text x="238" y="252" font-weight="600">Threshold Cryptography:</text>
<text x="238" y="266" font-size="10" fill="#64748b">Single aggregate Schnorr/BLS</text>
<text x="238" y="280" font-size="10" fill="#64748b">signature validates batch</text>

<!-- Arrow 2 to 3 -->
<path class="arrow" d="M414 195 L444 195"/>

<!-- Column 3: On-Chain Blockchain -->
<rect class="box-on" x="446" y="70" width="170" height="250" rx="8"/>
<text x="458" y="94" class="header" fill="#16a34a">On-Chain Settlement</text>
<text x="458" y="112" font-size="10" fill="#16a34a">Deterministic Consensus</text>

<text x="458" y="138" font-weight="600">Aggregator Contract:</text>
<text x="458" y="152" font-size="10" fill="#64748b">Verifies threshold signature</text>

<text x="458" y="176" font-weight="600">Immutable State Update:</text>
<text x="458" y="190" font-size="10" fill="#64748b">latestAnswer, updatedAt</text>

<text x="458" y="214" font-weight="600">DeFi Consumption:</text>
<text x="458" y="228" font-size="10" fill="#64748b">Aave collateral calculations</text>
<text x="458" y="242" font-size="10" fill="#64748b">Synthetix synthetic pricing</text>

<text x="458" y="266" font-weight="600">Guaranteed Property:</text>
<text x="458" y="280" font-size="10" fill="#16a34a">Every node replays identically</text>
</svg>