<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="val-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="emerald-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="cyan-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="violet-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="v-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1000" height="520" fill="url(#val-bg)"/>

  <text x="500" y="45" fill="#f8fafc" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="0.5">Proof-of-Stake Validator Infrastructure &amp; Consensus Architecture</text>
  <text x="500" y="70" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="middle">Consensus Engine, Remote Key Signing, Slashing Protection, and MEV-Boost Auctions</text>

  <!-- Component 1: Consensus Engine -->
  <g transform="translate(40, 110)" filter="url(#v-shadow)">
    <rect width="260" height="340" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="6" rx="3" fill="url(#emerald-gradient)"/>
    <text x="20" y="40" fill="#34d399" font-size="14" font-weight="700">1. CONSENSUS ENGINE</text>

    <rect x="20" y="65" width="220" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="35" y="90" fill="#f1f5f9" font-size="13" font-weight="600">Beacon Client (Prysm/Lighthouse)</text>
    <text x="35" y="112" fill="#94a3b8" font-size="11">Slot Attestation &amp; Block Proposals</text>

    <rect x="20" y="150" width="220" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="35" y="175" fill="#f1f5f9" font-size="13" font-weight="600">Execution Client (Reth/Geth)</text>
    <text x="35" y="197" fill="#94a3b8" font-size="11">Engine API JWT Authentication</text>

    <rect x="20" y="235" width="220" height="75" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="35" y="260" fill="#34d399" font-size="13" font-weight="600">Sync Checkpoint Client</text>
    <text x="35" y="282" fill="#94a3b8" font-size="11">Weak Subjectivity Sync Anchor</text>
  </g>

  <!-- Flow Line 1-2 -->
  <path d="M 300 280 L 360 280" stroke="#34d399" stroke-width="3" fill="none"/>

  <!-- Component 2: Key Management & Slashing DB -->
  <g transform="translate(370, 110)" filter="url(#v-shadow)">
    <rect width="260" height="340" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="6" rx="3" fill="url(#cyan-gradient)"/>
    <text x="20" y="40" fill="#22d3ee" font-size="14" font-weight="700">2. REMOTE KEY SIGNING</text>

    <rect x="20" y="65" width="220" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="35" y="90" fill="#f1f5f9" font-size="13" font-weight="600">Web3Signer Remote Manager</text>
    <text x="35" y="112" fill="#94a3b8" font-size="11">gRPC Encrypted Key Transport</text>

    <rect x="20" y="150" width="220" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="35" y="175" fill="#f1f5f9" font-size="13" font-weight="600">Slashing Protection Database</text>
    <text x="35" y="197" fill="#94a3b8" font-size="11">PostgreSQL High-Watermark DB</text>

    <rect x="20" y="235" width="220" height="75" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1"/>
    <text x="35" y="260" fill="#22d3ee" font-size="13" font-weight="600">Hardware Security Module</text>
    <text x="35" y="282" fill="#94a3b8" font-size="11">AWS KMS / YubiHSM Key Enclave</text>
  </g>

  <!-- Flow Line 2-3 -->
  <path d="M 630 280 L 690 280" stroke="#22d3ee" stroke-width="3" fill="none"/>

  <!-- Component 3: MEV-Boost & Yield Extraction -->
  <g transform="translate(700, 110)" filter="url(#v-shadow)">
    <rect width="260" height="340" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="6" rx="3" fill="url(#violet-gradient)"/>
    <text x="20" y="40" fill="#a78bfa" font-size="14" font-weight="700">3. MEV-BOOST &amp; REWARDS</text>

    <rect x="20" y="65" width="220" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="35" y="90" fill="#f1f5f9" font-size="13" font-weight="600">MEV-Boost Middleware</text>
    <text x="35" y="112" fill="#94a3b8" font-size="11">Block Builder Auction Relay</text>

    <rect x="20" y="150" width="220" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="35" y="175" fill="#f1f5f9" font-size="13" font-weight="600">Validator Staking Rewards</text>
    <text x="35" y="197" fill="#94a3b8" font-size="11">Consensus Yield + Execution Tips</text>

    <rect x="20" y="235" width="220" height="75" rx="8" fill="#0f172a" stroke="#7c3aed" stroke-width="1"/>
    <text x="35" y="260" fill="#a78bfa" font-size="13" font-weight="600">Restaking Middleware (EigenLayer)</text>
    <text x="35" y="282" fill="#94a3b8" font-size="11">AVS Security Yield Delegation</text>
  </g>

  <!-- Footer Info -->
  <rect x="40" y="475" width="920" height="30" rx="6" fill="#1e293b"/>
  <text x="500" y="495" fill="#94a3b8" font-size="12" font-weight="500" text-anchor="middle">Hashtag Web3 Technical Career Blueprint — Blockchain Validator &amp; Staking Systems Infrastructure</text>
</svg>
