<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="cl-title cl-desc">
<title id="cl-title">Uniswap v3 Concentrated Liquidity and Tick Math Architecture</title>
<desc id="cl-desc">Diagram showing virtual reserves, discrete tick spacing, and capital efficiency multipliers in Uniswap v3 concentrated liquidity pools.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:11px;fill:#334155}
.header{font-weight:700;fill:#1e293b;font-size:12px}
.card{fill:#ffffff;stroke:#e2e8f0}
.box-tick{fill:#eff6ff;stroke:#2563eb;stroke-width:1.5}
.box-cap{fill:#f8fafc;stroke:#64748b;stroke-width:1.5}
.active-band{fill:#dbeafe;stroke:#3b82f6;stroke-width:1.5}
@media (prefers-color-scheme:dark){
text{fill:#cbd5e1}.header{fill:#f1f5f9}.card{fill:#0f172a;stroke:#1e293b}
.box-tick{fill:#172554;stroke:#60a5fa}.box-cap{fill:#1e293b;stroke:#475569}
.active-band{fill:#1e3a8a;stroke:#60a5fa}
}
</style>

<rect class="card" x="1" y="1" width="638" height="358" rx="12"/>
<text x="24" y="30" font-weight="700" font-size="15">Uniswap v3 Concentrated Liquidity: Tick Math &amp; Capital Efficiency</text>
<text x="24" y="48" font-size="11" fill="#64748b">Restricting capital to bounded price intervals [p_a, p_b] for up to 4000x capital multiplier</text>

<!-- Left: Tick Range Visualization -->
<rect class="box-tick" x="24" y="70" width="280" height="255" rx="8"/>
<text x="36" y="94" class="header" fill="#2563eb">Concentrated Liquidity Range [p_a, p_b]</text>

<!-- Price Axis -->
<line x1="45" y1="180" x2="280" y2="180" stroke="#64748b" stroke-width="1.5"/>
<circle cx="160" cy="180" r="5" fill="#2563eb"/>
<text x="145" y="165" font-weight="700" fill="#2563eb">Current Price P</text>

<!-- Lower and Upper Tick Bands -->
<rect class="active-band" x="90" y="120" width="140" height="85" rx="4"/>
<line x1="90" y1="120" x2="90" y2="215" stroke="#ef4444" stroke-width="2"/>
<line x1="230" y1="120" x2="230" y2="215" stroke="#10b981" stroke-width="2"/>

<text x="65" y="230" font-size="10" font-weight="600" fill="#ef4444">Lower Tick p_a</text>
<text x="210" y="230" font-size="10" font-weight="600" fill="#10b981">Upper Tick p_b</text>

<text x="36" y="260" font-weight="600">In-Range State:</text>
<text x="36" y="274" font-size="10" fill="#64748b">LP earns proportional swap fees</text>

<text x="36" y="295" font-weight="600">Out-of-Range State:</text>
<text x="36" y="309" font-size="10" fill="#ef4444">100% single asset; 0 fees earned</text>

<!-- Right: Virtual Reserves Math -->
<rect class="box-cap" x="320" y="70" width="296" height="255" rx="8"/>
<text x="332" y="94" class="header">Virtual Reserves Formula</text>

<text x="332" y="122" font-family="monospace" font-size="10" fill="#2563eb">\left(x + rac{L}{\sqrt{p_b}}ight)\left(y + L\sqrt{p_a}ight) = L^2</text>

<text x="332" y="152" font-weight="600">Discrete Tick Geometry:</text>
<text x="332" y="168" font-family="monospace" font-size="10" fill="#2563eb">p(i) = 1.0001^i</text>
<text x="332" y="184" font-size="10" fill="#64748b">Every tick i represents 1 basis point (0.01%)</text>

<text x="332" y="210" font-weight="600">Capital Efficiency Multiplier:</text>
<text x="332" y="228" font-family="monospace" font-size="10" fill="#16a34a">Efficiency = rac{1}{1 - \sqrt{p_a / p_b}}</text>

<text x="332" y="254" font-size="10" fill="#64748b">- 0.1% range (stables): ~4000x capital multiplier</text>
<text x="332" y="268" font-size="10" fill="#64748b">- 10% range (ETH/USDC): ~20x capital multiplier</text>
<text x="332" y="282" font-size="10" fill="#64748b">- Non-fungible positions: Represented as ERC-721</text>
</svg>