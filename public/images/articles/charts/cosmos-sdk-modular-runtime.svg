<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="sdk-title sdk-desc">
<title id="sdk-title">Cosmos SDK Modular Architecture and Execution Hierarchy</title>
<desc id="sdk-desc">Technical breakdown of Cosmos SDK stack: CometBFT consensus engine, ABCI 2.0 interface, BaseApp routing, core modules, and IAVL state storage.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:12px;fill:#334155}
.header{font-weight:700;fill:#1e293b;font-size:12px}
.card{fill:#ffffff;stroke:#e2e8f0}.grid{stroke:#e2e8f0}
.box-top{fill:#f0fdf4;stroke:#16a34a;stroke-width:1.5}
.box-mid{fill:#eff6ff;stroke:#2563eb;stroke-width:1.5}
.box-bot{fill:#faf5ff;stroke:#9333ea;stroke-width:1.5}
.arrow{stroke:#64748b;stroke-width:1.5;fill:none;marker-end:url(#arrowhead-sdk)}
@media (prefers-color-scheme:dark){
text{fill:#cbd5e1}.header{fill:#f1f5f9}.card{fill:#0f172a;stroke:#1e293b}.grid{stroke:#334155}
.box-top{fill:#052e16;stroke:#4ade80}.box-mid{fill:#172554;stroke:#60a5fa}.box-bot{fill:#3b0764;stroke:#c084fc}
.arrow{stroke:#94a3b8}
}
</style>
<defs>
<marker id="arrowhead-sdk" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
<polygon points="0 0, 6 3, 0 6" fill="#64748b" />
</marker>
</defs>

<rect class="card" x="1" y="1" width="638" height="358" rx="12"/>
<text x="24" y="30" font-weight="700" font-size="15">Cosmos SDK Modular Architecture</text>
<text x="24" y="48" font-size="11" fill="#64748b">Application state machine layers from CometBFT consensus to Keepers and IAVL storage</text>

<!-- Consensus Layer -->
<rect class="box-top" x="24" y="66" width="592" height="52" rx="6"/>
<text x="36" y="88" class="header" fill="#16a34a">Consensus &amp; Networking Layer: CometBFT (formerly Tendermint Core)</text>
<text x="36" y="106" font-size="10" fill="#64748b">P2P Gossip Network, BFT Consensus, Immediate Block Finality (2/3+ stake voting)</text>

<!-- Arrow 1 to 2 -->
<line class="arrow" x1="320" y1="118" x2="320" y2="134"/>
<text x="328" y="128" font-size="9" fill="#64748b">ABCI 2.0 (PrepareProposal / ProcessProposal / VoteExtensions)</text>

<!-- BaseApp and Routing Layer -->
<rect class="box-mid" x="24" y="136" width="592" height="58" rx="6"/>
<text x="36" y="156" class="header" fill="#2563eb">Application Router: BaseApp &amp; AnteHandlers</text>
<text x="36" y="172" font-size="10" fill="#64748b">Decodes Protobuf msgs, checks signatures/gas via AnteHandler decorators, routes to MsgServer</text>
<text x="36" y="186" font-size="10" fill="#64748b">Manages execution context (sdk.Context, GasMeter, EventManager)</text>

<!-- Arrow 2 to 3 -->
<line class="arrow" x1="320" y1="194" x2="320" y2="210"/>
<text x="328" y="204" font-size="9" fill="#64748b">Keeper Object Capabilities</text>

<!-- Modules Layer -->
<rect class="box-bot" x="24" y="212" width="592" height="120" rx="6"/>
<text x="36" y="232" class="header" fill="#9333ea">Modular Application Logic: Core &amp; Custom Modules</text>

<!-- Module Pills -->
<rect x="36" y="244" width="95" height="30" rx="4" fill="#8b5cf6" fill-opacity="0.2"/>
<text x="44" y="263" font-weight="600" font-size="11">x/auth &amp; x/bank</text>

<rect x="141" y="244" width="95" height="30" rx="4" fill="#8b5cf6" fill-opacity="0.2"/>
<text x="149" y="263" font-weight="600" font-size="11">x/staking</text>

<rect x="246" y="244" width="85" height="30" rx="4" fill="#8b5cf6" fill-opacity="0.2"/>
<text x="254" y="263" font-weight="600" font-size="11">x/gov</text>

<rect x="341" y="244" width="85" height="30" rx="4" fill="#8b5cf6" fill-opacity="0.2"/>
<text x="349" y="263" font-weight="600" font-size="11">x/ibc</text>

<rect x="436" y="244" width="160" height="30" rx="4" fill="#8b5cf6" fill-opacity="0.3"/>
<text x="444" y="263" font-weight="700" font-size="11" fill="#7e22ce">Custom App Module</text>

<text x="36" y="295" font-weight="600" font-size="10" fill="#64748b">State Persistence:</text>
<text x="135" y="295" font-size="10" fill="#64748b">IAVL+ Merkle Trees, StoreKeys, multi-store state commits, fast snapshot syncing</text>
<text x="36" y="318" font-size="10" fill="#64748b">Source: Cosmos SDK Documentation, Interchain Foundation Technical Architecture</text>
</svg>