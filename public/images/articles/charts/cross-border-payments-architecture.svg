<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="p-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blue-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="teal-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="indigo-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <filter id="p-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1000" height="520" fill="url(#p-bg)"/>

  <text x="500" y="45" fill="#f8fafc" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="0.5">Web3 Cross-Border Payment &amp; Settlement Architecture</text>
  <text x="500" y="70" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="middle">Fiat On/Off Ramps, Stablecoin Liquidity Pools, Atomic FX Swaps, and Regulated Settlement</text>

  <!-- Component 1: Sender On-Ramp -->
  <g transform="translate(40, 110)" filter="url(#p-shadow)">
    <rect width="260" height="340" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="6" rx="3" fill="url(#blue-gradient)"/>
    <text x="20" y="40" fill="#60a5fa" font-size="14" font-weight="700">1. FIAT ON-RAMP &amp; KYC</text>

    <rect x="20" y="65" width="220" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="35" y="90" fill="#f1f5f9" font-size="13" font-weight="600">Local Bank Account (USD/EUR)</text>
    <text x="35" y="112" fill="#94a3b8" font-size="11">ACH / SEPA / FedNow Ingestion</text>

    <rect x="20" y="150" width="220" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="35" y="175" fill="#f1f5f9" font-size="13" font-weight="600">Automated Compliance Gate</text>
    <text x="35" y="197" fill="#94a3b8" font-size="11">KYC / KYB &amp; OFAC Sanction Check</text>

    <rect x="20" y="235" width="220" height="75" rx="8" fill="#0f172a" stroke="#2563eb" stroke-width="1"/>
    <text x="35" y="260" fill="#60a5fa" font-size="13" font-weight="600">Stablecoin Minting Vault</text>
    <text x="35" y="282" fill="#94a3b8" font-size="11">USDC / EURC 1:1 Reserve Mint</text>
  </g>

  <!-- Flow Line 1-2 -->
  <path d="M 300 280 L 360 280" stroke="#60a5fa" stroke-width="3" fill="none"/>

  <!-- Component 2: On-Chain Settlement Engine -->
  <g transform="translate(370, 110)" filter="url(#p-shadow)">
    <rect width="260" height="340" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="6" rx="3" fill="url(#teal-gradient)"/>
    <text x="20" y="40" fill="#2dd4bf" font-size="14" font-weight="700">2. ON-CHAIN FX SETTLEMENT</text>

    <rect x="20" y="65" width="220" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="35" y="90" fill="#f1f5f9" font-size="13" font-weight="600">Atomic FX Liquidity Pool</text>
    <text x="35" y="112" fill="#94a3b8" font-size="11">Uniswap V4 / Curve FX AMM</text>

    <rect x="20" y="150" width="220" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="35" y="175" fill="#f1f5f9" font-size="13" font-weight="600">Cross-Chain Bridge / Solver</text>
    <text x="35" y="197" fill="#94a3b8" font-size="11">Circle CCTP / LayerZero / Across</text>

    <rect x="20" y="235" width="220" height="75" rx="8" fill="#0f172a" stroke="#0d9488" stroke-width="1"/>
    <text x="35" y="260" fill="#2dd4bf" font-size="13" font-weight="600">Travel Rule Engine</text>
    <text x="35" y="282" fill="#94a3b8" font-size="11">Encrypted VASP Messaging (Notabene)</text>
  </g>

  <!-- Flow Line 2-3 -->
  <path d="M 630 280 L 690 280" stroke="#2dd4bf" stroke-width="3" fill="none"/>

  <!-- Component 3: Recipient Off-Ramp -->
  <g transform="translate(700, 110)" filter="url(#p-shadow)">
    <rect width="260" height="340" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="6" rx="3" fill="url(#indigo-gradient)"/>
    <text x="20" y="40" fill="#818cf8" font-size="14" font-weight="700">3. FIAT OFF-RAMP &amp; PAYOUT</text>

    <rect x="20" y="65" width="220" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="35" y="90" fill="#f1f5f9" font-size="13" font-weight="600">Foreign Exchange Settlement</text>
    <text x="35" y="112" fill="#94a3b8" font-size="11">EUR, BRL, INR, SGD Conversion</text>

    <rect x="20" y="150" width="220" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="35" y="175" fill="#f1f5f9" font-size="13" font-weight="600">Local Payout Rail Integration</text>
    <text x="35" y="197" fill="#94a3b8" font-size="11">PIX, UPI, SPEI, FPS Instant Payout</text>

    <rect x="20" y="235" width="220" height="75" rx="8" fill="#0f172a" stroke="#4f46e5" stroke-width="1"/>
    <text x="35" y="260" fill="#818cf8" font-size="13" font-weight="600">Final Recipient Credit</text>
    <text x="35" y="282" fill="#94a3b8" font-size="11">Instant Real-Time Settlement (&lt;10s)</text>
  </g>

  <!-- Footer Info -->
  <rect x="40" y="475" width="920" height="30" rx="6" fill="#1e293b"/>
  <text x="500" y="495" fill="#94a3b8" font-size="12" font-weight="500" text-anchor="middle">Hashtag Web3 Technical Guide — Cross-Border Payment Systems Architecture &amp; Engineering Careers</text>
</svg>
