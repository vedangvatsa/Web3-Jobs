    <text x="25" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Alchemy / Infura / QuickNode</text>
    <text x="25" y="125" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">$140K - $240K base</text>

    <rect x="15" y="160" width="190" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
