    <text x="25" y="205" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Testnet Tooling &amp; SDKs</text>
    <text x="25" y="225" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">$120K - $210K base</text>

    <rect x="15" y="260" width="190" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="285" fill="#c084fc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Protocol QA Lead</text>
    <text x="25" y="305" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Testnet Staging Suites</text>
    <text x="25" y="325" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">$130K - $220K base</text>

    <rect x="15" y="360" width="190" height="80" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="25" y="385" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Core Priority:</text>
    <text x="25" y="405" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Reliable testnet uptime</text>
    <text x="25" y="425" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• High-capacity RPC nodes</text>
  </g>

  <!-- Footer -->
  <text x="600" y="640" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="13">Hashtag Web3 Infrastructure Series • https://hashtagweb3.com</text>
</svg>
