    <text x="25" y="225" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Prevents nonce collision</text>

    <rect x="15" y="260" width="210" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="285" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="700">On-Chain Transfer</text>
    <text x="25" y="305" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Testnet native asset transfer</text>
    <text x="25" y="325" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Broadcasting block inclusion</text>

    <rect x="15" y="360" width="210" height="80" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="25" y="385" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Relayer System:</text>
    <text x="25" y="405" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Automated gas pricing</text>
    <text x="25" y="425" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• High throughput queues</text>
  </g>

  <!-- Arrow 2-3 -->
  <path d="M 580 360 L 620 360" stroke="#06b6d4" stroke-width="3" fill="none"/>
  <polygon points="620,360 610,354 610,366" fill="#06b6d4"/>

