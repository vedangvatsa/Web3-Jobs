<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg-grad)"/>

  <!-- Title -->
  <text x="600" y="55" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="700">Testnet Infrastructure &amp; Crypto Faucet Mechanics</text>
  <text x="600" y="85" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="15">From Early Mainnet Onboarding to Enterprise Sepolia/Holesky Developer Distribution</text>

  <!-- Flow Boxes -->

  <!-- Box 1: Developer Request & Proof of Work -->
  <g transform="translate(60, 130)" filter="url(#shadow)">
    <rect width="230" height="460" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="8" fill="#0284c7" rx="4"/>
    <text x="115" y="38" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">1. Developer Request</text>

    <rect x="15" y="60" width="200" height="75" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="85" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="700">Target Testnet</text>
    <text x="25" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Sepolia / Holesky / Base</text>
    <text x="25" y="122" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Valueless testnet gas funds</text>

    <rect x="15" y="150" width="200" height="75" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="175" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="700">Anti-Sybil Verification</text>
    <text x="25" y="195" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Gitcoin Passport / Web3 Auth</text>
    <text x="25" y="212" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Prevents bot farm draining</text>

    <rect x="15" y="240" width="200" height="75" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="265" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="700">Proof of Work (PoW)</text>
    <text x="25" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">In-browser hash computation</text>
    <text x="25" y="302" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">PKCS / Captcha rate limiting</text>

    <rect x="15" y="330" width="200" height="110" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="25" y="355" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Core Parameter:</text>
    <text x="25" y="375" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• 0.5 - 2.5 Sepolia ETH</text>
    <text x="25" y="395" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• 24-hour drip cooldown</text>
    <text x="25" y="415" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Verified EOA requirement</text>
  </g>

  <!-- Arrow 1-2 -->
  <path d="M 290 360 L 330 360" stroke="#0284c7" stroke-width="3" fill="none"/>
  <polygon points="330,360 320,354 320,366" fill="#0284c7"/>

