    <rect x="15" y="160" width="210" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="185" fill="#34d399" font-family="monospace" font-size="14" font-weight="700">Integration Testing</text>
    <text x="25" y="205" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Interact with Testnet Oracles</text>
    <text x="25" y="225" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Testnet Uniswap / Chainlink</text>

    <rect x="15" y="260" width="210" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="285" fill="#34d399" font-family="monospace" font-size="14" font-weight="700">Validator Staking Test</text>
    <text x="25" y="305" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Holesky Staking Deposit</text>
    <text x="25" y="325" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Simulate validator setup</text>

    <rect x="15" y="360" width="210" height="80" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="25" y="385" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Developer Impact:</text>
    <text x="25" y="405" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Mainnet-identical execution</text>
    <text x="25" y="425" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Verified deployment bytes</text>
  </g>

  <!-- Arrow 3-4 -->
  <path d="M 870 360 L 910 360" stroke="#10b981" stroke-width="3" fill="none"/>
  <polygon points="910,360 900,354 900,366" fill="#10b981"/>

