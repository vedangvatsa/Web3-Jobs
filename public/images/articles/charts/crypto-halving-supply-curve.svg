<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-halv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card-halv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="btc-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="url(#bg-halv)" rx="16"/>

  <!-- Title -->
  <text x="500" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#f8fafc" text-anchor="middle">Cryptocurrency Halving Mechanics &amp; Supply Emission Schedule</text>
  <text x="500" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">21 Million Hard Cap Limit • 210,000 Block Interval Emission Decay Curve</text>

  <!-- Main Chart Container -->
  <g filter="url(#shadow)">
    <rect x="60" y="110" width="880" height="440" rx="12" fill="url(#card-halv)" stroke="#f59e0b" stroke-width="1.5"/>

    <!-- Y-Axis (Block Reward & Total Supply) -->
    <line x1="140" y1="150" x2="140" y2="480" stroke="#64748b" stroke-width="2"/>
    <line x1="140" y1="480" x2="880" y2="480" stroke="#64748b" stroke-width="2"/>

    <!-- Gridlines -->
    <line x1="140" y1="216" x2="880" y2="216" stroke="#334155" stroke-dasharray="4"/>
    <line x1="140" y1="282" x2="880" y2="282" stroke="#334155" stroke-dasharray="4"/>
    <line x1="140" y1="348" x2="880" y2="348" stroke="#334155" stroke-dasharray="4"/>
    <line x1="140" y1="414" x2="880" y2="414" stroke="#334155" stroke-dasharray="4"/>

    <!-- Axis Labels -->
    <text x="120" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="end">50 BTC</text>
    <text x="120" y="286" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="end">25 BTC</text>
    <text x="120" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="end">12.5 BTC</text>
    <text x="120" y="418" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="end">6.25 BTC</text>

    <!-- Halving Epoch Dots & Step Chart -->
    <!-- Epoch 1 (2009-2012) -->
    <line x1="140" y1="216" x2="280" y2="216" stroke="#f59e0b" stroke-width="3"/>
    <line x1="280" y1="216" x2="280" y2="282" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4"/>
    <circle cx="280" cy="216" r="6" fill="#fbbf24"/>
    <text x="280" y="505" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">2012 (1st)</text>

    <!-- Epoch 2 (2012-2016) -->
    <line x1="280" y1="282" x2="430" y2="282" stroke="#f59e0b" stroke-width="3"/>
    <line x1="430" y1="282" x2="430" y2="348" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4"/>
    <circle cx="430" cy="282" r="6" fill="#fbbf24"/>
    <text x="430" y="505" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">2016 (2nd)</text>

    <!-- Epoch 3 (2016-2020) -->
    <line x1="430" y1="348" x2="580" y2="348" stroke="#f59e0b" stroke-width="3"/>
    <line x1="580" y1="348" x2="580" y2="414" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4"/>
    <circle cx="580" cy="348" r="6" fill="#fbbf24"/>
    <text x="580" y="505" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">2020 (3rd)</text>

    <!-- Epoch 4 (2020-2024) -->
    <line x1="580" y1="414" x2="730" y2="414" stroke="#f59e0b" stroke-width="3"/>
    <line x1="730" y1="414" x2="730" y2="447" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4"/>
    <circle cx="730" cy="414" r="6" fill="#fbbf24"/>
    <text x="730" y="505" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">2024 (4th: 3.125 BTC)</text>

    <!-- Epoch 5 (2024-2028+) -->
    <line x1="730" y1="447" x2="860" y2="447" stroke="#f59e0b" stroke-width="3"/>
    <text x="860" y="505" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">2028+ (5th: 1.5625 BTC)</text>

    <!-- Cumulative Supply Curve (Asymptotic) -->
    <path d="M 140 480 Q 300 220, 860 160" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6"/>
    <text x="700" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">Cumulative Supply (Max: 21,000,000 BTC)</text>
  </g>
</svg>
