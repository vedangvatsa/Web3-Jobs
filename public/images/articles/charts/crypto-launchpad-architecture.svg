<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="box-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#bg-grad)" rx="12"/>

  <!-- Title -->
  <text x="400" y="40" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Crypto Launchpad &amp; IDO Capital Formation Engine</text>
  <text x="400" y="65" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">Project Vetting, Tiered Staking Allocations, Vesting Escrow &amp; DEX Liquidity Injection</text>

  <!-- Step 1: Vetting & Application -->
  <g transform="translate(40, 110)" filter="url(#shadow)">
    <rect width="160" height="210" fill="url(#box-grad)" stroke="#38bdf8" stroke-width="2" rx="8"/>
    <rect width="160" height="34" fill="#0284c7" rx="8"/>
    <text x="80" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1. Project Vetting</text>

    <text x="12" y="60" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">• Smart Contract Audit</text>
    <text x="12" y="80" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">• Founder KYC / AML</text>
    <text x="12" y="100" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">• Tokenomics Review</text>

    <rect x="10" y="120" width="140" height="75" fill="#0f172a" rx="4" stroke="#334155"/>
    <text x="80" y="145" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">FDV Valuation</text>
    <text x="80" y="170" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Target: $500K-$2M</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 200 215 L 230 215" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,4"/>
  <polygon points="235,215 225,210 225,220" fill="#38bdf8"/>

  <!-- Step 2: Staking & Allocation -->
  <g transform="translate(240, 110)" filter="url(#shadow)">
    <rect width="160" height="210" fill="url(#box-grad)" stroke="#818cf8" stroke-width="2" rx="8"/>
    <rect width="160" height="34" fill="#4f46e5" rx="8"/>
    <text x="80" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2. Tiered Staking</text>

    <text x="12" y="60" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">• Lock Launchpad Token</text>
    <text x="12" y="80" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">• Tier 1: Lottery Weight</text>
    <text x="12" y="100" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">• Tier 4: Guaranteed</text>

    <rect x="10" y="120" width="140" height="75" fill="#0f172a" rx="4" stroke="#334155"/>
    <text x="80" y="145" fill="#818cf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Whitelist Registry</text>
    <text x="80" y="170" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">EIP-712 Signature</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 400 215 L 430 215" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="6,4"/>
  <polygon points="435,215 425,210 425,220" fill="#818cf8"/>

  <!-- Step 3: Sales & Vesting -->
  <g transform="translate(440, 110)" filter="url(#shadow)">
    <rect width="160" height="210" fill="url(#box-grad)" stroke="#10b981" stroke-width="2" rx="8"/>
    <rect width="160" height="34" fill="#059669" rx="8"/>
    <text x="80" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3. IDO &amp; Vesting</text>

    <text x="12" y="60" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">• Deposit USDC Escrow</text>
    <text x="12" y="80" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">• TGE Unlock (15-20%)</text>
    <text x="12" y="100" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">• Linear Vesting Vault</text>

    <rect x="10" y="120" width="140" height="75" fill="#0f172a" rx="4" stroke="#334155"/>
    <text x="80" y="145" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Vesting Contract</text>
    <text x="80" y="170" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Linear Release</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 600 215 L 630 215" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6,4"/>
  <polygon points="635,215 625,210 625,220" fill="#10b981"/>

  <!-- Step 4: DEX Listing -->
  <g transform="translate(640, 110)" filter="url(#shadow)">
    <rect width="120" height="210" fill="url(#box-grad)" stroke="#f59e0b" stroke-width="2" rx="8"/>
    <rect width="120" height="34" fill="#d97706" rx="8"/>
    <text x="60" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">4. TGE Listing</text>

    <text x="8" y="60" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="600">• Seed DEX Pool</text>
    <text x="8" y="80" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="600">• Lock LP Tokens</text>
    <text x="8" y="100" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="600">• Open Trading</text>

    <rect x="6" y="120" width="108" height="75" fill="#0f172a" rx="4" stroke="#334155"/>
    <text x="60" y="145" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Uniswap Pool</text>
    <text x="60" y="165" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Public Trading</text>
  </g>

  <!-- Bottom Banner -->
  <rect x="40" y="350" width="720" height="32" fill="#1e293b" rx="6" stroke="#334155"/>
  <text x="400" y="371" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Crypto launchpads vet early-stage projects, coordinate tiered staking sales, enforce smart contract vesting, and seed liquidity pools.</text>
</svg>
