<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="crd-title crd-desc">
<title id="crd-title">Web3 Cryptographic R and D Career Progression Pipeline</title>
<desc id="crd-desc">Career trajectory for cryptographic research and development in Web3, from academic foundation to senior protocol cryptographer, including compensation tiers and milestone deliverables.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:11px;fill:#334155}
.header{font-weight:700;fill:#1e293b;font-size:12px}
.card{fill:#ffffff;stroke:#e2e8f0}
.step1{fill:#f8fafc;stroke:#64748b;stroke-width:1.5}
.step2{fill:#eff6ff;stroke:#2563eb;stroke-width:1.5}
.step3{fill:#f0fdf4;stroke:#16a34a;stroke-width:1.5}
.arrow{stroke:#64748b;stroke-width:1.5;fill:none;marker-end:url(#arrowhead-crd)}
@media (prefers-color-scheme:dark){
text{fill:#cbd5e1}.header{fill:#f1f5f9}.card{fill:#0f172a;stroke:#1e293b}
.step1{fill:#1e293b;stroke:#475569}.step2{fill:#172554;stroke:#60a5fa}.step3{fill:#064e3b;stroke:#34d399}
.arrow{stroke:#94a3b8}
}
</style>
<defs>
<marker id="arrowhead-crd" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
<polygon points="0 0, 6 3, 0 6" fill="#64748b" />
</marker>
</defs>

<rect class="card" x="1" y="1" width="638" height="358" rx="12"/>
<text x="24" y="30" font-weight="700" font-size="15">Web3 Cryptographic R&amp;D: Career Progression &amp; Compensation</text>
<text x="24" y="48" font-size="11" fill="#64748b">Growth stages from junior circuit engineer to principal cryptographer across research labs and protocols</text>

<!-- Level 1 -->
<rect class="step1" x="24" y="70" width="180" height="235" rx="8"/>
<text x="36" y="94" class="header">Level 1: ZK Circuit Engineer</text>
<text x="36" y="112" font-size="10" font-weight="600" fill="#2563eb">$140,000 - $190,000 + Equity</text>

<text x="36" y="136" font-weight="600">Core Scope:</text>
<text x="36" y="150" font-size="10" fill="#64748b">Implementing arithmetic circuits</text>
<text x="36" y="164" font-size="10" fill="#64748b">Circom, Halo2, or Gnark</text>
<text x="36" y="186" font-weight="600">Key Deliverables:</text>
<text x="36" y="200" font-size="10" fill="#64748b">Poseidon / MiMC hashing</text>
<text x="36" y="214" font-size="10" fill="#64748b">Merkle inclusion proofs</text>
<text x="36" y="236" font-weight="600">Focus Areas:</text>
<text x="36" y="250" font-size="10" fill="#64748b">Underconstrained bug checks</text>
<text x="36" y="264" font-size="10" fill="#64748b">Constraint minimization</text>

<!-- Arrow 1 to 2 -->
<path class="arrow" d="M204 185 L224 185"/>

<!-- Level 2 -->
<rect class="step2" x="226" y="70" width="186" height="235" rx="8"/>
<text x="238" y="94" class="header" fill="#2563eb">Level 2: Applied Cryptographer</text>
<text x="238" y="112" font-size="10" font-weight="600" fill="#2563eb">$200,000 - $300,000 + Token Granularity</text>

<text x="238" y="136" font-weight="600">Core Scope:</text>
<text x="238" y="150" font-size="10" fill="#64748b">Prover algorithm architecture</text>
<text x="238" y="164" font-size="10" fill="#64748b">Polynomial commitments (KZG/FRI)</text>
<text x="238" y="186" font-weight="600">Key Deliverables:</text>
<text x="238" y="200" font-size="10" fill="#64748b">Recursive aggregation circuits</text>
<text x="238" y="214" font-size="10" fill="#64748b">Custom gates &amp; lookup tables</text>
<text x="238" y="236" font-weight="600">Focus Areas:</text>
<text x="238" y="250" font-size="10" fill="#64748b">Proof composition &amp; folding</text>
<text x="238" y="264" font-size="10" fill="#64748b">Hardware acceleration (FPGA/GPU)</text>

<!-- Arrow 2 to 3 -->
<path class="arrow" d="M412 185 L432 185"/>

<!-- Level 3 -->
<rect class="step3" x="434" y="70" width="182" height="235" rx="8"/>
<text x="446" y="94" class="header" fill="#16a34a">Level 3: Research Fellow / Lead</text>
<text x="446" y="112" font-size="10" font-weight="600" fill="#16a34a">$320,000 - $550,000+ &amp; Protocol Stake</text>

<text x="446" y="136" font-weight="600">Core Scope:</text>
<text x="446" y="150" font-size="10" fill="#64748b">Novel primitive publication</text>
<text x="446" y="164" font-size="10" fill="#64748b">Security proof verification (UC)</text>
<text x="446" y="186" font-weight="600">Key Deliverables:</text>
<text x="446" y="200" font-size="10" fill="#64748b">Peer-reviewed crypto papers</text>
<text x="446" y="214" font-size="10" fill="#64748b">Post-quantum lattice schemes</text>
<text x="446" y="236" font-weight="600">Target Labs:</text>
<text x="446" y="250" font-size="10" fill="#64748b">Paradigm, a16z crypto, ZKProof</text>
<text x="446" y="264" font-size="10" fill="#64748b">Flashbots, Matter Labs, Succinct</text>
</svg>