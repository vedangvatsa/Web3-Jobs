<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="df-title df-desc">
<title id="df-title">The DAO Contributor Acquisition and Retention Funnel</title>
<desc id="df-desc">Four-stage funnel showing volume and conversion from community lurker to bounty hunter, working group contributor, and core multisig steward.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px;fill:#334155}
.num{font-variant-numeric:tabular-nums;font-weight:600}
.f1{fill:#3b82f6}.f2{fill:#0ea5e9}.f3{fill:#10b981}.f4{fill:#8b5cf6}.card{fill:#ffffff;stroke:#e2e8f0}
@media (prefers-color-scheme:dark){text{fill:#cbd5e1}.card{fill:#0f172a;stroke:#1e293b}}
</style>
<rect class="card" x="1" y="1" width="638" height="328" rx="12"/>
<text x="24" y="32" font-weight="700" font-size="15">The DAO Contributor Funnel: Conversion and Retention</text>
<text x="24" y="52" font-size="12" fill="#64748b">Benchmark contributor progression from Discord entrant to core protocol steward</text>

<!-- Funnel Stage 1 -->
<polygon points="40,80 600,80 520,130 120,130" class="f1" fill-opacity="0.85"/>
<text x="320" y="102" fill="#ffffff" font-weight="700" text-anchor="middle">Community Lurkers (100% · ~10,000 members)</text>
<text x="320" y="118" fill="#ffffff" font-size="11" text-anchor="middle">Discord / Telegram joiners reading announcements</text>

<!-- Funnel Stage 2 -->
<polygon points="122,135 518,135 448,185 192,185" class="f2" fill-opacity="0.85"/>
<text x="320" y="157" fill="#ffffff" font-weight="700" text-anchor="middle">Bounty Hunters &amp; Quests (8.4% · ~840 contributors)</text>
<text x="320" y="173" fill="#ffffff" font-size="11" text-anchor="middle">First completed Gitcoin / Dework task or forum proposal</text>

<!-- Funnel Stage 3 -->
<polygon points="194,190 446,190 386,240 254,240" class="f3" fill-opacity="0.85"/>
<text x="320" y="212" fill="#ffffff" font-weight="700" text-anchor="middle">Working Group Leads (1.6% · ~160 contributors)</text>
<text x="320" y="228" fill="#ffffff" font-size="11" text-anchor="middle">Active subDAO, Coordinape circle, or grant recipient</text>

<!-- Funnel Stage 4 -->
<polygon points="256,245 384,245 344,285 296,285" class="f4" fill-opacity="0.9"/>
<text x="320" y="267" fill="#ffffff" font-weight="700" text-anchor="middle">Core Stewards (0.3% · 30)</text>
<text x="320" y="280" fill="#ffffff" font-size="10" text-anchor="middle">Multisig signers &amp; full-time</text>

<text x="24" y="314" font-size="11" fill="#64748b">Coordinape, Gitcoin, and Safe benchmark data: Less than 0.5% of community entrants transition to full-time protocol governance.</text>
</svg>