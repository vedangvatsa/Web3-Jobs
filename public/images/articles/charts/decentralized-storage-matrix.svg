<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="sm-title sm-desc">
<title id="sm-title">Decentralized Storage Protocols Comparative Taxonomy</title>
<desc id="sm-desc">Comparison matrix of Filecoin, Arweave, IPFS, and Storj across consensus model, persistence duration, economic incentives, and primary use cases.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:11px;fill:#334155}
.header{font-weight:700;fill:#1e293b;font-size:12px}
.card{fill:#ffffff;stroke:#e2e8f0}
.box-fc{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.5}
.box-ar{fill:#fff7ed;stroke:#f97316;stroke-width:1.5}
.box-ip{fill:#f0fdf4;stroke:#10b981;stroke-width:1.5}
.box-st{fill:#faf5ff;stroke:#8b5cf6;stroke-width:1.5}
@media (prefers-color-scheme:dark){
text{fill:#cbd5e1}.header{fill:#f1f5f9}.card{fill:#0f172a;stroke:#1e293b}
.box-fc{fill:#172554;stroke:#60a5fa}.box-ar{fill:#431407;stroke:#fb923c}.box-ip{fill:#064e3b;stroke:#34d399}.box-st{fill:#3b0764;stroke:#c084fc}
}
</style>

<rect class="card" x="1" y="1" width="638" height="358" rx="12"/>
<text x="24" y="30" font-weight="700" font-size="15">Decentralized Storage Protocols: Comparative Architecture</text>
<text x="24" y="48" font-size="11" fill="#64748b">Key trade-offs across persistence models, incentive mechanisms, and cryptographic proofs</text>

<!-- Filecoin -->
<rect class="box-fc" x="24" y="68" width="138" height="260" rx="8"/>
<text x="34" y="90" class="header" fill="#2563eb">Filecoin</text>
<text x="34" y="106" font-size="10" font-weight="600" fill="#2563eb">Contract-Based Storage</text>

<text x="34" y="130" font-weight="600">Model:</text>
<text x="34" y="144" font-size="10" fill="#64748b">Time-bound leasing deals</text>

<text x="34" y="166" font-weight="600">Consensus / Proof:</text>
<text x="34" y="180" font-size="10" fill="#64748b">PoRep + PoSt (SNARKs)</text>

<text x="34" y="202" font-weight="600">Cost Structure:</text>
<text x="34" y="216" font-size="10" fill="#64748b">Recurring deal payments</text>

<text x="34" y="238" font-weight="600">Primary Fit:</text>
<text x="34" y="252" font-size="10" fill="#64748b">Massive datasets, AI data,</text>
<text x="34" y="266" font-size="10" fill="#64748b">scientific archives, web3 dApps</text>

<!-- Arweave -->
<rect class="box-ar" x="174" y="68" width="138" height="260" rx="8"/>
<text x="184" y="90" class="header" fill="#ea580c">Arweave</text>
<text x="184" y="106" font-size="10" font-weight="600" fill="#ea580c">Permanent Permaweb</text>

<text x="184" y="130" font-weight="600">Model:</text>
<text x="184" y="144" font-size="10" fill="#64748b">Pay once, store 200+ yrs</text>

<text x="184" y="166" font-weight="600">Consensus / Proof:</text>
<text x="184" y="180" font-size="10" fill="#64748b">SPoRA (Proof of Access)</text>

<text x="184" y="202" font-weight="600">Cost Structure:</text>
<text x="184" y="216" font-size="10" fill="#64748b">One-time upfront fee endowment</text>

<text x="184" y="238" font-weight="600">Primary Fit:</text>
<text x="184" y="252" font-size="10" fill="#64748b">NFT metadata, web frontends,</text>
<text x="184" y="266" font-size="10" fill="#64748b">immutable legal/news records</text>

<!-- IPFS -->
<rect class="box-ip" x="324" y="68" width="138" height="260" rx="8"/>
<text x="334" y="90" class="header" fill="#059669">IPFS</text>
<text x="334" y="106" font-size="10" font-weight="600" fill="#059669">Content Addressing Network</text>

<text x="334" y="130" font-weight="600">Model:</text>
<text x="334" y="144" font-size="10" fill="#64748b">P2P Content Routing (CID)</text>

<text x="334" y="166" font-weight="600">Consensus / Proof:</text>
<text x="334" y="180" font-size="10" fill="#64748b">None (Kademlia DHT, Bitswap)</text>

<text x="334" y="202" font-weight="600">Cost Structure:</text>
<text x="334" y="216" font-size="10" fill="#64748b">Free local / Paid pinning (Pinata)</text>

<text x="334" y="238" font-weight="600">Primary Fit:</text>
<text x="334" y="252" font-size="10" fill="#64748b">P2P content transport, CIDs,</text>
<text x="334" y="266" font-size="10" fill="#64748b">ephemeral distributed sharing</text>

<!-- Storj -->
<rect class="box-st" x="474" y="68" width="142" height="260" rx="8"/>
<text x="484" y="90" class="header" fill="#7c3aed">Storj / Sia</text>
<text x="484" y="106" font-size="10" font-weight="600" fill="#7c3aed">Decentralized S3 Hot Store</text>

<text x="484" y="130" font-weight="600">Model:</text>
<text x="484" y="144" font-size="10" fill="#64748b">Erasure-coded object storage</text>

<text x="484" y="166" font-weight="600">Consensus / Proof:</text>
<text x="484" y="180" font-size="10" fill="#64748b">Reed-Solomon Audits</text>

<text x="484" y="202" font-weight="600">Cost Structure:</text>
<text x="484" y="216" font-size="10" fill="#64748b">Usage-based (per GB/month)</text>

<text x="484" y="238" font-weight="600">Primary Fit:</text>
<text x="484" y="252" font-size="10" fill="#64748b">Enterprise S3 replacement,</text>
<text x="484" y="266" font-size="10" fill="#64748b">video streaming, cloud backups</text>
</svg>