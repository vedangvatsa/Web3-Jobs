<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="sm-title sm-desc">
<title id="sm-title">Decentralized Storage Protocols Comparative Taxonomy</title>
<desc id="sm-desc">Comparison matrix of Filecoin, Arweave, IPFS, and Storj across consensus model, persistence duration, economic incentives, and primary use cases.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:11px;fill:#334155}
.header{font-weight:700;fill:#1e293b;font-size:12px}
.card{fill:#ffffff;stroke:#e2e8f0}
.box-fc{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.5}
.box-ar{fill:#fff7ed;stroke:#f97316;stroke-width:1.5}
.box-ip{fill:#f0fdf4;stroke:#10b981;stroke-width:1.5}
.box-st{fill:#faf5ff;stroke:#8b5cf6;stroke-width:1.5}
.muted{fill:#64748b;font-size:10px}
@media (prefers-color-scheme:dark){
text{fill:#cbd5e1}.header{fill:#f1f5f9}.card{fill:#0f172a;stroke:#1e293b}.muted{fill:#94a3b8}
.box-fc{fill:#172554;stroke:#60a5fa}.box-ar{fill:#431407;stroke:#fb923c}.box-ip{fill:#064e3b;stroke:#34d399}.box-st{fill:#3b0764;stroke:#c084fc}
}
</style>

<rect class="card" x="1" y="1" width="638" height="378" rx="12"/>
<text x="24" y="26" font-weight="700" font-size="14">Decentralized Storage Protocols:</text>
<text x="24" y="44" font-weight="700" font-size="14">Comparative Architecture</text>
<text x="24" y="62" class="muted">Key trade-offs across persistence, incentives, and proofs</text>

<!-- Filecoin: x=20 w=145 -->
<rect class="box-fc" x="20" y="78" width="145" height="278" rx="8"/>
<text x="30" y="100" class="header" fill="#2563eb">Filecoin</text>
<text x="30" y="116" font-size="10" font-weight="600" fill="#2563eb">Contract-Based Storage</text>
<text x="30" y="140" font-weight="600">Model:</text>
<text x="30" y="154" class="muted">Time-bound leasing deals</text>
<text x="30" y="178" font-weight="600">Consensus / Proof:</text>
<text x="30" y="192" class="muted">PoRep + PoSt (SNARKs)</text>
<text x="30" y="216" font-weight="600">Cost Structure:</text>
<text x="30" y="230" class="muted">Recurring deal payments</text>
<text x="30" y="254" font-weight="600">Primary Fit:</text>
<text x="30" y="268" class="muted">Massive datasets, AI,</text>
<text x="30" y="282" class="muted">scientific archives,</text>
<text x="30" y="296" class="muted">web3 dApps</text>

<!-- Arweave: x=175 -->
<rect class="box-ar" x="175" y="78" width="145" height="278" rx="8"/>
<text x="185" y="100" class="header" fill="#ea580c">Arweave</text>
<text x="185" y="116" font-size="10" font-weight="600" fill="#ea580c">Permanent Permaweb</text>
<text x="185" y="140" font-weight="600">Model:</text>
<text x="185" y="154" class="muted">Pay once, store 200+ yrs</text>
<text x="185" y="178" font-weight="600">Consensus / Proof:</text>
<text x="185" y="192" class="muted">SPoRA (Proof of Access)</text>
<text x="185" y="216" font-weight="600">Cost Structure:</text>
<text x="185" y="230" class="muted">One-time upfront fee</text>
<text x="185" y="244" class="muted">endowment</text>
<text x="185" y="268" font-weight="600">Primary Fit:</text>
<text x="185" y="282" class="muted">NFT metadata, frontends,</text>
<text x="185" y="296" class="muted">immutable legal/news</text>
<text x="185" y="310" class="muted">records</text>

<!-- IPFS: x=330 -->
<rect class="box-ip" x="330" y="78" width="145" height="278" rx="8"/>
<text x="340" y="100" class="header" fill="#059669">IPFS</text>
<text x="340" y="116" font-size="10" font-weight="600" fill="#059669">Content Addressing</text>
<text x="340" y="130" font-size="10" font-weight="600" fill="#059669">Network</text>
<text x="340" y="154" font-weight="600">Model:</text>
<text x="340" y="168" class="muted">P2P content routing</text>
<text x="340" y="182" class="muted">(CID)</text>
<text x="340" y="206" font-weight="600">Consensus / Proof:</text>
<text x="340" y="220" class="muted">None (Kademlia DHT,</text>
<text x="340" y="234" class="muted">Bitswap)</text>
<text x="340" y="258" font-weight="600">Cost Structure:</text>
<text x="340" y="272" class="muted">Free local / paid</text>
<text x="340" y="286" class="muted">pinning (Pinata)</text>
<text x="340" y="310" font-weight="600">Primary Fit:</text>
<text x="340" y="324" class="muted">P2P transport, CIDs,</text>
<text x="340" y="338" class="muted">ephemeral sharing</text>

<!-- Storj: x=485 -->
<rect class="box-st" x="485" y="78" width="145" height="278" rx="8"/>
<text x="495" y="100" class="header" fill="#7c3aed">Storj / Sia</text>
<text x="495" y="116" font-size="10" font-weight="600" fill="#7c3aed">Decentralized S3</text>
<text x="495" y="130" font-size="10" font-weight="600" fill="#7c3aed">Hot Store</text>
<text x="495" y="154" font-weight="600">Model:</text>
<text x="495" y="168" class="muted">Erasure-coded object</text>
<text x="495" y="182" class="muted">storage</text>
<text x="495" y="206" font-weight="600">Consensus / Proof:</text>
<text x="495" y="220" class="muted">Reed-Solomon audits</text>
<text x="495" y="244" font-weight="600">Cost Structure:</text>
<text x="495" y="258" class="muted">Usage-based</text>
<text x="495" y="272" class="muted">(per GB/month)</text>
<text x="495" y="296" font-weight="600">Primary Fit:</text>
<text x="495" y="310" class="muted">Enterprise S3 replace,</text>
<text x="495" y="324" class="muted">video streaming, cloud</text>
<text x="495" y="338" class="muted">backups</text>
</svg>
