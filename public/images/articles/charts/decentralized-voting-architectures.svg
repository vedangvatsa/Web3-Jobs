<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 408" role="img" aria-labelledby="vote-title vote-desc">
<title id="vote-title">Decentralized Voting Architectures and Anti-Collusion Paradigms</title>
<desc id="vote-desc">Taxonomy of blockchain voting systems: Token-weighted plutocracy, Quadratic Voting, gasless off-chain signaling, and MACI ZK-SNARK anti-collusion.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:12px;fill:#334155}
.header{font-weight:700;fill:#1e293b;font-size:12px}
.card{fill:#ffffff;stroke:#e2e8f0}.grid{stroke:#e2e8f0}
.box-v1{fill:#f8fafc;stroke:#64748b;stroke-width:1.5}
.box-v2{fill:#eff6ff;stroke:#2563eb;stroke-width:1.5}
.box-v3{fill:#f5f3ff;stroke:#7c3aed;stroke-width:1.5}
.box-v4{fill:#f0fdf4;stroke:#16a34a;stroke-width:1.5}
@media (prefers-color-scheme:dark){
text{fill:#cbd5e1}.header{fill:#f1f5f9}.card{fill:#0f172a;stroke:#1e293b}.grid{stroke:#334155}
.box-v1{fill:#1e293b;stroke:#475569}.box-v2{fill:#172554;stroke:#60a5fa}
.box-v3{fill:#2e1065;stroke:#a855f7}.box-v4{fill:#052e16;stroke:#4ade80}
}
</style>

<rect class="card" x="1" y="1" width="638" height="406" rx="12"/>
<text x="24" y="30" font-weight="700" font-size="15">Decentralized Voting Architectures &amp; Anti-Collusion Paradigms</text>
<text x="24" y="48" font-size="11" fill="#64748b">Comparing plutocratic on-chain execution, quadratic preference aggregation, and zero-knowledge privacy</text>

<!-- 4 Quadrants -->
<rect class="box-v1" x="24" y="66" width="288" height="140" rx="8"/>
<text x="36" y="88" class="header" fill="#475569">1. Token-Weighted Voting (1 Token = 1 Vote)</text>
<text x="36" y="106" font-size="9">Implementations: GovernorBravo,<tspan x="36" dy="11">OpenZeppelin Governor</tspan></text>
<text x="36" y="132" font-size="9" fill="#64748b">Execution: Direct on-chain binding<tspan x="36" dy="11">with TimelockController</tspan></text>
<text x="36" y="158" font-size="9" fill="#64748b">Strength: Capital alignment,<tspan x="36" dy="11">unforgeable sybil defense</tspan></text>
<text x="36" y="184" font-size="9" fill="#dc2626">Weakness: Plutocracy; whale wallets<tspan x="36" dy="11">dictate all outcomes</tspan></text>

<rect class="box-v2" x="328" y="66" width="288" height="140" rx="8"/>
<text x="340" y="88" class="header" fill="#2563eb">2. Quadratic Voting (Cost = Votes^2)</text>
<text x="340" y="106" font-size="9">Implementations: Gitcoin Grants,<tspan x="340" dy="11">RadicalxChange</tspan></text>
<text x="340" y="132" font-size="9" fill="#64748b">Formula: 1 vote = 1 credit,<tspan x="340" dy="11">2 votes = 4, 10 votes = 100</tspan></text>
<text x="340" y="158" font-size="9" fill="#64748b">Strength: Amplifies broad consensus<tspan x="340" dy="11">over concentrated wealth</tspan></text>
<text x="340" y="184" font-size="9" fill="#dc2626">Vulnerability: Extremely vulnerable<tspan x="340" dy="11">to Sybil identity splitting</tspan></text>

<rect class="box-v3" x="24" y="218" width="288" height="140" rx="8"/>
<text x="36" y="240" class="header" fill="#7c3aed">3. Gasless Off-Chain Signaling (Snapshot)</text>
<text x="36" y="258" font-size="9">Implementations: Snapshot.org,<tspan x="36" dy="11">SafeSnap (Zodiac)</tspan></text>
<text x="36" y="284" font-size="9" fill="#64748b">Mechanism: EIP-712 cryptographic<tspan x="36" dy="11">signatures stored on IPFS</tspan></text>
<text x="36" y="310" font-size="9" fill="#64748b">Strength: Zero gas fees encourages<tspan x="36" dy="11">massive voter turnout</tspan></text>
<text x="36" y="336" font-size="9" fill="#64748b">Execution: Non-binding advice,<tspan x="36" dy="11">or optimistic oracle relay</tspan></text>

<rect class="box-v4" x="328" y="218" width="288" height="140" rx="8"/>
<text x="340" y="240" class="header" fill="#16a34a">4. Anti-Collusion ZK Infrastructure (MACI)</text>
<text x="340" y="258" font-size="9">Implementations: Minimum<tspan x="340" dy="11">Anti-Collusion Infrastructure</tspan></text>
<text x="340" y="284" font-size="9" fill="#64748b">Mechanism: Key changes encrypted<tspan x="340" dy="11">via ZK-SNARK circuits</tspan></text>
<text x="340" y="310" font-size="9" fill="#64748b">Strength: Voters cannot prove how<tspan x="340" dy="11">they voted to bribery cartels</tspan></text>
<text x="340" y="336" font-size="9" fill="#16a34a">Eliminates on-chain vote buying<tspan x="340" dy="11">&amp; extortion markets</tspan></text>

<line class="grid" x1="20" y1="370" x2="620" y2="370"/>
<text x="28" y="384" style="font-size:8px" fill="#64748b">Source: Vitalik Buterin Quadratic Voting Research, MACI Ethereum Foundation Specs,<tspan x="28" dy="11">OpenZeppelin Governor Architecture</tspan></text>
</svg>