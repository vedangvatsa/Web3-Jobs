<text x="330" y="184" font-size="10" fill="#64748b">TokenUnlocks, CoinGecko</text>
<rect class="badge2" x="490" y="162" width="75" height="12" rx="3"/>
<text x="495" y="172" font-size="10" fill="#ffffff" font-weight="700">Real Yield</text>

<!-- Row 3 -->
<rect class="row-bg" x="20" y="198" width="600" height="50" rx="4"/>
<text x="28" y="220" font-weight="600">Capital Quality</text>
