<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="dp-title dp-desc">
<title id="dp-title">DePIN Token-Incentivized Physical Infrastructure Flywheel</title>
<desc id="dp-desc">Economic flywheel diagram illustrating how Decentralized Physical Infrastructure Networks (DePIN) bootstrap hardware rollout, generate real-world demand, and burn tokens.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:11px;fill:#334155}
.header{font-weight:700;fill:#1e293b;font-size:12px}
.card{fill:#ffffff;stroke:#e2e8f0}
.box-hw{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.5}
.box-tok{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}
.box-dem{fill:#f0fdf4;stroke:#16a34a;stroke-width:1.5}
.box-burn{fill:#faf5ff;stroke:#8b5cf6;stroke-width:1.5}
.arrow{stroke:#64748b;stroke-width:1.5;fill:none;marker-end:url(#arrowhead-dp)}
@media (prefers-color-scheme:dark){
text{fill:#cbd5e1}.header{fill:#f1f5f9}.card{fill:#0f172a;stroke:#1e293b}
.box-hw{fill:#172554;stroke:#60a5fa}.box-tok{fill:#451a03;stroke:#f59e0b}.box-dem{fill:#064e3b;stroke:#34d399}.box-burn{fill:#3b0764;stroke:#c084fc}
.arrow{stroke:#94a3b8}
}
</style>
<defs>
<marker id="arrowhead-dp" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
<polygon points="0 0, 6 3, 0 6" fill="#64748b" />
</marker>
</defs>

<rect class="card" x="1" y="1" width="638" height="358" rx="12"/>
<text x="24" y="30" font-weight="700" font-size="15">DePIN: Physical Infrastructure Token Flywheel</text>
<text x="24" y="48" font-size="11" fill="#64748b">Bootstrapping capital-intensive physical assets via token incentives and burn-and-mint equilibrium</text>

<!-- Quadrant 1: Supply Rollout -->
<rect class="box-hw" x="24" y="68" width="286" height="125" rx="8"/>
<text x="36" y="90" class="header" fill="#2563eb">1. Supply-Side Hardware Deployment</text>
<text x="36" y="110" font-weight="600">Decentralized Capital Expenditure:</text>
<text x="36" y="124" font-size="10" fill="#64748b">Individuals purchase &amp; install physical hardware</text>
<text x="36" y="146" font-weight="600">Hardware Categories:</text>
<text x="36" y="160" font-size="10" fill="#64748b">Helium LoRaWAN/5G, Hivemapper dashcams, Render GPUs</text>

<!-- Quadrant 2: Token Incentives -->
<rect class="box-tok" x="330" y="68" width="286" height="125" rx="8"/>
<text x="342" y="90" class="header" fill="#d97706">2. Cryptographic Proof of Physical Work</text>
<text x="342" y="110" font-weight="600">Proof Verification:</text>
<text x="342" y="124" font-size="10" fill="#64748b">Proof of Coverage (PoC), Proof of Render, GPS attestation</text>
<text x="342" y="146" font-weight="600">Incentive Emission:</text>
<text x="342" y="160" font-size="10" fill="#64748b">Nodes earn tokens, subsidizing initial CapEx outlay</text>

<!-- Quadrant 3: Demand Side -->
<rect class="box-dem" x="24" y="202" width="286" height="125" rx="8"/>
<text x="36" y="224" class="header" fill="#16a34a">3. Real-World Service Delivery</text>
<text x="36" y="244" font-weight="600">Enterprise Customers:</text>
<text x="36" y="258" font-size="10" fill="#64748b">Telematics companies, AI startups, IoT tracking fleets</text>
<text x="36" y="280" font-weight="600">Competitive Cost Edge:</text>
<text x="36" y="294" font-size="10" fill="#64748b">50-90% cheaper than centralized legacy monopolies</text>

<!-- Quadrant 4: Burn and Mint Equilibrium -->
<rect class="box-burn" x="330" y="202" width="286" height="125" rx="8"/>
<text x="342" y="224" class="header" fill="#7c3aed">4. Token Burn &amp; Value Accrual</text>
<text x="342" y="244" font-weight="600">Burn-and-Mint Equilibrium (BME):</text>
<text x="342" y="258" font-size="10" fill="#64748b">Enterprise pays in fiat/stablecoin, burns native tokens</text>
<text x="342" y="280" font-weight="600">Deflationary Feedback:</text>
<text x="342" y="294" font-size="10" fill="#64748b">Token burn contracts supply, incentivizing new hardware</text>
</svg>