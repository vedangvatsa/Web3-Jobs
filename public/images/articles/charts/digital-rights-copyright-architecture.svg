  <rect width="1200" height="675" fill="url(#bg-grad)"/>

  <!-- Title -->
  <text x="600" y="55" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="700">Decentralized Intellectual Property &amp; DRM Architecture</text>
  <text x="600" y="85" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="15">From On-Chain IP Hashing to Programmable Licensing &amp; Automated Micro-Royalties</text>

  <!-- Flow Boxes -->

  <!-- Box 1: Creator & IP Registration -->
  <g transform="translate(60, 130)" filter="url(#shadow)">
    <rect width="230" height="460" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="8" fill="#8b5cf6" rx="4"/>
    <text x="115" y="38" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">1. On-Chain IP Registration</text>

    <rect x="15" y="60" width="200" height="75" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="85" fill="#c084fc" font-family="monospace" font-size="14" font-weight="700">Content Hashing</text>
    <text x="25" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">SHA-256 / IPFS CID</text>
    <text x="25" y="122" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Immutable timestamp proof</text>

    <rect x="15" y="150" width="200" height="75" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="175" fill="#c084fc" font-family="monospace" font-size="14" font-weight="700">ERC-721 / ERC-1155</text>
    <text x="25" y="195" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Programmable IP NFT</text>
    <text x="25" y="212" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Binds metadata &amp; URI</text>

    <rect x="15" y="240" width="200" height="75" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="265" fill="#c084fc" font-family="monospace" font-size="14" font-weight="700">Story Protocol / EIP-6551</text>
    <text x="25" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Token Bound Account</text>
    <text x="25" y="302" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">IP holds sub-licenses</text>

    <rect x="15" y="330" width="200" height="110" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="25" y="355" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Key Mechanism:</text>
    <text x="25" y="375" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Decentralized provenance</text>
    <text x="25" y="395" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Zero centralized DRM gate</text>
    <text x="25" y="415" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Global priority claim</text>
  </g>

  <!-- Arrow 1-2 -->
  <path d="M 290 360 L 330 360" stroke="#a855f7" stroke-width="3" fill="none"/>
  <polygon points="330,360 320,354 320,366" fill="#a855f7"/>

