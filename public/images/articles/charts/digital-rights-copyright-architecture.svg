    <rect width="220" height="460" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="8" fill="#10b981" rx="4"/>
    <text x="110" y="38" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">4. Industry Careers</text>

    <rect x="15" y="60" width="190" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="85" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Web3 IP Counsel</text>
    <text x="25" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Smart Legal Contracts</text>
    <text x="25" y="125" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">$160K - $320K base</text>

    <rect x="15" y="160" width="190" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="185" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="700">DRM Protocol Dev</text>
    <text x="25" y="205" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Lit / Story Protocol</text>
    <text x="25" y="225" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">$140K - $250K base</text>

    <rect x="15" y="260" width="190" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="285" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Media Tokenomics</text>
    <text x="25" y="305" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Royalty Distribution</text>
    <text x="25" y="325" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">$130K - $220K base</text>

    <rect x="15" y="360" width="190" height="80" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="25" y="385" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Sector Growth:</text>
    <text x="25" y="405" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Music &amp; Publishing IP</text>
    <text x="25" y="425" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• AI Training Data Rights</text>
  </g>

  <!-- Footer -->
  <text x="600" y="640" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="13">Hashtag Web3 Career &amp; Technical Series • https://hashtagweb3.com</text>
</svg>
