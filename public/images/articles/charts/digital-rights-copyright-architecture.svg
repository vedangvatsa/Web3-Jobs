    <text x="25" y="85" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="700">Lit Protocol / Threshold</text>
    <text x="25" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Decentralized Access Control</text>
    <text x="25" y="125" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Encrypts content at rest</text>

    <rect x="15" y="160" width="210" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="185" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="700">Token-Gated Decryption</text>
    <text x="25" y="205" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Verifies NFT ownership</text>
    <text x="25" y="225" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Releases symmetric keys</text>

    <rect x="15" y="260" width="210" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="285" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="700">zk-Watermarking</text>
    <text x="25" y="305" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Zero-Knowledge Proofs</text>
    <text x="25" y="325" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Proves leak origin</text>

    <rect x="15" y="360" width="210" height="80" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="25" y="385" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">User Experience:</text>
    <text x="25" y="405" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Seamless media streaming</text>
    <text x="25" y="425" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Open standards verification</text>
  </g>

  <!-- Arrow 3-4 -->
  <path d="M 870 360 L 910 360" stroke="#a855f7" stroke-width="3" fill="none"/>
  <polygon points="910,360 900,354 900,366" fill="#a855f7"/>

