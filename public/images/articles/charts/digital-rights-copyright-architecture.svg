    <text x="25" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Standardized Royalty Info</text>
    <text x="25" y="125" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Enforces % on secondary sales</text>

    <rect x="15" y="160" width="210" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="185" fill="#f472b6" font-family="monospace" font-size="14" font-weight="700">Commercial Sub-Licensing</text>
    <text x="25" y="205" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Remix &amp; Derivative Rules</text>
    <text x="25" y="225" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Automated revenue split</text>

    <rect x="15" y="260" width="210" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="285" fill="#f472b6" font-family="monospace" font-size="14" font-weight="700">Time-Bound Access</text>
    <text x="25" y="305" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Rental &amp; Streaming Modules</text>
    <text x="25" y="325" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Expiration via block timestamp</text>

    <rect x="15" y="360" width="210" height="80" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="25" y="385" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Key Advantage:</text>
    <text x="25" y="405" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Automated fee collection</text>
    <text x="25" y="425" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Frictionless B2B licensing</text>
  </g>

  <!-- Arrow 2-3 -->
  <path d="M 580 360 L 620 360" stroke="#a855f7" stroke-width="3" fill="none"/>
  <polygon points="620,360 610,354 610,366" fill="#a855f7"/>

