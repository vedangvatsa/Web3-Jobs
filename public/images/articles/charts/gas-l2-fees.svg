<text x="20" y="106">Base</text><rect class="bar" x="220" y="92" width="270" height="18" rx="4"/><text class="num" x="498" y="106">$0.03</text>
<text x="20" y="140">Arbitrum</text><rect class="bar" x="220" y="126" width="90" height="18" rx="4"/><text class="num" x="318" y="140">$0.01</text>
<text x="20" y="174">zkSync Era</text><rect class="bar" x="220" y="160" width="90" height="18" rx="4"/><text class="num" x="318" y="174">$0.01</text>
<g class="grid"><line x1="220" y1="42" x2="220" y2="188"/><line x1="310" y1="42" x2="310" y2="188"/><line x1="400" y1="42" x2="400" y2="188"/><line x1="490" y1="42" x2="490" y2="188"/><line x1="580" y1="42" x2="580" y2="188"/></g>
<text x="220" y="206">0</text><text x="305" y="206">1¢</text><text x="395" y="206">2¢</text><text x="485" y="206">3¢</text><text x="575" y="206">4¢</text>
<text x="20" y="230" font-size="12">Before Dencun each sat near or above $1.00: Optimism ~$1.40, Base ~$1.50 (down 97-98%).</text>
