<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" role="img" aria-labelledby="t5 d5">
<title id="t5">Median L2 transaction fees after Dencun, US dollars</title>
<desc id="d5">Bars: Optimism 4 cents, Base 3 cents, Arbitrum 1 cent, zkSync 1 cent. Before Dencun each was near or above one dollar.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px;fill:#334155}
.num{font-variant-numeric:tabular-nums;font-weight:600}
.bar{fill:#0ea5e9}.card{fill:#ffffff;stroke:#e2e8f0}.grid{stroke:#eef2f7}
@media (prefers-color-scheme:dark){text{fill:#cbd5e1}.bar{fill:#38bdf8}.grid{stroke:#1e293b}.card{fill:#0f172a;stroke:#1e293b}}
</style>
<rect class="card" x="1" y="1" width="638" height="268" rx="12"/>
<text x="20" y="32" font-weight="700" font-size="15">Median L2 fee after Dencun (USD per transaction)</text>
