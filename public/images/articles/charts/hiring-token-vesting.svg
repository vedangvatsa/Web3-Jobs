<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="tv-title tv-desc">
<title id="tv-title">Standard Web3 Token Vesting Mechanics: 4-Year Schedule with 1-Year Cliff</title>
<desc id="tv-desc">Timeline of Web3 token release: Year 1 cliff unlocks 25 percent at month 12, followed by 36 months of linear distribution to reach 100 percent at month 48.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px;fill:#334155}
.num{font-variant-numeric:tabular-nums;font-weight:600}
.v-bar{fill:#2563eb}.c-bar{fill:#f59e0b}.u-bar{fill:#10b981}.card{fill:#ffffff;stroke:#e2e8f0}.grid{stroke:#e2e8f0;stroke-dasharray:4 4}
@media (prefers-color-scheme:dark){text{fill:#cbd5e1}.card{fill:#0f172a;stroke:#1e293b}.grid{stroke:#334155}}
</style>
<rect class="card" x="1" y="1" width="638" height="278" rx="12"/>
<text x="24" y="34" font-weight="700" font-size="15">Web3 Token Vesting Schedule (Standard 4-Year / 1-Year Cliff)</text>
<text x="24" y="54" font-size="12" fill="#64748b">Cumulative token release by tenure milestone (Pantera &amp; Toku compensation data)</text>

<line class="grid" x1="120" y1="80" x2="600" y2="80"/>
<line class="grid" x1="120" y1="120" x2="600" y2="120"/>
<line class="grid" x1="120" y1="160" x2="600" y2="160"/>
<line class="grid" x1="120" y1="200" x2="600" y2="200"/>

<text x="24" y="100" font-weight="600">Months 0-11</text>
<text x="24" y="114" font-size="11" fill="#64748b">Pre-cliff</text>
<rect class="c-bar" x="120" y="90" width="12" height="22" rx="4"/>
<text class="num" x="140" y="106">0% (100% locked)</text>

<text x="24" y="140" font-weight="600">Month 12</text>
<text x="24" y="154" font-size="11" fill="#64748b">Cliff trigger</text>
<rect class="v-bar" x="120" y="130" width="120" height="22" rx="4"/>
<text class="num" x="248" y="146">25% (cliff unlock)</text>

<text x="24" y="180" font-weight="600">Month 24</text>
<text x="24" y="194" font-size="11" fill="#64748b">Year two</text>
<rect class="v-bar" x="120" y="170" width="240" height="22" rx="4"/>
<text class="num" x="368" y="186">50% cumulative</text>

<text x="24" y="220" font-weight="600">Month 48</text>
<text x="24" y="234" font-size="11" fill="#64748b">Full tenure</text>
<rect class="u-bar" x="120" y="210" width="480" height="22" rx="4"/>
<text class="num" x="530" y="226" fill="#ffffff">100%</text>

<text x="24" y="260" font-size="11" fill="#64748b">88% of Web3 teams benchmark on this structure. Toku &amp; Pantera Compensation Index.</text>
</svg>