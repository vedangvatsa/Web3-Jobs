<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" role="img" aria-labelledby="t2 d2">
<title id="t2">Where Immunefi bounty money goes</title>
<desc id="d2">Donut chart: 87.8 percent of payouts go to critical findings; 77.5 percent goes to smart contracts.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px;fill:#334155}
.big{font-size:24px;font-weight:700}.card{fill:#ffffff;stroke:#e2e8f0}
.segA{stroke:#6366f1}.segC{stroke:#312e81}.track{stroke:#e2e8f0}
@media (prefers-color-scheme:dark){text{fill:#cbd5e1}.segA{stroke:#818cf8}.segC{stroke:#a5b4fc}.track{stroke:#1e293b}.card{fill:#0f172a;stroke:#1e293b}}
</style>
<rect class="card" x="1" y="1" width="638" height="288" rx="12"/>
<text x="20" y="32" font-weight="700" font-size="15">Where bug-bounty money goes (Immunefi, share of $ paid)</text>
<g transform="translate(140,132)" fill="none" stroke-width="30">
<circle class="track" r="58"/>
<circle class="segA" r="58" stroke-dasharray="320 45" transform="rotate(-90)"/>
</g>
<text class="big" x="140" y="141" text-anchor="middle">87.8%</text>
<text x="140" y="228" text-anchor="middle">critical findings</text>
<g transform="translate(480,132)" fill="none" stroke-width="30">
<circle class="track" r="58"/>
<circle class="segC" r="58" stroke-dasharray="282 83" transform="rotate(-90)"/>
</g>
<text class="big" x="480" y="141" text-anchor="middle">77.5%</text>
<text x="480" y="228" text-anchor="middle">smart contracts</text>
<text x="20" y="262" font-size="12">Median payout is near $2k against a $52.8k mean: severity pays, volume does not.</text>
</svg>
