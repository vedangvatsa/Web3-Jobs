<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" role="img" aria-labelledby="l3h-title l3h-desc">
<title id="l3h-title">Layer 3 Recursive Rollup and Appchain Hierarchy</title>
<desc id="l3h-desc">Three-tier architectural hierarchy illustrating Layer 1 base settlement, Layer 2 proof aggregation hubs, and Layer 3 hyper-specialized appchains.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:12px;fill:#334155}
.header{font-weight:700;fill:#1e293b;font-size:13px}
.card{fill:#ffffff;stroke:#e2e8f0}.grid{stroke:#e2e8f0}
.box-l3{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:1.5}
.box-l2{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.5}
.box-l1{fill:#ecfdf5;stroke:#10b981;stroke-width:1.5}
.arrow{stroke:#64748b;stroke-width:1.5;fill:none;marker-end:url(#arrowhead)}
@media (prefers-color-scheme:dark){
text{fill:#cbd5e1}.header{fill:#f1f5f9}.card{fill:#0f172a;stroke:#1e293b}.grid{stroke:#334155}
.box-l3{fill:#2e1065;stroke:#a855f7}.box-l2{fill:#172554;stroke:#60a5fa}.box-l1{fill:#064e3b;stroke:#34d399}
.arrow{stroke:#94a3b8}
}
</style>
<defs>
<marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
<polygon points="0 0, 6 3, 0 6" fill="#64748b" />
</marker>
</defs>

<rect class="card" x="1" y="1" width="638" height="348" rx="12"/>
<text x="24" y="30" font-weight="700" font-size="15">Layer 3 Recursive Rollup and Appchain Architecture</text>
<text x="24" y="48" font-size="11" fill="#64748b">Nested scaling model: Recursive proofs, app-specific execution, and multi-tier settlement</text>

<!-- Layer 3 Tier -->
<rect class="box-l3" x="24" y="66" width="592" height="75" rx="8"/>
<text x="40" y="88" class="header" fill="#7c3aed">Layer 3: Application-Specific Chains (App-Rollups)</text>
<text x="40" y="106" font-size="11">Arbitrum Orbit, zkSync Hyperchains, Starknet Appchains, OP Stack L3s</text>
<text x="40" y="124" font-size="10" fill="#64748b">Features: Custom gas tokens, sub-cent fees, private state channels, dedicated sequencer throughput</text>

<!-- Proof Aggregation Arrow -->
<line class="arrow" x1="320" y1="142" x2="320" y2="160"/>
<text x="330" y="154" font-size="10" fill="#64748b">Recursive Proofs / State Roots</text>

<!-- Layer 2 Tier -->
<rect class="box-l2" x="24" y="162" width="592" height="75" rx="8"/>
<text x="40" y="184" class="header" fill="#2563eb">Layer 2: General-Purpose Settlement &amp; Liquidity Hubs</text>
<text x="40" y="202" font-size="11">Arbitrum One, OP Mainnet, Base, Scroll, Linea, zkSync Era</text>
<text x="40" y="220" font-size="10" fill="#64748b">Role: Aggregates multiple L3 proofs into a single batch, manages shared liquidity &amp; fast inter-L3 bridging</text>

<!-- Final Settlement Arrow -->
<line class="arrow" x1="320" y1="238" x2="320" y2="256"/>
<text x="330" y="250" font-size="10" fill="#64748b">EIP-4844 Blobs &amp; Validity Proof Verification</text>

<!-- Layer 1 Tier -->
<rect class="box-l1" x="24" y="258" width="592" height="72" rx="8"/>
<text x="40" y="280" class="header" fill="#059669">Layer 1: Global Consensus &amp; Immutable Settlement</text>
<text x="40" y="298" font-size="11">Ethereum Mainnet (Consensus Layer + Execution State)</text>
<text x="40" y="316" font-size="10" fill="#64748b">Guarantees: Final dispute resolution, censorship resistance, decentralized validator economic security ($100B+ stake)</text>
</svg>