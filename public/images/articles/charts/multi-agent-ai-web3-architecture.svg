    <text x="25" y="285" fill="#c084fc" font-family="monospace" font-size="14" font-weight="700">Swarm Intelligence</text>
    <text x="25" y="305" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">LangGraph / CrewAI</text>
