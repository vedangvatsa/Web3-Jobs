    <text x="115" y="38" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">1. Perception &amp; Reasoning</text>

    <rect x="15" y="60" width="200" height="75" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="85" fill="#60a5fa" font-family="monospace" font-size="14" font-weight="700">Specialized LLMs</text>
    <text x="25" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Domain-specific SLMs</text>
    <text x="25" y="122" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Trading, code, analytics</text>

    <rect x="15" y="150" width="200" height="75" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="175" fill="#60a5fa" font-family="monospace" font-size="14" font-weight="700">ReAct / Planning</text>
    <text x="25" y="195" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Reasoning &amp; Action Loops</text>
    <text x="25" y="212" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Break complex goals down</text>

    <rect x="15" y="240" width="200" height="75" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="265" fill="#60a5fa" font-family="monospace" font-size="14" font-weight="700">Vector Memory (RAG)</text>
    <text x="25" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Chroma / Pinecone / Qdrant</text>
    <text x="25" y="302" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Long-term context store</text>

    <rect x="15" y="330" width="200" height="110" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="25" y="355" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Core Output:</text>
    <text x="25" y="375" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Structured execution plan</text>
    <text x="25" y="395" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Tool selection criteria</text>
    <text x="25" y="415" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Dynamic sub-task delegation</text>
