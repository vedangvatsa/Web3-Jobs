  <rect width="1200" height="675" fill="url(#bg-grad)"/>

  <!-- Title -->
  <text x="600" y="55" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="700">Autonomous Multi-Agent AI &amp; Web3 Infrastructure</text>
  <text x="600" y="85" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="15">Specialized Agents, On-Chain Economic Incentive Networks &amp; Verifiable Execution</text>

  <!-- Flow Boxes -->

