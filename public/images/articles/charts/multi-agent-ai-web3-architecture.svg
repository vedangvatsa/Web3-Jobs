    <text x="25" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">LangGraph / uAgents</text>
    <text x="25" y="125" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">$150K - $280K base</text>

    <rect x="15" y="160" width="190" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="185" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">zkML / opML Engineer</text>
    <text x="25" y="205" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Verifiable AI Circuits</text>
    <text x="25" y="225" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">$170K - $320K base</text>

    <rect x="15" y="260" width="190" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="285" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">DeFi Agent Quant</text>
    <text x="25" y="305" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Automated Yield &amp; MEV</text>
    <text x="25" y="325" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">$160K - $350K+ total</text>

    <rect x="15" y="360" width="190" height="80" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="25" y="385" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">High Growth:</text>
    <text x="25" y="405" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Decentralized AI Swarms</text>
    <text x="25" y="425" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Autonomous DAO Assets</text>
  </g>

  <!-- Footer -->
  <text x="600" y="640" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="13">Hashtag Web3 AI &amp; Engineering Series • https://hashtagweb3.com</text>
</svg>
