<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="url(#bg)" rx="16"/>

  <!-- Title -->
  <text x="500" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#f8fafc" text-anchor="middle">Blockchain Network State &amp; State Transition Architecture</text>
  <text x="500" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">State $S_t \xrightarrow{T_t} S_{t+1}$ Transition Matrix &amp; Merkle Patricia Patricia Trie Root</text>

  <!-- Left: State St -->
  <g filter="url(#shadow)">
    <rect x="50" y="110" width="260" height="440" rx="12" fill="url(#card)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="180" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#60a5fa" text-anchor="middle">State S_t (Block N)</text>
    <line x1="70" y1="160" x2="290" y2="160" stroke="#3b82f6" stroke-opacity="0.4"/>
    
    <!-- Account 1 -->
    <rect x="70" y="180" width="220" height="75" rx="8" fill="#0f172a" stroke="#475569"/>
    <text x="80" y="202" font-family="monospace" font-size="12" fill="#38bdf8">EOA: 0x71C...a49</text>
    <text x="80" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">Balance: 12.5 ETH</text>
    <text x="80" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">Nonce: 42</text>

    <!-- Account 2 -->
    <rect x="70" y="270" width="220" height="95" rx="8" fill="#0f172a" stroke="#475569"/>
    <text x="80" y="292" font-family="monospace" font-size="12" fill="#a78bfa">Contract: 0x3f1...e90</text>
    <text x="80" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">CodeHash: 0x9a8...f12</text>
    <text x="80" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">StorageRoot: 0x5b3...a11</text>
    <text x="80" y="348" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">Balance: 450.0 ETH</text>

    <!-- State Root -->
    <rect x="70" y="380" width="220" height="60" rx="8" fill="url(#primary)"/>
    <text x="180" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">State Root Hash (St)</text>
    <text x="180" y="425" font-family="monospace" font-size="11" fill="#e0f2fe" text-anchor="middle">0x8a92f...c310</text>
  </g>

  <!-- Middle: EVM Transaction Execution -->
  <g filter="url(#shadow)">
    <rect x="350" y="150" width="300" height="360" rx="12" fill="url(#card)" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="500" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#c084fc" text-anchor="middle">EVM State Transition (T_t)</text>
    <line x1="370" y1="200" x2="630" y2="200" stroke="#8b5cf6" stroke-opacity="0.4"/>

    <text x="370" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">1. Ingest Signed Transactions</text>
    <rect x="370" y="240" width="260" height="40" rx="6" fill="#0f172a" stroke="#64748b"/>
    <text x="380" y="265" font-family="monospace" font-size="11" fill="#cbd5e1">Tx: 0x71C -> 0x3f1 (2.0 ETH)</text>

    <text x="370" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">2. Execute Opcode State Changes</text>
    <rect x="370" y="315" width="260" height="50" rx="6" fill="#0f172a" stroke="#64748b"/>
    <text x="380" y="335" font-family="monospace" font-size="11" fill="#34d399">SSTORE slot[0] = 0x01</text>
    <text x="380" y="352" font-family="monospace" font-size="11" fill="#f472b6">CALLVALUE transfer (2 ETH)</text>

    <text x="370" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">3. Re-Calculate Merkle Trie Root</text>
    <rect x="370" y="400" width="260" height="45" rx="6" fill="#0f172a" stroke="#64748b"/>
    <text x="380" y="427" font-family="monospace" font-size="11" fill="#fbbf24">Keccak256(Modified Nodes)</text>
  </g>

  <!-- Right: State St+1 -->
  <g filter="url(#shadow)">
    <rect x="690" y="110" width="260" height="440" rx="12" fill="url(#card)" stroke="#10b981" stroke-width="1.5"/>
    <text x="820" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#34d399" text-anchor="middle">State S_t+1 (Block N+1)</text>
    <line x1="710" y1="160" x2="930" y2="160" stroke="#10b981" stroke-opacity="0.4"/>

    <!-- Updated Account 1 -->
    <rect x="710" y="180" width="220" height="75" rx="8" fill="#0f172a" stroke="#10b981"/>
    <text x="720" y="202" font-family="monospace" font-size="12" fill="#38bdf8">EOA: 0x71C...a49</text>
    <text x="720" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#34d399">Balance: 10.499 ETH</text>
    <text x="720" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#34d399">Nonce: 43</text>

    <!-- Updated Account 2 -->
    <rect x="710" y="270" width="220" height="95" rx="8" fill="#0f172a" stroke="#10b981"/>
    <text x="720" y="292" font-family="monospace" font-size="12" fill="#a78bfa">Contract: 0x3f1...e90</text>
    <text x="720" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">CodeHash: 0x9a8...f12</text>
    <text x="720" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#34d399">StorageRoot: 0x7c4...b99</text>
    <text x="720" y="348" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#34d399">Balance: 452.0 ETH</text>

    <!-- New State Root -->
    <rect x="710" y="380" width="220" height="60" rx="8" fill="#10b981"/>
    <text x="820" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">New State Root (St+1)</text>
    <text x="820" y="425" font-family="monospace" font-size="11" fill="#ecfdf5" text-anchor="middle">0x4b71d...e988</text>
  </g>

  <!-- Connectors -->
  <path d="M 310 330 L 350 330" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 650 330 L 690 330" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
