<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="dp-title dp-desc">
<title id="dp-title">Push vs Pull Oracle Architecture and Data Integration Pipelines</title>
<desc id="dp-desc">Comparative analysis of Push Oracles like Chainlink Data Feeds versus Pull Oracles like Pyth Network and RedStone, highlighting latency and gas trade-offs.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:11px;fill:#334155}
.header{font-weight:700;fill:#1e293b;font-size:12px}
.card{fill:#ffffff;stroke:#e2e8f0}
.box-push{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.5}
.box-pull{fill:#faf5ff;stroke:#8b5cf6;stroke-width:1.5}
@media (prefers-color-scheme:dark){
text{fill:#cbd5e1}.header{fill:#f1f5f9}.card{fill:#0f172a;stroke:#1e293b}
.box-push{fill:#172554;stroke:#60a5fa}.box-pull{fill:#3b0764;stroke:#c084fc}
}
</style>

<rect class="card" x="1" y="1" width="638" height="358" rx="12"/>
<text x="24" y="30" font-weight="700" font-size="15">Oracle Data Pipelines: Push vs Pull Architecture</text>
<text x="24" y="48" font-size="11" fill="#64748b">Trade-offs between periodic on-chain writing and on-demand user-driven payload verification</text>

<!-- Push Model Box -->
<rect class="box-push" x="24" y="70" width="286" height="255" rx="8"/>
<text x="36" y="94" class="header" fill="#2563eb">Push Model (Periodic Heartbeat)</text>
<text x="36" y="110" font-size="10" fill="#2563eb">Example: Chainlink Canonical Reference Feeds</text>

<text x="36" y="136" font-weight="600">Update Trigger Mechanism:</text>
<text x="36" y="150" font-size="10" fill="#64748b">Deviation threshold (e.g., 0.5% price shift)</text>
<text x="36" y="164" font-size="10" fill="#64748b">or periodic heartbeat (e.g., every 1 hour)</text>

<text x="36" y="190" font-weight="600">On-Chain State Availability:</text>
<text x="36" y="204" font-size="10" fill="#64748b">State is always pre-loaded in contract storage</text>
<text x="36" y="218" font-size="10" fill="#64748b">Consumers execute a simple view call: O(1)</text>

<text x="36" y="244" font-weight="600">Economic &amp; Latency Profile:</text>
<text x="36" y="258" font-size="10" fill="#64748b">High gas overhead borne by oracle sponsor</text>
<text x="36" y="272" font-size="10" fill="#64748b">Update latency: seconds to minutes</text>
<text x="36" y="286" font-size="10" fill="#64748b">Ideal for money markets (Aave, Compound)</text>

<!-- Pull Model Box -->
<rect class="box-pull" x="330" y="70" width="286" height="255" rx="8"/>
<text x="342" y="94" class="header" fill="#7c3aed">Pull Model (On-Demand Settlement)</text>
<text x="342" y="110" font-size="10" fill="#7c3aed">Example: Pyth Network, RedStone, Chainlink Data Streams</text>

<text x="342" y="136" font-weight="600">Update Trigger Mechanism:</text>
<text x="342" y="150" font-size="10" fill="#64748b">User transaction embeds latest signed price</text>
<text x="342" y="164" font-size="10" fill="#64748b">Price fetched from high-frequency off-chain cache</text>

<text x="342" y="190" font-weight="600">On-Chain State Availability:</text>
<text x="342" y="204" font-size="10" fill="#64748b">Contract verifies cryptographic signature inside tx</text>
<text x="342" y="218" font-size="10" fill="#64748b">Updates state atomically before business logic executes</text>

<text x="342" y="244" font-weight="600">Economic &amp; Latency Profile:</text>
<text x="342" y="258" font-size="10" fill="#64748b">Zero standing gas fee on chain when idle</text>
<text x="342" y="272" font-size="10" fill="#64748b">Sub-second update latency (300-400 ms)</text>
<text x="342" y="286" font-size="10" fill="#64748b">Ideal for perp DEXs (GMX, Synthetix, Hyperliquid)</text>
</svg>