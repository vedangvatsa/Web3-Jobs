<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 416" role="img" aria-labelledby="pe-title pe-desc">
<title id="pe-title">Web3 Privacy Engineer Competency Matrix</title>
<desc id="pe-desc">Core architectural pillars and required technical competencies for Web3 privacy engineers across cryptography, systems, compilers, and compliance.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:11px;fill:#334155}
.header{font-weight:700;fill:#1e293b;font-size:12px}
.card{fill:#ffffff;stroke:#e2e8f0}
.quad1{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.5}
.quad2{fill:#f0fdf4;stroke:#10b981;stroke-width:1.5}
.quad3{fill:#faf5ff;stroke:#8b5cf6;stroke-width:1.5}
.quad4{fill:#fff7ed;stroke:#f97316;stroke-width:1.5}
@media (prefers-color-scheme:dark){
text{fill:#cbd5e1}.header{fill:#f1f5f9}.card{fill:#0f172a;stroke:#1e293b}
.quad1{fill:#172554;stroke:#60a5fa}.quad2{fill:#064e3b;stroke:#34d399}.quad3{fill:#3b0764;stroke:#c084fc}.quad4{fill:#431407;stroke:#fb923c}
}
</style>

<rect class="card" x="1" y="1" width="638" height="414" rx="12"/>
<text x="24" y="30" font-weight="700" font-size="15">Web3 Privacy Engineer: Core Technical Competency Matrix</text>
<text x="24" y="48" font-size="11" fill="#64748b">Cross-disciplinary skill requirements spanning cryptography, peer-to-peer networking, DSL compilers, and regulatory rails</text>

<!-- Quadrant 1: Applied Cryptography -->
<rect class="quad1" x="24" y="66" width="286" height="162" rx="8"/>
<text x="36" y="88" class="header" fill="#2563eb">1. Cryptographic Primitives</text>
<text x="36" y="106" font-weight="600">Zero-Knowledge Proofs:</text>
<text x="36" y="120" font-size="10" fill="#64748b">Groth16, PLONK, Halo2, STARKs</text>
<text x="36" y="138" font-weight="600">Multiparty Computation:</text>
<text x="36" y="152" font-size="10" fill="#64748b">Threshold ECDSA, Shamir SSS, BGW</text>
<text x="36" y="170" font-weight="600">Confidential Rails:</text>
<text x="36" y="184" font-size="10" fill="#64748b">Stealth addresses (ERC-5564), RingCT</text>
<text x="36" y="202" font-weight="600">Trusted Enclaves:</text>
<text x="36" y="216" font-size="10" fill="#64748b">Intel SGX, AWS Nitro Enclaves</text>

<!-- Quadrant 2: Circuit Compilers & Toolchains -->
<rect class="quad2" x="330" y="66" width="286" height="162" rx="8"/>
<text x="342" y="88" class="header" fill="#059669">2. Circuit Engineering &amp; zkVMs</text>
<text x="342" y="106" font-weight="600">Domain DSLs:</text>
<text x="342" y="120" font-size="10" fill="#64748b">Circom, Noir, Gnark, Cairo</text>
<text x="342" y="138" font-weight="600">zkVM Frameworks:</text>
<text x="342" y="152" font-size="10" fill="#64748b">RISC Zero, SP1, Jolt, Valida</text>
<text x="342" y="170" font-weight="600">Arithmetization:</text>
<text x="342" y="184" font-size="10" fill="#64748b">R1CS, Plonkish tables, AIR constraints</text>
<text x="342" y="202" font-weight="600">Hardware Accel:</text>
<text x="342" y="216" font-size="10" fill="#64748b">MSM / NTT CUDA kernels on GPUs</text>

<!-- Quadrant 3: P2P & Transport Privacy -->
<rect class="quad3" x="24" y="238" width="286" height="162" rx="8"/>
<text x="36" y="260" class="header" fill="#7c3aed">3. P2P &amp; Transport Privacy</text>
<text x="36" y="278" font-weight="600">Anonymity Mixnets:</text>
<text x="36" y="292" font-size="10" fill="#64748b">Nym Network, Loopix, Sphinx packets</text>
<text x="36" y="310" font-weight="600">P2P Obfuscation:</text>
<text x="36" y="324" font-size="10" fill="#64748b">Dandelion++, libp2p Tor transport</text>
<text x="36" y="342" font-weight="600">RPC Privacy:</text>
<text x="36" y="356" font-size="10" fill="#64748b">Private mempools (MEV-Share, SUAVE)</text>
<text x="36" y="374" font-weight="600">Metadata Defense:</text>
<text x="36" y="388" font-size="10" fill="#64748b">Timing analysis &amp; traffic padding</text>

<!-- Quadrant 4: Compliance & Selective Disclosure -->
<rect class="quad4" x="330" y="238" width="286" height="162" rx="8"/>
<text x="342" y="260" class="header" fill="#c2410c">4. Programmable Compliance</text>
<text x="342" y="278" font-weight="600">Selective Disclosure:</text>
<text x="342" y="292" font-size="10" fill="#64748b">zk-KYC, W3C Verifiable Credentials</text>
<text x="342" y="310" font-weight="600">Proof of Innocence:</text>
<text x="342" y="324" font-size="10" fill="#64748b">Privacy Pools, Merkle tree exclusions</text>
<text x="342" y="342" font-weight="600">Auditing Keys:</text>
<text x="342" y="356" font-size="10" fill="#64748b">Viewing keys &amp; cryptographic escrows</text>
<text x="342" y="374" font-weight="600">Regulatory Frameworks:</text>
<text x="342" y="388" font-size="10" fill="#64748b">FATF Travel Rule, FinCEN unhosted rule</text>
</svg>