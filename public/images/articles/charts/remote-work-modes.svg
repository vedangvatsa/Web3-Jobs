<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" role="img" aria-labelledby="t7 d7">
<title id="t7">Where knowledge work happens, percent of workers</title>
<desc id="d7">Bars: hybrid 52 percent, fully remote 27 percent, mostly on-site 21 percent.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px;fill:#334155}
.num{font-variant-numeric:tabular-nums;font-weight:600}
.a{fill:#6366f1}.b{fill:#22c55e}.c{fill:#94a3b8}.card{fill:#ffffff;stroke:#e2e8f0}.grid{stroke:#eef2f7}
@media (prefers-color-scheme:dark){text{fill:#cbd5e1}.card{fill:#0f172a;stroke:#1e293b}.grid{stroke:#1e293b}.c{fill:#64748b}}
</style>
<rect class="card" x="1" y="1" width="638" height="234" rx="12"/>
<text x="20" y="32" font-weight="700" font-size="15">Where knowledge work happens (% of workers)</text>
<text x="20" y="76">Hybrid</text><rect class="a" x="220" y="62" width="332" height="18" rx="4"/><text class="num" x="560" y="76">52%</text>
<text x="20" y="114">Fully remote</text><rect class="b" x="220" y="100" width="173" height="18" rx="4"/><text class="num" x="401" y="114">27%</text>
<text x="20" y="152">Mostly on-site</text><rect class="c" x="220" y="138" width="134" height="18" rx="4"/><text class="num" x="362" y="152">21%</text>
<g class="grid"><line x1="220" y1="42" x2="220" y2="166"/><line x1="300" y1="42" x2="300" y2="166"/><line x1="380" y1="42" x2="380" y2="166"/><line x1="460" y1="42" x2="460" y2="166"/><line x1="540" y1="42" x2="540" y2="166"/></g>
<text x="220" y="184">0</text><text x="292" y="184">15</text><text x="372" y="184">30</text><text x="452" y="184">45</text><text x="532" y="184">60%</text>
<text x="20" y="208" font-size="12">Web3 teams sit at the far remote end of this distribution; RTO mandates</text>
<text x="20" y="224" font-size="12">elsewhere stretched vacancies 23% and cut hire rates 17%.</text>
</svg>
