<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="snf-title snf-desc">
<title id="snf-title">Web3 Compensation and Salary Negotiation Framework</title>
<desc id="snf-desc">Evaluation framework for negotiating base currency, token grants, equity options, and vesting terms in Web3 offers.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:12px;fill:#334155}
.header{font-weight:700;fill:#1e293b;font-size:12px}
.row-bg{fill:#f8fafc}.card{fill:#ffffff;stroke:#e2e8f0}.grid{stroke:#e2e8f0}
.tag1{fill:#3b82f6}.tag2{fill:#10b981}.tag3{fill:#f59e0b}.tag4{fill:#8b5cf6}
@media (prefers-color-scheme:dark){
text{fill:#cbd5e1}.header{fill:#f1f5f9}.row-bg{fill:#1e293b}.card{fill:#0f172a;stroke:#1e293b}.grid{stroke:#334155}
}
</style>
<rect class="card" x="1" y="1" width="638" height="328" rx="12"/>
<text x="24" y="32" font-weight="700" font-size="15">Web3 Compensation and Negotiation Framework</text>
<text x="24" y="50" font-size="11" fill="#64748b">Evaluating base currency mix, token grants, vesting clauses, and risk mitigation (Pantera Capital Data)</text>

<!-- Header -->
<line class="grid" x1="20" y1="65" x2="620" y2="65"/>
<text x="28" y="82" class="header">Compensation Layer</text>
<text x="175" y="82" class="header">Structure &amp; Mechanics</text>
<text x="350" y="82" class="header">Negotiation Strategy</text>
<text x="495" y="82" class="header">Risk Profile</text>
<line class="grid" x1="20" y1="92" x2="620" y2="92"/>

<!-- Row 1 -->
<rect class="row-bg" x="20" y="94" width="600" height="50" rx="4"/>
<text x="28" y="116" font-weight="600">Base Salary</text>
<text x="28" y="132" font-size="10" fill="#64748b">Fiat vs Stablecoin</text>
<text x="175" y="116">USD, USDC, USDT payroll</text>
<text x="175" y="132" font-size="10" fill="#64748b">Local compliance (Deel / Remote)</text>
<text x="350" y="116">Anchor to US remote rates</text>
<text x="350" y="132" font-size="10" fill="#64748b">Request FX buffer for local fiat</text>
<rect class="tag1" x="495" y="110" width="70" height="12" rx="3"/>
<text x="500" y="120" font-size="10" fill="#ffffff" font-weight="700">Zero Risk</text>

<!-- Row 2 -->
<text x="28" y="168" font-weight="600">Token Allocation</text>
<text x="28" y="184" font-size="10" fill="#64748b">Incentive Plan</text>
<text x="175" y="168">Fixed basis points (bps) of supply</text>
<text x="175" y="184" font-size="10" fill="#64748b">Token Grant Agreements (RTAs)</text>
<text x="350" y="168">Insist on % share, not USD value</text>
<text x="350" y="184" font-size="10" fill="#64748b">Require FDV model breakdown</text>
<rect class="tag2" x="495" y="162" width="85" height="12" rx="3"/>
<text x="500" y="172" font-size="10" fill="#ffffff" font-weight="700">Market Beta</text>

<!-- Row 3 -->
<rect class="row-bg" x="20" y="198" width="600" height="50" rx="4"/>
<text x="28" y="220" font-weight="600">Vesting Terms</text>
<text x="28" y="236" font-size="10" fill="#64748b">Cliff &amp; Release</text>
<text x="175" y="220">4-year linear, 1-year cliff</text>
<text x="175" y="236" font-size="10" fill="#64748b">TGE liquidity dependencies</text>
<text x="350" y="220">Seek retroactive vesting start</text>
<text x="350" y="236" font-size="10" fill="#64748b">Clarify good/bad leaver clauses</text>
<rect class="tag3" x="495" y="214" width="75" height="12" rx="3"/>
<text x="500" y="224" font-size="10" fill="#ffffff" font-weight="700">Liquidity Lag</text>

<!-- Row 4 -->
<text x="28" y="272" font-weight="600">Perks &amp; Stipends</text>
<text x="28" y="288" font-size="10" fill="#64748b">Non-Cash Value</text>
<text x="175" y="272">Hardware, home office, health</text>
<text x="175" y="288" font-size="10" fill="#64748b">Conference travel &amp; gas allowances</text>
<text x="350" y="272">Negotiate $5k–$10k signing bonus</text>
<text x="350" y="288" font-size="10" fill="#64748b">Establish recurring learning fund</text>
<rect class="tag4" x="495" y="266" width="95" height="12" rx="3"/>
<text x="500" y="276" font-size="10" fill="#ffffff" font-weight="700">Cash Equiv.</text>

<line class="grid" x1="20" y1="306" x2="620" y2="306"/>
</svg>
