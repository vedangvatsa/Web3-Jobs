<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-labelledby="t11 d11">
<title id="t11">Smart contract audit price bands, USD thousands</title>
<desc id="d11">Range bars: token review 5 to 15, protocol 15 to 40, bridge 50 to 100, tier-one firm 80 to 200 thousand dollars.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px;fill:#334155}
.num{font-variant-numeric:tabular-nums;font-weight:600;font-size:12px}
.bar{fill:#0ea5e9}.card{fill:#ffffff;stroke:#e2e8f0}.grid{stroke:#eef2f7}
@media (prefers-color-scheme:dark){text{fill:#cbd5e1}.bar{fill:#38bdf8}.grid{stroke:#1e293b}.card{fill:#0f172a;stroke:#1e293b}}
</style>
<rect class="card" x="1" y="1" width="638" height="248" rx="12"/>
<text x="20" y="32" font-weight="700" font-size="15">Audit price bands (USD thousands)</text>
<text x="20" y="70">Token review</text><rect class="bar" x="230" y="56" width="20" height="18" rx="9"/><text class="num" x="258" y="70">5-15</text>
<text x="20" y="106">Protocol</text><rect class="bar" x="250" y="92" width="50" height="18" rx="9"/><text class="num" x="308" y="106">15-40</text>
<text x="20" y="142">Bridge / DeFi</text><rect class="bar" x="320" y="128" width="100" height="18" rx="9"/><text class="num" x="428" y="142">50-100</text>
<text x="20" y="178">Tier-one firm</text><rect class="bar" x="380" y="164" width="240" height="18" rx="9"/><text class="num" x="556" y="178" fill="#ffffff">80-200+</text>
<g class="grid"><line x1="220" y1="42" x2="220" y2="188"/><line x1="320" y1="42" x2="320" y2="188"/><line x1="420" y1="42" x2="420" y2="188"/><line x1="520" y1="42" x2="520" y2="188"/><line x1="620" y1="42" x2="620" y2="188"/></g>
<text x="220" y="206">0</text><text x="312" y="206">50</text><text x="412" y="206">100</text><text x="512" y="206">150</text><text x="606" y="206">200</text>
<text x="20" y="228" font-size="12">Contests ($20-100k+) and ~$25k per engineer-week sit between these bands.</text>
</svg>
