<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="saw-title saw-desc">
<title id="saw-title">Smart Contract Security Audit and Verification Pipeline</title>
<desc id="saw-desc">Comprehensive 5-stage verification workflow from threat modeling to formal verification and competitive auditing.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:12px;fill:#334155}
.header{font-weight:700;fill:#1e293b;font-size:12px}
.row-bg{fill:#f8fafc}.card{fill:#ffffff;stroke:#e2e8f0}.grid{stroke:#e2e8f0}
.lvl1{fill:#3b82f6}.lvl2{fill:#0ea5e9}.lvl3{fill:#f59e0b}.lvl4{fill:#8b5cf6}.lvl5{fill:#ef4444}
@media (prefers-color-scheme:dark){
text{fill:#cbd5e1}.header{fill:#f1f5f9}.row-bg{fill:#1e293b}.card{fill:#0f172a;stroke:#1e293b}.grid{stroke:#334155}
}
</style>
<rect class="card" x="1" y="1" width="638" height="328" rx="12"/>
<text x="24" y="32" font-weight="700" font-size="15">Smart Contract Audit and Security Verification Workflow</text>
<text x="24" y="50" font-size="11" fill="#64748b">Defensive verification stages, automated tooling suites, and bug detection efficacy (Trail of Bits &amp; Spearbit)</text>

<!-- Header -->
<line class="grid" x1="20" y1="65" x2="620" y2="65"/>
<text x="28" y="82" class="header">Audit Phase</text>
<text x="175" y="82" class="header">Primary Tooling &amp; Frameworks</text>
<text x="350" y="82" class="header">Verification Target</text>
<text x="495" y="82" class="header">Bug Catch Rate</text>
<line class="grid" x1="20" y1="92" x2="620" y2="92"/>

<!-- Row 1 -->
<rect class="row-bg" x="20" y="94" width="600" height="42" rx="4"/>
<text x="28" y="114" font-weight="600">1. Threat Modeling</text>
<text x="28" y="128" font-size="10" fill="#64748b">Architecture Spec</text>
<text x="175" y="114">Actor matrices, UML, PlantUML</text>
<text x="175" y="128" font-size="10" fill="#64748b">Trust boundaries &amp; multisigs</text>
<text x="350" y="114">Privileged roles &amp; invariants</text>
<rect class="lvl1" x="495" y="106" width="55" height="12" rx="3"/>
<text x="500" y="116" font-size="10" fill="#ffffff" font-weight="700">15% Flaws</text>

<!-- Row 2 -->
<text x="28" y="152" font-weight="600">2. Static Analysis</text>
<text x="28" y="166" font-size="10" fill="#64748b">AST &amp; Linting</text>
<text x="175" y="152">Slither, Aderyn, 4naly3er</text>
<text x="175" y="166" font-size="10" fill="#64748b">Solhint, Semgrep rules</text>
<text x="350" y="152">Known vulnerability patterns</text>
<rect class="lvl2" x="495" y="144" width="65" height="12" rx="3"/>
<text x="500" y="154" font-size="10" fill="#ffffff" font-weight="700">25% Flaws</text>

<!-- Row 3 -->
<rect class="row-bg" x="20" y="174" width="600" height="42" rx="4"/>
<text x="28" y="194" font-weight="600">3. Stateful Fuzzing</text>
<text x="28" y="208" font-size="10" fill="#64748b">Invariant Testing</text>
<text x="175" y="194">Foundry Forge, Echidna, Medusa</text>
<text x="175" y="208" font-size="10" fill="#64748b">Pseudorandom call sequences</text>
<text x="350" y="194">Accounting balance invariants</text>
<rect class="lvl3" x="495" y="186" width="75" height="12" rx="3"/>
<text x="500" y="196" font-size="10" fill="#ffffff" font-weight="700">35% Flaws</text>

<!-- Row 4 -->
<text x="28" y="232" font-weight="600">4. Formal Proving</text>
<text x="28" y="246" font-size="10" fill="#64748b">SMT Solvers</text>
<text x="175" y="232">Certora Prover, Halmos (a16z)</text>
<text x="175" y="246" font-size="10" fill="#64748b">CVL specs &amp; symbolic bytecode</text>
<text x="350" y="232">Mathematical proof of safety</text>
<rect class="lvl4" x="495" y="224" width="60" height="12" rx="3"/>
<text x="500" y="234" font-size="10" fill="#ffffff" font-weight="700">10% Deep</text>

<!-- Row 5 -->
<rect class="row-bg" x="20" y="254" width="600" height="42" rx="4"/>
<text x="28" y="274" font-weight="600">5. Manual Review</text>
<text x="28" y="288" font-size="10" fill="#64748b">Adversarial Game</text>
<text x="175" y="274">Competitive audits, Sherlock</text>
<text x="175" y="288" font-size="10" fill="#64748b">Code4rena, Immunefi bounties</text>
<text x="350" y="274">Complex economic exploits</text>
<rect class="lvl5" x="495" y="266" width="85" height="12" rx="3"/>
<text x="500" y="276" font-size="10" fill="#ffffff" font-weight="700">Critical Logic</text>

<line class="grid" x1="20" y1="306" x2="620" y2="306"/>
</svg>
