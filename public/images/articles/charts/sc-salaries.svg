<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" role="img" aria-labelledby="t10 d10">
<title id="t10">Solidity developer pay points, USD thousands per year</title>
<desc id="d10">Bars: junior 100, average 150, senior 250, auditor 375, lead 315. Bands run far wider; see caption.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px;fill:#334155}
.num{font-variant-numeric:tabular-nums;font-weight:600}
.bar{fill:#6366f1}.hi{fill:#8b5cf6}.card{fill:#ffffff;stroke:#e2e8f0}.grid{stroke:#eef2f7}
@media (prefers-color-scheme:dark){text{fill:#cbd5e1}.bar{fill:#818cf8}.hi{fill:#a78bfa}.grid{stroke:#1e293b}.card{fill:#0f172a;stroke:#1e293b}}
</style>
<rect class="card" x="1" y="1" width="638" height="268" rx="12"/>
<text x="20" y="32" font-weight="700" font-size="15">Solidity pay points (USD thousands / year)</text>
<text x="20" y="68">Junior</text><rect class="bar" x="200" y="54" width="107" height="18" rx="4"/><text class="num" x="314" y="68">100</text>
<text x="20" y="102">Average</text><rect class="bar" x="200" y="88" width="160" height="18" rx="4"/><text class="num" x="367" y="102">150</text>
<text x="20" y="136">Senior</text><rect class="bar" x="200" y="122" width="267" height="18" rx="4"/><text class="num" x="474" y="136">250</text>
<text x="20" y="170">Auditor</text><rect class="hi" x="200" y="156" width="400" height="18" rx="4"/><text class="num" x="607" y="170">375</text>
<text x="20" y="204">Lead</text><rect class="bar" x="200" y="190" width="336" height="18" rx="4"/><text class="num" x="543" y="204">315</text>
<g class="grid"><line x1="200" y1="42" x2="200" y2="214"/><line x1="300" y1="42" x2="300" y2="214"/><line x1="400" y1="42" x2="400" y2="214"/><line x1="500" y1="42" x2="500" y2="214"/></g>
<text x="200" y="232">0</text><text x="292" y="232">100</text><text x="392" y="232">200</text><text x="492" y="232">300</text><text x="592" y="232">400</text>
<text x="20" y="254" font-size="12">Midpoints; full bands: junior 80-120, senior 200-300, auditor 250-500, lead 280-350.</text>
</svg>
