<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="accent-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg-grad)"/>

  <!-- Title -->
  <text x="600" y="55" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="700">Smart Contract Security Audit &amp; Verification Pipeline</text>
  <text x="600" y="85" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="15">From Static Analysis to Fuzzing, Invariant Testing &amp; Formal Verification</text>

  <!-- Flow Boxes -->

  <!-- Box 1: Code Ingestion -->
  <g transform="translate(60, 130)" filter="url(#shadow)">
    <rect width="230" height="460" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="8" fill="#3b82f6" rx="4"/>
    <text x="115" y="38" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="17" font-weight="700">1. Static &amp; AST Analysis</text>

    <rect x="15" y="60" width="200" height="75" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="85" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="700">Slither / Aderyn</text>
    <text x="25" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">AST pattern matching</text>
    <text x="25" y="122" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Detects reentrancy &amp; shadow</text>

    <rect x="15" y="150" width="200" height="75" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="175" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="700">Control Flow Graph</text>
    <text x="25" y="195" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Function call graphs</text>
    <text x="25" y="212" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">State variable mutability</text>

    <rect x="15" y="240" width="200" height="75" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="265" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="700">Manual Code Review</text>
    <text x="25" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Business logic flaws</text>
    <text x="25" y="302" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Economic incentive attacks</text>

    <rect x="15" y="330" width="200" height="110" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="25" y="355" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Primary Objective:</text>
    <text x="25" y="375" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Catch low-hanging bugs</text>
    <text x="25" y="395" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Map external calls</text>
    <text x="25" y="415" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Check CEI adherence</text>
  </g>

  <!-- Arrow 1-2 -->
  <path d="M 290 360 L 330 360" stroke="#0284c7" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <polygon points="330,360 320,354 320,366" fill="#0284c7"/>

  <!-- Box 2: Dynamic Fuzzing & Invariants -->
  <g transform="translate(340, 130)" filter="url(#shadow)">
    <rect width="240" height="460" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="240" height="8" fill="url(#accent-cyan)" rx="4"/>
    <text x="120" y="38" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="17" font-weight="700">2. Dynamic Fuzzing &amp; Testing</text>

    <rect x="15" y="60" width="210" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="85" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="700">Foundry / Echidna</text>
    <text x="25" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Stateless &amp; Stateful Fuzzing</text>
    <text x="25" y="125" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Generates millions of inputs</text>

    <rect x="15" y="160" width="210" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="185" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="700">Invariant Testing</text>
    <text x="25" y="205" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Assert global invariants</text>
    <text x="25" y="225" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">totalSupply == sum(balances)</text>

    <rect x="15" y="260" width="210" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="285" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="700">Mainnet State Forking</text>
    <text x="25" y="305" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Test against live DEX/oracles</text>
    <text x="25" y="325" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Flash loan attack simulation</text>

    <rect x="15" y="360" width="210" height="80" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="25" y="385" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Primary Objective:</text>
    <text x="25" y="405" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Break state constraints</text>
    <text x="25" y="425" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Detect edge-case overflows</text>
  </g>

  <!-- Arrow 2-3 -->
  <path d="M 580 360 L 620 360" stroke="#0284c7" stroke-width="3" fill="none"/>
  <polygon points="620,360 610,354 610,366" fill="#0284c7"/>

  <!-- Box 3: Formal Verification -->
  <g transform="translate(630, 130)" filter="url(#shadow)">
    <rect width="240" height="460" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="240" height="8" fill="url(#accent-emerald)" rx="4"/>
    <text x="120" y="38" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="17" font-weight="700">3. Formal Verification</text>

    <rect x="15" y="60" width="210" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="85" fill="#34d399" font-family="monospace" font-size="14" font-weight="700">Certora Prover / Halmos</text>
    <text x="25" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Mathematical Proofs</text>
    <text x="25" y="125" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">SMT / SAT Solvers (Z3)</text>

    <rect x="15" y="160" width="210" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="185" fill="#34d399" font-family="monospace" font-size="14" font-weight="700">CVL Specifications</text>
    <text x="25" y="205" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Certora Verification Lang</text>
    <text x="25" y="225" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Proves rules for ALL inputs</text>

    <rect x="15" y="260" width="210" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="285" fill="#34d399" font-family="monospace" font-size="14" font-weight="700">Symbolic Execution</text>
    <text x="25" y="305" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">K-Framework / Manticore</text>
    <text x="25" y="325" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Explores execution paths</text>

    <rect x="15" y="360" width="210" height="80" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="25" y="385" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Primary Objective:</text>
    <text x="25" y="405" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• 100% mathematical proof</text>
    <text x="25" y="425" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Zero counterexample state</text>
  </g>

  <!-- Arrow 3-4 -->
  <path d="M 870 360 L 910 360" stroke="#0284c7" stroke-width="3" fill="none"/>
  <polygon points="910,360 900,354 900,366" fill="#0284c7"/>

  <!-- Box 4: Remediation & Proof of Work -->
  <g transform="translate(920, 130)" filter="url(#shadow)">
    <rect width="220" height="460" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="8" fill="url(#accent-red)" rx="4"/>
    <text x="110" y="38" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="17" font-weight="700">4. Report &amp; Contests</text>

    <rect x="15" y="60" width="190" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="85" fill="#f87171" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Severity Ranking</text>
    <text x="25" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Critical / High / Medium</text>
    <text x="25" y="125" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Impact x Likelihood matrix</text>

    <rect x="15" y="160" width="190" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="185" fill="#f87171" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Public Audit Contests</text>
    <text x="25" y="205" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Code4rena / Cantina</text>
    <text x="25" y="225" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Sherlock competitive audits</text>

    <rect x="15" y="260" width="190" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="285" fill="#f87171" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Bug Bounties</text>
    <text x="25" y="305" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Immunefi live systems</text>
    <text x="25" y="325" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Up to $10M bounty payouts</text>

    <rect x="15" y="360" width="190" height="80" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="25" y="385" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Career Outcome:</text>
    <text x="25" y="405" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Verifiable leaderboard rank</text>
    <text x="25" y="425" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• $150K-$350K+ compensation</text>
  </g>

  <!-- Footer -->
  <text x="600" y="640" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="13">Hashtag Web3 Security Career Guide • https://hashtagweb3.com</text>
</svg>
