<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="sim-title sim-desc">
<title id="sim-title">Solidity Technical Interview Evaluation Matrix</title>
<desc id="sim-desc">Assessment categories, live coding test expectations, and screening benchmarks used by Web3 hiring teams.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:12px;fill:#334155}
.header{font-weight:700;fill:#1e293b;font-size:12px}
.row-bg{fill:#f8fafc}.card{fill:#ffffff;stroke:#e2e8f0}.grid{stroke:#e2e8f0}
.bar1{fill:#3b82f6}.bar2{fill:#ef4444}.bar3{fill:#10b981}.bar4{fill:#8b5cf6}
@media (prefers-color-scheme:dark){
text{fill:#cbd5e1}.header{fill:#f1f5f9}.row-bg{fill:#1e293b}.card{fill:#0f172a;stroke:#1e293b}.grid{stroke:#334155}
}
</style>
<rect class="card" x="1" y="1" width="638" height="328" rx="12"/>
<text x="24" y="32" font-weight="700" font-size="15">Solidity Technical Interview Evaluation Matrix</text>
<text x="24" y="50" font-size="11" fill="#64748b">Primary technical screening rounds, live coding assessments, and failure vectors (Protocol hiring data)</text>

<!-- Header -->
<line class="grid" x1="20" y1="65" x2="620" y2="65"/>
<text x="28" y="82" class="header">Interview Domain</text>
