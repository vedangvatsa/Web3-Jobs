<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 262" role="img" aria-labelledby="t13 d13">
<title id="t13">Share of new U.S. businesses closed after 1, 5, and 10 years</title>
<desc id="d13">Bars: 20.4 percent closed by year one, 49.4 percent by year five, 65.3 percent by year ten.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px;fill:#334155}
.num{font-variant-numeric:tabular-nums;font-weight:600}
.bar{fill:#f59e0b}.card{fill:#ffffff;stroke:#e2e8f0}.grid{stroke:#eef2f7}
@media (prefers-color-scheme:dark){text{fill:#cbd5e1}.bar{fill:#fbbf24}.grid{stroke:#1e293b}.card{fill:#0f172a;stroke:#1e293b}}
</style>
<rect class="card" x="1" y="1" width="638" height="260" rx="12"/>
<text x="20" y="32" font-weight="700" font-size="15">Share of new U.S. businesses closed, by age (%)</text>
<text x="200" y="80">Year 1</text>
<rect class="bar" x="200" y="58" width="86" height="18" rx="4"/><text class="num" x="294" y="72">20.4</text>
<text x="200" y="150">Year 5</text>
<rect class="bar" x="200" y="128" width="209" height="18" rx="4"/><text class="num" x="417" y="142">49.4</text>
<text x="200" y="220">Year 10</text>
<rect class="bar" x="200" y="198" width="276" height="18" rx="4"/><text class="num" x="484" y="212">65.3</text>
<g class="grid"><line x1="200" y1="42" x2="200" y2="222"/><line x1="304" y1="42" x2="304" y2="222"/><line x1="408" y1="42" x2="408" y2="222"/><line x1="512" y1="42" x2="512" y2="222"/></g>
<text x="200" y="244">0</text><text x="294" y="244">25%</text><text x="398" y="244">50%</text><text x="502" y="244">75%</text>
<text x="20" y="254" font-size="12">All private-sector U.S. establishments, not only venture-backed startups.</text>
</svg>