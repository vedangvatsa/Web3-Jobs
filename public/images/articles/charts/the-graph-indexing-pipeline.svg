<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="tg-title tg-desc">
<title id="tg-title">The Graph Protocol Decentralized Indexing Architecture</title>
<desc id="tg-desc">End-to-end data pipeline of The Graph showing blockchain event ingestion, AssemblyScript subgraph mapping, Postgres store, and decentralized GraphQL queries.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:11px;fill:#334155}
.header{font-weight:700;fill:#1e293b;font-size:12px}
.card{fill:#ffffff;stroke:#e2e8f0}
.box-ingest{fill:#f8fafc;stroke:#64748b;stroke-width:1.5}
.box-map{fill:#eff6ff;stroke:#2563eb;stroke-width:1.5}
.box-store{fill:#f0fdf4;stroke:#16a34a;stroke-width:1.5}
.box-net{fill:#faf5ff;stroke:#8b5cf6;stroke-width:1.5}
.arrow{stroke:#64748b;stroke-width:1.5;fill:none;marker-end:url(#arrowhead-tg)}
@media (prefers-color-scheme:dark){
text{fill:#cbd5e1}.header{fill:#f1f5f9}.card{fill:#0f172a;stroke:#1e293b}
.box-ingest{fill:#1e293b;stroke:#475569}.box-map{fill:#172554;stroke:#60a5fa}.box-store{fill:#064e3b;stroke:#34d399}.box-net{fill:#3b0764;stroke:#c084fc}
.arrow{stroke:#94a3b8}
}
</style>
<defs>
<marker id="arrowhead-tg" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
<polygon points="0 0, 6 3, 0 6" fill="#64748b" />
</marker>
</defs>

<rect class="card" x="1" y="1" width="638" height="358" rx="12"/>
<text x="24" y="30" font-weight="700" font-size="15">The Graph: Decentralized Blockchain Indexing Pipeline</text>
<text x="24" y="48" font-size="11" fill="#64748b">Transforming raw blockchain byte logs into deterministic, queryable GraphQL schemas</text>

<!-- Stage 1: Blockchain Events -->
<rect class="box-ingest" x="24" y="70" width="130" height="250" rx="8"/>
<text x="34" y="94" class="header">1. Node Ingestion</text>
<text x="34" y="112" font-size="10" fill="#64748b">Raw RPC Stream</text>

<text x="34" y="138" font-weight="600">Data Sources:</text>
<text x="34" y="152" font-size="10" fill="#64748b">EVM RPC (Erigon/Reth)</text>
<text x="34" y="166" font-size="10" fill="#64748b">Firehose streaming</text>

<text x="34" y="190" font-weight="600">Event Triggers:</text>
<text x="34" y="204" font-size="10" fill="#64748b">Smart contract logs</text>
<text x="34" y="218" font-size="10" fill="#64748b">Call handlers, block triggers</text>

<text x="34" y="242" font-weight="600">Reorg Handling:</text>
<text x="34" y="256" font-size="10" fill="#64748b">Automatic state rollbacks</text>

<!-- Arrow 1 to 2 -->
<path class="arrow" d="M154 195 L174 195"/>

<!-- Stage 2: Mapping Handlers -->
<rect class="box-map" x="176" y="70" width="140" height="250" rx="8"/>
<text x="186" y="94" class="header" fill="#2563eb">2. Subgraph Mapping</text>
<text x="186" y="112" font-size="10" fill="#2563eb">WASM Execution</text>

<text x="186" y="138" font-weight="600">AssemblyScript / Rust:</text>
<text x="186" y="152" font-size="10" fill="#64748b">Compiles to WebAssembly</text>

<text x="186" y="176" font-weight="600">Event Unpacking:</text>
<text x="186" y="190" font-size="10" fill="#64748b">Decodes ABI parameters</text>
<text x="186" y="204" font-size="10" fill="#64748b">Derives entity relations</text>

<text x="186" y="228" font-weight="600">Deterministic Logic:</text>
<text x="186" y="242" font-size="10" fill="#64748b">Strict sandboxed sandbox</text>
<text x="186" y="256" font-size="10" fill="#64748b">Zero external side-effects</text>

<!-- Arrow 2 to 3 -->
<path class="arrow" d="M316 195 L336 195"/>

<!-- Stage 3: Data Store -->
<rect class="box-store" x="338" y="70" width="136" height="250" rx="8"/>
<text x="348" y="94" class="header" fill="#16a34a">3. Database Storage</text>
<text x="348" y="112" font-size="10" fill="#16a34a">Postgres Entity Store</text>

<text x="348" y="138" font-weight="600">Relational Indexing:</text>
<text x="348" y="152" font-size="10" fill="#64748b">Structured GraphQL schema</text>
<text x="348" y="166" font-size="10" fill="#64748b">Auto-indexed relations</text>

<text x="348" y="190" font-weight="600">GraphQL Server:</text>
<text x="348" y="204" font-size="10" fill="#64748b">Ultra-fast API queries</text>
<text x="348" y="218" font-size="10" fill="#64748b">Sub-millisecond responses</text>

<text x="348" y="242" font-weight="600">Frontend DApps:</text>
<text x="348" y="256" font-size="10" fill="#64748b">Uniswap, Aave, Opensea</text>

<!-- Arrow 3 to 4 -->
<path class="arrow" d="M474 195 L494 195"/>

<!-- Stage 4: Decentralized Network -->
<rect class="box-net" x="496" y="70" width="120" height="250" rx="8"/>
<text x="506" y="94" class="header" fill="#7c3aed">4. GRT Network</text>
<text x="506" y="112" font-size="10" fill="#7c3aed">Decentralized Trust</text>

<text x="506" y="138" font-weight="600">Indexers:</text>
<text x="506" y="152" font-size="10" fill="#64748b">Stake GRT, serve queries</text>

<text x="506" y="176" font-weight="600">Curators:</text>
<text x="506" y="190" font-size="10" fill="#64748b">Signal high-value graphs</text>

<text x="506" y="214" font-weight="600">Delegators:</text>
<text x="506" y="228" font-size="10" fill="#64748b">Delegate stake to indexers</text>

<text x="506" y="252" font-weight="600">Query Receipts:</text>
<text x="506" y="266" font-size="10" fill="#7c3aed">Micropayment channels</text>
</svg>