<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="box-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="burn-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#bg-grad)" rx="12"/>

  <!-- Title -->
  <text x="400" y="40" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Cryptocurrency Token Burning Mechanics</text>
  <text x="400" y="65" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">EIP-1559 Fee Burns, Buyback &amp; Burn Contracts, Null Addresses &amp; Deflationary Supply Curves</text>

  <!-- Step 1: Revenue / Fee Collection -->
  <g transform="translate(40, 110)" filter="url(#shadow)">
    <rect width="160" height="210" fill="url(#box-grad)" stroke="#38bdf8" stroke-width="2" rx="8"/>
    <rect width="160" height="34" fill="#0284c7" rx="8"/>
    <text x="80" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1. Protocol Revenue</text>

    <text x="12" y="60" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">• EIP-1559 Base Gas</text>
    <text x="12" y="80" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">• DEX Trading Fees</text>
    <text x="12" y="100" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">• Quarterly Profits</text>

    <rect x="10" y="120" width="140" height="75" fill="#0f172a" rx="4" stroke="#334155"/>
    <text x="80" y="145" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Fee Collection</text>
    <text x="80" y="170" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Automatic Ingress</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 200 215 L 230 215" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,4"/>
  <polygon points="235,215 225,210 225,220" fill="#38bdf8"/>

  <!-- Step 2: Buyback & Burn Router -->
  <g transform="translate(240, 110)" filter="url(#shadow)">
    <rect width="160" height="210" fill="url(#box-grad)" stroke="#818cf8" stroke-width="2" rx="8"/>
    <rect width="160" height="34" fill="#4f46e5" rx="8"/>
    <text x="80" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2. Buyback Router</text>

    <text x="12" y="60" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">• Market Swap (USDC-&gt;Token)</text>
    <text x="12" y="80" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">• Internal Mint Slashes</text>
    <text x="12" y="100" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">• Proof-of-Burn Check</text>

    <rect x="10" y="120" width="140" height="75" fill="#0f172a" rx="4" stroke="#334155"/>
    <text x="80" y="145" fill="#818cf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Burn Engine</text>
    <text x="80" y="170" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Open Market Buy</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 400 215 L 430 215" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6,4"/>
  <polygon points="435,215 425,210 425,220" fill="#ef4444"/>

  <!-- Step 3: Null Address / Destruction -->
  <g transform="translate(440, 110)" filter="url(#shadow)">
    <rect width="160" height="210" fill="url(#box-grad)" stroke="#ef4444" stroke-width="2" rx="8"/>
    <rect width="160" height="34" fill="url(#burn-grad)" rx="8"/>
    <text x="80" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3. Null Address</text>

    <text x="12" y="60" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">• 0x00...00dEaD Wallet</text>
    <text x="12" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">• No Private Key Exists</text>
    <text x="12" y="100" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">• ERC-20 `_burn()` call</text>

    <rect x="10" y="120" width="140" height="75" fill="#0f172a" rx="4" stroke="#ef4444"/>
    <text x="80" y="145" fill="#ef4444" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">PERMANENT BURN</text>
    <text x="80" y="170" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Irreversible State</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 600 215 L 630 215" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6,4"/>
  <polygon points="635,215 625,210 625,220" fill="#10b981"/>

  <!-- Step 4: Supply Reduction Impact -->
  <g transform="translate(640, 110)" filter="url(#shadow)">
    <rect width="120" height="210" fill="url(#box-grad)" stroke="#10b981" stroke-width="2" rx="8"/>
    <rect width="120" height="34" fill="#059669" rx="8"/>
    <text x="60" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">4. Deflation</text>

    <text x="8" y="60" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="600">• Supply Decreases</text>
    <text x="8" y="80" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="600">• Scarcity Increases</text>
    <text x="8" y="100" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="600">• Holder Equity Share</text>

    <rect x="6" y="120" width="108" height="75" fill="#0f172a" rx="4" stroke="#334155"/>
    <text x="60" y="145" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Ultrasound Money</text>
    <text x="60" y="165" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Supply Squeeze</text>
  </g>

  <!-- Bottom Banner -->
  <rect x="40" y="350" width="720" height="32" fill="#1e293b" rx="6" stroke="#334155"/>
  <text x="400" y="371" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Token burning permanently removes assets by invoking contract `_burn()` or transferring tokens to un-spendable null addresses.</text>
</svg>
