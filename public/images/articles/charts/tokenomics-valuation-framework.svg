<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="tvf-title tvf-desc">
<title id="tvf-title">Tokenomics Due Diligence and Valuation Framework</title>
<desc id="tvf-desc">Architectural diagram detailing the four pillars of tokenomic analysis: supply schedule, vesting overhang, value capture sinks, and quantitative valuation ratios.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:12px;fill:#334155}
.header{font-weight:700;fill:#1e293b;font-size:12px}
.row-bg{fill:#f8fafc}.card{fill:#ffffff;stroke:#e2e8f0}.grid{stroke:#e2e8f0}
.pill1{fill:#3b82f6}.pill2{fill:#ef4444}.pill3{fill:#10b981}.pill4{fill:#8b5cf6}
@media (prefers-color-scheme:dark){
text{fill:#cbd5e1}.header{fill:#f1f5f9}.row-bg{fill:#1e293b}.card{fill:#0f172a;stroke:#1e293b}.grid{stroke:#334155}
}
</style>
<rect class="card" x="1" y="1" width="638" height="328" rx="12"/>
<text x="24" y="32" font-weight="700" font-size="15">Tokenomics Audit and Valuation Framework</text>
<text x="24" y="50" font-size="11" fill="#64748b">Primary quantitative filters for assessing token dilution, emission velocity, and economic sinks</text>

<!-- Header -->
<line class="grid" x1="20" y1="65" x2="620" y2="65"/>
<text x="28" y="82" class="header">Audit Dimension</text>
<text x="175" y="82" class="header">Key Metrics &amp; Formulas</text>
<text x="340" y="82" class="header">Telemetry &amp; Verification</text>
<text x="495" y="82" class="header">Evaluation Focus</text>
<line class="grid" x1="20" y1="92" x2="620" y2="92"/>

<!-- Row 1 -->
<rect class="row-bg" x="20" y="94" width="600" height="50" rx="4"/>
<text x="28" y="116" font-weight="600">Float &amp; Supply Caps</text>
<text x="28" y="132" font-size="10" fill="#64748b">Dilution Profile</text>
<text x="175" y="116">Mcap / FDV ratio</text>
<text x="175" y="132" font-size="10" fill="#64748b">Circulating vs Max supply</text>
<text x="340" y="116">CoinGecko, CoinMarketCap</text>
<text x="340" y="132" font-size="10" fill="#64748b">Etherscan totalSupply()</text>
<rect class="pill1" x="495" y="110" width="85" height="12" rx="3"/>
<text x="500" y="120" font-size="10" fill="#ffffff" font-weight="700">Low-Float Risk</text>

<!-- Row 2 -->
<text x="28" y="168" font-weight="600">Vesting &amp; Overhang</text>
<text x="28" y="184" font-size="10" fill="#64748b">Liquidity Absorption</text>
<text x="175" y="168">Daily unlock vs DEX vol</text>
<text x="175" y="184" font-size="10" fill="#64748b">Cliff step vs linear rate</text>
<text x="340" y="168">Tokenomist, DropsTab</text>
<text x="340" y="184" font-size="10" fill="#64748b">Vesting contract bytecode</text>
<rect class="pill2" x="495" y="162" width="75" height="12" rx="3"/>
<text x="500" y="172" font-size="10" fill="#ffffff" font-weight="700">Sell Pressure</text>

<!-- Row 3 -->
<rect class="row-bg" x="20" y="198" width="600" height="50" rx="4"/>
<text x="28" y="220" font-weight="600">Value Capture Sinks</text>
<text x="28" y="236" font-size="10" fill="#64748b">Economic Utility</text>
<text x="175" y="220">Fee split, buyback &amp; burn</text>
<text x="175" y="236" font-size="10" fill="#64748b">Staking yield vs dilution</text>
<text x="340" y="220">Token Terminal, Artemis</text>
<text x="340" y="236" font-size="10" fill="#64748b">DefiLlama Protocol Fees</text>
<rect class="pill3" x="495" y="214" width="70" height="12" rx="3"/>
<text x="500" y="224" font-size="10" fill="#ffffff" font-weight="700">Real Accrual</text>

<!-- Row 4 -->
<text x="28" y="272" font-weight="600">Holder Concentration</text>
<text x="28" y="288" font-size="10" fill="#64748b">Governance Centralization</text>
<text x="175" y="272">Gini index, Top 10% share</text>
<text x="175" y="288" font-size="10" fill="#64748b">Exchange reserve balances</text>
<text x="340" y="272">Nansen, Arkham, Dune</text>
<text x="340" y="288" font-size="10" fill="#64748b">On-chain clustering</text>
<rect class="pill4" x="495" y="266" width="95" height="12" rx="3"/>
<text x="500" y="276" font-size="10" fill="#ffffff" font-weight="700">Whale Exposure</text>

<line class="grid" x1="20" y1="306" x2="620" y2="306"/>
</svg>
