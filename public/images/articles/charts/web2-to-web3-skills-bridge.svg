<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="wsb-title wsb-desc">
<title id="wsb-title">Web2 to Web3 Engineering Skills Transition Bridge</title>
<desc id="wsb-desc">Mental model mapping comparing centralized cloud architecture to distributed cryptographic execution environments.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:12px;fill:#334155}
.header{font-weight:700;fill:#1e293b;font-size:12px}
.row-bg{fill:#f8fafc}.card{fill:#ffffff;stroke:#e2e8f0}.grid{stroke:#e2e8f0}
.pill1{fill:#3b82f6}.pill2{fill:#10b981}.pill3{fill:#f59e0b}.pill4{fill:#ef4444}
@media (prefers-color-scheme:dark){
text{fill:#cbd5e1}.header{fill:#f1f5f9}.row-bg{fill:#1e293b}.card{fill:#0f172a;stroke:#1e293b}.grid{stroke:#334155}
}
</style>
<rect class="card" x="1" y="1" width="638" height="328" rx="12"/>
<text x="24" y="32" font-weight="700" font-size="15">Web2 to Web3 Engineering Paradigm Shift</text>
<text x="24" y="50" font-size="11" fill="#64748b">Mapping systems architecture, state mutability, and security assumptions across engineering tiers</text>

<!-- Header -->
<line class="grid" x1="20" y1="65" x2="620" y2="65"/>
<text x="28" y="82" class="header">Engineering Domain</text>
<text x="175" y="82" class="header">Traditional Web2 Model</text>
<text x="350" y="82" class="header">Decentralized Web3 Model</text>
<text x="510" y="82" class="header">Transition Shift</text>
<line class="grid" x1="20" y1="92" x2="620" y2="92"/>

<!-- Row 1 -->
<rect class="row-bg" x="20" y="94" width="600" height="50" rx="4"/>
<text x="28" y="116" font-weight="600">State &amp; Storage</text>
<text x="28" y="132" font-size="10" fill="#64748b">Database layer</text>
<text x="175" y="116">Postgres, MySQL, Redis</text>
<text x="175" y="132" font-size="10" fill="#64748b">Mutable, cheap writes, indexed</text>
<text x="350" y="116">EVM storage slots, IPFS, Arweave</text>
<text x="350" y="132" font-size="10" fill="#64748b">Immutable, 20k gas cold writes</text>
<rect class="pill1" x="510" y="110" width="80" height="12" rx="3"/>
<text x="515" y="120" font-size="10" fill="#ffffff" font-weight="700">Cost Mindset</text>

<!-- Row 2 -->
<text x="28" y="168" font-weight="600">Application Logic</text>
<text x="28" y="184" font-size="10" fill="#64748b">Execution layer</text>
<text x="175" y="168">Node.js, Python, Go microservices</text>
<text x="175" y="184" font-size="10" fill="#64748b">Hotfixes, container deploys</text>
<text x="350" y="168">Solidity, Rust smart contracts</text>
<text x="350" y="184" font-size="10" fill="#64748b">Deterministic, immutable logic</text>
<rect class="pill2" x="510" y="162" width="75" height="12" rx="3"/>
<text x="515" y="172" font-size="10" fill="#ffffff" font-weight="700">Finality First</text>

<!-- Row 3 -->
<rect class="row-bg" x="20" y="198" width="600" height="50" rx="4"/>
<text x="28" y="220" font-weight="600">Identity &amp; Auth</text>
<text x="28" y="236" font-size="10" fill="#64748b">User access</text>
<text x="175" y="220">OAuth2, JWT tokens, Passwords</text>
<text x="175" y="236" font-size="10" fill="#64748b">Centralized identity provider</text>
<text x="350" y="220">Public-key cryptography, EIP-4337</text>
<text x="350" y="236" font-size="10" fill="#64748b">Self-custodial, signed payloads</text>
<rect class="pill3" x="510" y="214" width="85" height="12" rx="3"/>
<text x="515" y="224" font-size="10" fill="#ffffff" font-weight="700">Zero Privilege</text>

<!-- Row 4 -->
<text x="28" y="272" font-weight="600">Failure Modes</text>
<text x="28" y="288" font-size="10" fill="#64748b">Adversarial risk</text>
<text x="175" y="272">HTTP 500 error, DB rollback</text>
<text x="175" y="288" font-size="10" fill="#64748b">Internal debugging logs</text>
<text x="350" y="272">Direct exploit, liquidity drainage</text>
<text x="350" y="288" font-size="10" fill="#64748b">Public mempool MEV searchers</text>
<rect class="pill4" x="510" y="266" width="90" height="12" rx="3"/>
<text x="515" y="276" font-size="10" fill="#ffffff" font-weight="700">Adversarial</text>

<line class="grid" x1="20" y1="306" x2="620" y2="306"/>
</svg>
