<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="sec-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="red-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="amber-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="blue-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1000" height="520" fill="url(#sec-bg)"/>

  <text x="500" y="45" fill="#f8fafc" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="0.5">Web3 Cybersecurity &amp; Smart Contract Defense Architecture</text>
  <text x="500" y="70" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="middle">Static Analysis, Invariant Fuzzing, Formal Verification, and Real-Time Threat Response</text>

  <!-- Step 1: Pre-Deployment Audit -->
  <g transform="translate(40, 110)" filter="url(#glow-shadow)">
    <rect width="260" height="340" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="6" rx="3" fill="url(#red-gradient)"/>
    <text x="20" y="40" fill="#f87171" font-size="14" font-weight="700">1. PRE-DEPLOYMENT AUDITING</text>

    <rect x="20" y="65" width="220" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="35" y="90" fill="#f1f5f9" font-size="13" font-weight="600">Static Analysis Tools</text>
    <text x="35" y="112" fill="#94a3b8" font-size="11">Slither, Mythril, Semgrep Rules</text>

    <rect x="20" y="150" width="220" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="35" y="175" fill="#f1f5f9" font-size="13" font-weight="600">Invariant &amp; Property Fuzzing</text>
    <text x="35" y="197" fill="#94a3b8" font-size="11">Foundry Fuzz, Echidna, Medusa</text>

    <rect x="20" y="235" width="220" height="75" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
    <text x="35" y="260" fill="#f87171" font-size="13" font-weight="600">Formal Verification</text>
    <text x="35" y="282" fill="#94a3b8" font-size="11">Certora Prover, SMTChecker</text>
  </g>

  <!-- Flow Arrow 1-2 -->
  <path d="M 300 280 L 360 280" stroke="#f87171" stroke-width="3" fill="none"/>

  <!-- Step 2: Protocol Security Hardening -->
  <g transform="translate(370, 110)" filter="url(#glow-shadow)">
    <rect width="260" height="340" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="6" rx="3" fill="url(#amber-gradient)"/>
    <text x="20" y="40" fill="#fbbf24" font-size="14" font-weight="700">2. ON-CHAIN DEFENSES</text>

    <rect x="20" y="65" width="220" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="35" y="90" fill="#f1f5f9" font-size="13" font-weight="600">Reentrancy Guards</text>
    <text x="35" y="112" fill="#94a3b8" font-size="11">Transient Storage (EIP-1153 TSTORE)</text>

    <rect x="20" y="150" width="220" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="35" y="175" fill="#f1f5f9" font-size="13" font-weight="600">Access Control &amp; Timelocks</text>
    <text x="35" y="197" fill="#94a3b8" font-size="11">AccessManager, Multi-Sig Safe</text>

    <rect x="20" y="235" width="220" height="75" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="35" y="260" fill="#fbbf24" font-size="13" font-weight="600">Oracle Sanity Bounds</text>
    <text x="35" y="282" fill="#94a3b8" font-size="11">Pyth / Chainlink Circuit Breakers</text>
  </g>

  <!-- Flow Arrow 2-3 -->
  <path d="M 630 280 L 690 280" stroke="#fbbf24" stroke-width="3" fill="none"/>

  <!-- Step 3: Threat Monitoring & Incident Response -->
  <g transform="translate(700, 110)" filter="url(#glow-shadow)">
    <rect width="260" height="340" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="6" rx="3" fill="url(#blue-gradient)"/>
    <text x="20" y="40" fill="#60a5fa" font-size="14" font-weight="700">3. INCIDENT RESPONSE</text>

    <rect x="20" y="65" width="220" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="35" y="90" fill="#f1f5f9" font-size="13" font-weight="600">Real-Time Mempool Bots</text>
    <text x="35" y="112" fill="#94a3b8" font-size="11">Forta Bot, Hypernative Signals</text>

    <rect x="20" y="150" width="220" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="35" y="175" fill="#f1f5f9" font-size="13" font-weight="600">Automated Circuit Breakers</text>
    <text x="35" y="197" fill="#94a3b8" font-size="11">SEAL Attack-Pause Smart Contracts</text>

    <rect x="20" y="235" width="220" height="75" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <text x="35" y="260" fill="#60a5fa" font-size="13" font-weight="600">Whitehat Front-Running</text>
    <text x="35" y="282" fill="#94a3b8" font-size="11">Flashbots Private RPC Rescue</text>
  </g>

  <!-- Footer Info -->
  <rect x="40" y="475" width="920" height="30" rx="6" fill="#1e293b"/>
  <text x="500" y="495" fill="#94a3b8" font-size="12" font-weight="500" text-anchor="middle">Hashtag Web3 Technical Guide — Web2 to Web3 Cybersecurity Specialist Career Transition</text>
</svg>
