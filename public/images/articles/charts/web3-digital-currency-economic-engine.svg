<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="box-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#bg-grad)" rx="12"/>

  <!-- Title -->
  <text x="400" y="40" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Web3 &amp; Digital Currencies Native Economic Engine</text>
  <text x="400" y="65" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">Gas Mechanics, Protocol Governance, Stablecoin Settlement &amp; Digital Ownership</text>

  <!-- Quadrant 1: Gas & Computation -->
  <g transform="translate(40, 100)" filter="url(#shadow)">
    <rect width="330" height="110" fill="url(#box-grad)" stroke="#38bdf8" stroke-width="2" rx="8"/>
    <rect width="330" height="28" fill="#0284c7" rx="8"/>
    <text x="165" y="19" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1. Computational Gas Assets (ETH, SOL, AVAX)</text>
    <text x="15" y="50" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">• Prevents Network DDoS &amp; Resource Abuse</text>
    <text x="15" y="70" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">• EIP-1559 Base Fee Burning Mechanism</text>
    <text x="15" y="90" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Economic Function: Protocol Metering &amp; Security</text>
  </g>

  <!-- Quadrant 2: Governance & Incentives -->
  <g transform="translate(430, 100)" filter="url(#shadow)">
    <rect width="330" height="110" fill="url(#box-grad)" stroke="#818cf8" stroke-width="2" rx="8"/>
    <rect width="330" height="28" fill="#4f46e5" rx="8"/>
    <text x="165" y="19" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2. Governance &amp; Incentive Tokens (UNI, AAVE)</text>
    <text x="15" y="50" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">• On-Chain DAO Voting &amp; Parameter Control</text>
    <text x="15" y="70" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">• Liquidity Provider &amp; Node Staking Yields</text>
    <text x="15" y="90" fill="#818cf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Economic Function: Decoupled Capital Coordination</text>
  </g>

  <!-- Quadrant 3: Stablecoins & Payments -->
  <g transform="translate(40, 230)" filter="url(#shadow)">
    <rect width="330" height="110" fill="url(#box-grad)" stroke="#10b981" stroke-width="2" rx="8"/>
    <rect width="330" height="28" fill="#059669" rx="8"/>
    <text x="165" y="19" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3. Fiat Stablecoins (USDC, USDT, PYUSD)</text>
    <text x="15" y="50" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">• Near-Instant Global Cross-Border Settlement</text>
    <text x="15" y="70" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">• Low-Volatility Collateral for DeFi Money Markets</text>
    <text x="15" y="90" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Economic Function: Global Frictionless Liquidity</text>
  </g>

  <!-- Quadrant 4: NFTs & Digital Property -->
  <g transform="translate(430, 230)" filter="url(#shadow)">
    <rect width="330" height="110" fill="url(#box-grad)" stroke="#f59e0b" stroke-width="2" rx="8"/>
    <rect width="330" height="28" fill="#d97706" rx="8"/>
    <text x="165" y="19" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">4. Non-Fungible Tokens (ERC-721 / ERC-1155)</text>
    <text x="15" y="50" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">• Provenance &amp; Unique Digital Asset Ownership</text>
    <text x="15" y="70" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">• Programmable Royalties &amp; On-Chain Identity</text>
    <text x="15" y="90" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Economic Function: Digital Scarcity &amp; Title Property</text>
  </g>

  <!-- Bottom Banner -->
  <rect x="40" y="355" width="720" height="30" fill="#1e293b" rx="6" stroke="#334155"/>
  <text x="400" y="375" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Digital currencies provide the indispensable, programmable economic substrate for decentralization, gas metering, and user ownership in Web3.</text>
</svg>
