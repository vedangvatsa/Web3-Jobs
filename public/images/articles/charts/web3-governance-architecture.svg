<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gov" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card-gov" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="gov-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="url(#bg-gov)" rx="16"/>

  <!-- Title -->
  <text x="500" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#f8fafc" text-anchor="middle">Web3 DAO Governance Protocol Architecture &amp; Execution Pipeline</text>
  <text x="500" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Temperature Checks, Snapshot Signatures, Compound Governor Bravo &amp; Timelock Controllers</text>

  <!-- Step 1: Off-Chain Signaling -->
  <g filter="url(#shadow)">
    <rect x="50" y="110" width="270" height="440" rx="12" fill="url(#card-gov)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="185" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#60a5fa" text-anchor="middle">1. Off-Chain Signaling</text>
    <line x1="70" y1="160" x2="300" y2="160" stroke="#3b82f6" stroke-opacity="0.4"/>
    
    <rect x="70" y="180" width="230" height="70" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="80" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Discourse Forum Proposal</text>
    <text x="80" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Community RFC Discussion</text>

    <rect x="70" y="265" width="230" height="70" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="80" y="287" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Snapshot Gasless Voting</text>
    <text x="80" y="307" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">EIP-712 Message Signatures</text>

    <rect x="70" y="350" width="230" height="70" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="80" y="372" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Delegate Campaigns</text>
    <text x="80" y="392" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Voting Power Delegation</text>
  </g>

  <!-- Step 2: On-Chain Voting -->
  <g filter="url(#shadow)">
    <rect x="365" y="110" width="270" height="440" rx="12" fill="url(#card-gov)" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="500" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#c084fc" text-anchor="middle">2. On-Chain Governor</text>
    <line x1="385" y1="160" x2="615" y2="160" stroke="#8b5cf6" stroke-opacity="0.4"/>

    <rect x="385" y="180" width="230" height="70" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="395" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Proposal Creation</text>
    <text x="395" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Meets Proposal Threshold</text>

    <rect x="385" y="265" width="230" height="70" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="395" y="287" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Voting Delay &amp; Period</text>
    <text x="395" y="307" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Snapshot Block Checkpoint</text>

    <rect x="385" y="350" width="230" height="70" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="395" y="372" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Quorum Verification</text>
    <text x="395" y="392" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">For / Against / Abstain</text>
  </g>

  <!-- Step 3: Timelock Execution -->
  <g filter="url(#shadow)">
    <rect x="680" y="110" width="270" height="440" rx="12" fill="url(#card-gov)" stroke="#10b981" stroke-width="1.5"/>
    <text x="815" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#34d399" text-anchor="middle">3. Timelock Execution</text>
    <line x1="700" y1="160" x2="930" y2="160" stroke="#10b981" stroke-opacity="0.4"/>

    <rect x="700" y="180" width="230" height="70" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="710" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Timelock Queue</text>
    <text x="710" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Min Delay Window (e.g. 48h)</text>

    <rect x="700" y="265" width="230" height="70" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="710" y="287" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Emergency Veto / Guardian</text>
    <text x="710" y="307" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Multisig Cancel Protection</text>

    <rect x="700" y="350" width="230" height="70" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="710" y="372" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">On-Chain State Execution</text>
    <text x="710" y="392" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Treasury Transfer / Upgrade</text>
  </g>
</svg>
