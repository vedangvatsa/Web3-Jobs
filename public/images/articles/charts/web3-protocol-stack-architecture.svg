<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg-grad)"/>

  <!-- Title -->
  <text x="600" y="55" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="700">Web3 Protocol Stack Architecture</text>
  <text x="600" y="85" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="15">From Base Consensus &amp; Data Layers to Composable Smart Contract Primitives &amp; Applications</text>

  <!-- Flow Boxes -->

  <!-- Layer 1: Base Consensus & L1/L2 Protocols -->
  <g transform="translate(60, 130)" filter="url(#shadow)">
    <rect width="230" height="460" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="8" fill="#3b82f6" rx="4"/>
    <text x="115" y="38" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">1. L1/L2 Protocols</text>

    <rect x="15" y="60" width="200" height="75" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="85" fill="#60a5fa" font-family="monospace" font-size="14" font-weight="700">Ethereum / Bitcoin</text>
    <text x="25" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Base Consensus Layer</text>
    <text x="25" y="122" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">PoS / PoW economic security</text>

    <rect x="15" y="150" width="200" height="75" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="175" fill="#60a5fa" font-family="monospace" font-size="14" font-weight="700">Arbitrum / Optimism</text>
    <text x="25" y="195" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Execution Rollup Layer</text>
    <text x="25" y="212" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Low-cost transaction scaling</text>

    <rect x="15" y="240" width="200" height="75" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="265" fill="#60a5fa" font-family="monospace" font-size="14" font-weight="700">Data Availability</text>
    <text x="25" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Celestia / EIP-4844 Blobs</text>
    <text x="25" y="302" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Verifiable blob space</text>

    <rect x="15" y="330" width="200" height="110" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="25" y="355" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Stack Function:</text>
    <text x="25" y="375" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Settlement finality</text>
    <text x="25" y="395" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Cryptoeconomic security</text>
    <text x="25" y="415" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• State transition rules</text>
  </g>

  <!-- Arrow 1-2 -->
  <path d="M 290 360 L 330 360" stroke="#3b82f6" stroke-width="3" fill="none"/>
  <polygon points="330,360 320,354 320,366" fill="#3b82f6"/>

  <!-- Layer 2: Application Protocols & Primitives -->
  <g transform="translate(340, 130)" filter="url(#shadow)">
    <rect width="240" height="460" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="240" height="8" fill="#a855f7" rx="4"/>
    <text x="120" y="38" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">2. Application Protocols</text>

    <rect x="15" y="60" width="210" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="85" fill="#c084fc" font-family="monospace" font-size="14" font-weight="700">Uniswap / Curve</text>
    <text x="25" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">AMM Liquidity Protocols</text>
    <text x="25" y="125" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Constant-product math</text>

    <rect x="15" y="160" width="210" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="185" fill="#c084fc" font-family="monospace" font-size="14" font-weight="700">Aave / Compound</text>
    <text x="25" y="205" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Money Market Protocols</text>
    <text x="25" y="225" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Algorithmic interest rates</text>

    <rect x="15" y="260" width="210" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="285" fill="#c084fc" font-family="monospace" font-size="14" font-weight="700">Lido / EigenLayer</text>
    <text x="25" y="305" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Staking &amp; Restaking</text>
    <text x="25" y="325" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Shared security allocation</text>

    <rect x="15" y="360" width="210" height="80" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="25" y="385" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Composability:</text>
    <text x="25" y="405" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Money Legos integration</text>
    <text x="25" y="425" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Open API contract calls</text>
  </g>

  <!-- Arrow 2-3 -->
  <path d="M 580 360 L 620 360" stroke="#a855f7" stroke-width="3" fill="none"/>
  <polygon points="620,360 610,354 610,366" fill="#a855f7"/>

  <!-- Layer 3: Middleware & Oracles -->
  <g transform="translate(630, 130)" filter="url(#shadow)">
    <rect width="240" height="460" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="240" height="8" fill="#10b981" rx="4"/>
    <text x="120" y="38" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">3. Middleware &amp; Oracles</text>

    <rect x="15" y="60" width="210" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="85" fill="#34d399" font-family="monospace" font-size="14" font-weight="700">Chainlink / Pyth</text>
    <text x="25" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Decentralized Oracle Net</text>
    <text x="25" y="125" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Off-chain price data feeds</text>

    <rect x="15" y="160" width="210" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="185" fill="#34d399" font-family="monospace" font-size="14" font-weight="700">The Graph / Envio</text>
    <text x="25" y="205" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Indexing &amp; Subgraphs</text>
    <text x="25" y="225" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">GraphQL event querying</text>

    <rect x="15" y="260" width="210" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="285" fill="#34d399" font-family="monospace" font-size="14" font-weight="700">Chainlink CCIP / Axelar</text>
    <text x="25" y="305" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Cross-Chain Interoperability</text>
    <text x="25" y="325" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Message &amp; asset bridging</text>

    <rect x="15" y="360" width="210" height="80" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="25" y="385" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Infrastructure Role:</text>
    <text x="25" y="405" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Secure external data</text>
    <text x="25" y="425" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Fast off-chain indexing</text>
  </g>

  <!-- Arrow 3-4 -->
  <path d="M 870 360 L 910 360" stroke="#10b981" stroke-width="3" fill="none"/>
  <polygon points="910,360 900,354 900,366" fill="#10b981"/>

  <!-- Layer 4: Careers & Protocol Development -->
  <g transform="translate(920, 130)" filter="url(#shadow)">
    <rect width="220" height="460" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="8" fill="#06b6d4" rx="4"/>
    <text x="110" y="38" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">4. Protocol Careers</text>

    <rect x="15" y="60" width="190" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="85" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Protocol Engineer</text>
    <text x="25" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Solidity / Rust / Go</text>
    <text x="25" y="125" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">$160K - $300K base</text>

    <rect x="15" y="160" width="190" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="185" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Protocol Architect</text>
    <text x="25" y="205" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">System Design &amp; Specs</text>
    <text x="25" y="225" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">$180K - $350K+ base</text>

    <rect x="15" y="260" width="190" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="285" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Tokenomics Designer</text>
    <text x="25" y="305" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Economic Incentive Spec</text>
    <text x="25" y="325" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">$140K - $250K base</text>

    <rect x="15" y="360" width="190" height="80" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="25" y="385" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Core Value:</text>
    <text x="25" y="405" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Public good software</text>
    <text x="25" y="425" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• High-value protocol TVL</text>
  </g>

  <!-- Footer -->
  <text x="600" y="640" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="13">Hashtag Web3 Architecture Series • https://hashtagweb3.com</text>
</svg>
