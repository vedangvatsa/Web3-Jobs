<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="wrm-title wrm-desc">
<title id="wrm-title">Web3 Candidate Evaluation and Portfolio Matrix</title>
<desc id="wrm-desc">Hiring manager evaluation breakdown showing relative weight of traditional resumes vs on-chain proofs, GitHub repos, and security audits.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:12px;fill:#334155}
.header{font-weight:700;fill:#1e293b;font-size:12px}
.row-bg{fill:#f8fafc}.card{fill:#ffffff;stroke:#e2e8f0}.grid{stroke:#e2e8f0}
.col1{fill:#3b82f6}.col2{fill:#10b981}.col3{fill:#f59e0b}.col4{fill:#8b5cf6}
@media (prefers-color-scheme:dark){
text{fill:#cbd5e1}.header{fill:#f1f5f9}.row-bg{fill:#1e293b}.card{fill:#0f172a;stroke:#1e293b}.grid{stroke:#334155}
}
</style>
<rect class="card" x="1" y="1" width="638" height="328" rx="12"/>
<text x="24" y="32" font-weight="700" font-size="15">Web3 Candidate Screening Evaluation Matrix</text>
<text x="24" y="50" font-size="11" fill="#64748b">Signal weight and verification channels across engineering candidate portfolios (Recruiter survey data)</text>

<!-- Header -->
<line class="grid" x1="20" y1="65" x2="620" y2="65"/>
<text x="28" y="82" class="header">Portfolio Component</text>
<text x="180" y="82" class="header">High-Signal Evidence</text>
<text x="350" y="82" class="header">Verification Platform</text>
<text x="495" y="82" class="header">Hiring Weight</text>
<line class="grid" x1="20" y1="92" x2="620" y2="92"/>

<!-- Row 1 -->
<rect class="row-bg" x="20" y="94" width="600" height="50" rx="4"/>
<text x="28" y="116" font-weight="600">On-Chain Proof</text>
<text x="28" y="132" font-size="10" fill="#64748b">Verified Contracts</text>
<text x="180" y="116">Mainnet deployments, TVL</text>
<text x="180" y="132" font-size="10" fill="#64748b">Verified source code on explorer</text>
<text x="350" y="116">Etherscan, Basescan</text>
<text x="350" y="132" font-size="10" fill="#64748b">Dune dashboards, Subgraphs</text>
<rect class="col1" x="495" y="110" width="85" height="12" rx="3"/>
<text x="500" y="120" font-size="10" fill="#ffffff" font-weight="700">35% Prime</text>

<!-- Row 2 -->
<text x="28" y="168" font-weight="600">Open-Source Repos</text>
<text x="28" y="184" font-size="10" fill="#64748b">Code Quality</text>
<text x="180" y="168">Foundry test suites, CI checks</text>
<text x="180" y="184" font-size="10" fill="#64748b">Invariant fuzzing runs &amp; specs</text>
<text x="350" y="168">GitHub public repositories</text>
<text x="350" y="184" font-size="10" fill="#64748b">PRs to OpenZeppelin / Alloy</text>
<rect class="col2" x="495" y="162" width="75" height="12" rx="3"/>
<text x="500" y="172" font-size="10" fill="#ffffff" font-weight="700">30% High</text>

<!-- Row 3 -->
<rect class="row-bg" x="20" y="198" width="600" height="50" rx="4"/>
<text x="28" y="220" font-weight="600">Competitive Security</text>
<text x="28" y="236" font-size="10" fill="#64748b">Audit Proof</text>
<text x="180" y="220">Contest rankings, reported bugs</text>
<text x="180" y="236" font-size="10" fill="#64748b">Damn Vulnerable DeFi writeups</text>
<text x="350" y="220">Code4rena, Sherlock</text>
<text x="350" y="236" font-size="10" fill="#64748b">Immunefi bug bounty profiles</text>
<rect class="col3" x="495" y="214" width="70" height="12" rx="3"/>
<text x="500" y="224" font-size="10" fill="#ffffff" font-weight="700">20% Audit</text>

<!-- Row 4 -->
<text x="28" y="272" font-weight="600">Traditional Resume</text>
<text x="28" y="288" font-size="10" fill="#64748b">Background</text>
<text x="180" y="272">Engineering track record, CS</text>
<text x="180" y="288" font-size="10" fill="#64748b">Team leadership &amp; delivery</text>
<text x="350" y="272">PDF / LinkedIn / Peer refs</text>
<text x="350" y="288" font-size="10" fill="#64748b">Web2 enterprise experience</text>
<rect class="col4" x="495" y="266" width="65" height="12" rx="3"/>
<text x="500" y="276" font-size="10" fill="#ffffff" font-weight="700">15% Baseline</text>

<line class="grid" x1="20" y1="306" x2="620" y2="306"/>
</svg>
