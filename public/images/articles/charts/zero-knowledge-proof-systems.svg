<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="zk-title zk-desc">
<title id="zk-title">Zero-Knowledge Proof Systems Comparison Architecture</title>
<desc id="zk-desc">Cryptographic breakdown comparing SNARKs, STARKs, and Bulletproofs across setup trust, proof size, prover complexity, and verification cost.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:11px;fill:#334155}
.header{font-weight:700;fill:#1e293b;font-size:12px}
.card{fill:#ffffff;stroke:#e2e8f0}
.box-snark{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.5}
.box-stark{fill:#f0fdf4;stroke:#10b981;stroke-width:1.5}
.box-bullet{fill:#faf5ff;stroke:#8b5cf6;stroke-width:1.5}
.tag{font-size:10px;font-weight:600}
@media (prefers-color-scheme:dark){
text{fill:#cbd5e1}.header{fill:#f1f5f9}.card{fill:#0f172a;stroke:#1e293b}
.box-snark{fill:#172554;stroke:#60a5fa}.box-stark{fill:#064e3b;stroke:#34d399}.box-bullet{fill:#3b0764;stroke:#c084fc}
}
</style>

<rect class="card" x="1" y="1" width="638" height="358" rx="12"/>
<text x="24" y="30" font-weight="700" font-size="15">Zero-Knowledge Proof Systems: Architectural Taxonomy</text>
<text x="24" y="48" font-size="11" fill="#64748b">Comparison of SNARKs, STARKs, and Bulletproofs in verifier costs, proof size, and trust assumptions</text>

<!-- SNARKs Column -->
<rect class="box-snark" x="24" y="66" width="186" height="260" rx="8"/>
<text x="36" y="90" class="header" fill="#2563eb">zk-SNARKs</text>
<text x="36" y="106" class="tag" fill="#2563eb">Groth16 / Plonk / Halo2</text>

<text x="36" y="132" font-weight="600">Setup Parameter:</text>
<text x="36" y="146" font-size="10" fill="#64748b">Trusted Setup (CRS / SRS)</text>

<text x="36" y="170" font-weight="600">Proof Size:</text>
<text x="36" y="184" font-size="10" fill="#64748b">Ultra-succinct: 130 - 400 B</text>

<text x="36" y="208" font-weight="600">Verification Time:</text>
<text x="36" y="222" font-size="10" fill="#64748b">Constant O(1) ~2-5 ms</text>

<text x="36" y="246" font-weight="600">Cryptographic Hardness:</text>
<text x="36" y="260" font-size="10" fill="#64748b">Elliptic curve pairings (dlog)</text>

<text x="36" y="284" font-weight="600">Post-Quantum Safe:</text>
<text x="36" y="298" font-size="10" fill="#ef4444">No (Vulnerable to Shor)</text>

<!-- STARKs Column -->
<rect class="box-stark" x="226" y="66" width="186" height="260" rx="8"/>
<text x="238" y="90" class="header" fill="#059669">zk-STARKs</text>
<text x="238" y="106" class="tag" fill="#059669">Starknet / Polygon Miden</text>

<text x="238" y="132" font-weight="600">Setup Parameter:</text>
<text x="238" y="146" font-size="10" fill="#64748b">Transparent (No trusted setup)</text>

<text x="238" y="170" font-weight="600">Proof Size:</text>
<text x="238" y="184" font-size="10" fill="#64748b">Moderate: 45 - 250 kB</text>

<text x="238" y="208" font-weight="600">Verification Time:</text>
<text x="238" y="222" font-size="10" fill="#64748b">Polylogarithmic O(log^2 N)</text>

<text x="238" y="246" font-weight="600">Cryptographic Hardness:</text>
<text x="238" y="260" font-size="10" fill="#64748b">Collision-resistant hashes (FRI)</text>

<text x="238" y="284" font-weight="600">Post-Quantum Safe:</text>
<text x="238" y="298" font-size="10" fill="#10b981">Yes (Quantum-resistant)</text>

<!-- Bulletproofs Column -->
<rect class="box-bullet" x="428" y="66" width="186" height="260" rx="8"/>
<text x="440" y="90" class="header" fill="#7c3aed">Bulletproofs</text>
<text x="440" y="106" class="tag" fill="#7c3aed">Monero / Confidential Tx</text>

<text x="440" y="132" font-weight="600">Setup Parameter:</text>
<text x="440" y="146" font-size="10" fill="#64748b">Transparent (No trusted setup)</text>

<text x="440" y="170" font-weight="600">Proof Size:</text>
<text x="440" y="184" font-size="10" fill="#64748b">Logarithmic: 1.5 - 2.5 kB</text>

<text x="440" y="208" font-weight="600">Verification Time:</text>
<text x="440" y="222" font-size="10" fill="#64748b">Linear O(N) in constraints</text>

<text x="440" y="246" font-weight="600">Cryptographic Hardness:</text>
<text x="440" y="260" font-size="10" fill="#64748b">Discrete Log (Inner product)</text>

<text x="440" y="284" font-weight="600">Post-Quantum Safe:</text>
<text x="440" y="298" font-size="10" fill="#ef4444">No (Vulnerable to Shor)</text>
</svg>