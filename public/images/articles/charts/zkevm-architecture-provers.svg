<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="zk-title zk-desc">
<title id="zk-title">zkEVM Types and Prover Pipeline Architecture</title>
<desc id="zk-desc">Taxonomy of Zero-Knowledge EVMs categorized by Vitalik Buterin's classification alongside the cryptographic proving pipeline.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:12px;fill:#334155}
.header{font-weight:700;fill:#1e293b;font-size:12px}
.row-bg{fill:#f8fafc}.card{fill:#ffffff;stroke:#e2e8f0}.grid{stroke:#e2e8f0}
.zk1{fill:#3b82f6}.zk2{fill:#10b981}.zk3{fill:#f59e0b}.zk4{fill:#8b5cf6}
@media (prefers-color-scheme:dark){
text{fill:#cbd5e1}.header{fill:#f1f5f9}.row-bg{fill:#1e293b}.card{fill:#0f172a;stroke:#1e293b}.grid{stroke:#334155}
}
</style>
<rect class="card" x="1" y="1" width="638" height="328" rx="12"/>
<text x="24" y="32" font-weight="700" font-size="15">zkEVM Architectural Taxonomy &amp; Prover Pipeline</text>
<text x="24" y="50" font-size="11" fill="#64748b">Vitalik Buterin's zkEVM classification tiers, proving complexity, and Ethereum compatibility</text>

<!-- Header -->
<line class="grid" x1="20" y1="65" x2="620" y2="65"/>
<text x="28" y="82" class="header">zkEVM Tier</text>
<text x="175" y="82" class="header">Leading Implementations</text>
<text x="350" y="82" class="header">Prover Pipeline Model</text>
<text x="495" y="82" class="header">Equivalence</text>
<line class="grid" x1="20" y1="92" x2="620" y2="92"/>

<!-- Row 1 -->
<rect class="row-bg" x="20" y="94" width="600" height="50" rx="4"/>
<text x="28" y="116" font-weight="600">Type 1: Full Eth</text>
<text x="28" y="132" font-size="10" fill="#64748b">Consensus level</text>
<text x="175" y="116">Taiko, Privacy &amp; Scaling (PSE)</text>
<text x="175" y="132" font-size="10" fill="#64748b">Zeth (RISC Zero)</text>
<text x="350" y="116">Exact Merkle Patricia trie</text>
<text x="350" y="132" font-size="10" fill="#64748b">Heavy execution traces</text>
<rect class="zk1" x="495" y="110" width="85" height="12" rx="3"/>
<text x="500" y="120" font-size="10" fill="#ffffff" font-weight="700">100% Native</text>

<!-- Row 2 -->
<text x="28" y="168" font-weight="600">Type 2: EVM Level</text>
<text x="28" y="184" font-size="10" fill="#64748b">Bytecode level</text>
<text x="175" y="168">Scroll, Linea, Polygon zkEVM</text>
<text x="175" y="184" font-size="10" fill="#64748b">Optimized state trees</text>
<text x="350" y="168">Custom ZK-friendly hash (Poseidon)</text>
<text x="350" y="184" font-size="10" fill="#64748b">Full opcode parity</text>
<rect class="zk2" x="495" y="162" width="80" height="12" rx="3"/>
<text x="500" y="172" font-size="10" fill="#ffffff" font-weight="700">EVM Identical</text>

<!-- Row 3 -->
<rect class="row-bg" x="20" y="198" width="600" height="50" rx="4"/>
<text x="28" y="220" font-weight="600">Type 3: Almost EVM</text>
<text x="28" y="236" font-size="10" fill="#64748b">Transitional tier</text>
<text x="175" y="220">Kakarot (Cairo-based EVM)</text>
<text x="175" y="236" font-size="10" fill="#64748b">Early testnet rollups</text>
<text x="350" y="220">Minor precompile omissions</text>
<text x="350" y="236" font-size="10" fill="#64748b">Faster proving acceleration</text>
<rect class="zk3" x="495" y="214" width="70" height="12" rx="3"/>
<text x="500" y="224" font-size="10" fill="#ffffff" font-weight="700">95% Opcodes</text>

<!-- Row 4 -->
<text x="28" y="272" font-weight="600">Type 4: High-Level</text>
<text x="28" y="288" font-size="10" fill="#64748b">Source compiler</text>
<text x="175" y="272">zkSync Era (ZKsync), Starknet</text>
<text x="175" y="288" font-size="10" fill="#64748b">Compiles to LLVM / Cairo IR</text>
<text x="350" y="272">Custom registers &amp; memory model</text>
<text x="350" y="288" font-size="10" fill="#64748b">Fastest GPU proof turnaround</text>
<rect class="zk4" x="495" y="266" width="95" height="12" rx="3"/>
<text x="500" y="276" font-size="10" fill="#ffffff" font-weight="700">Source Equal</text>

<line class="grid" x1="20" y1="306" x2="620" y2="306"/>
</svg>
