<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <!-- Background Container -->
  <rect width="500" height="500" rx="100" ry="100" fill="url(#bgGrad)" />
  
  <!-- # Hashtag Symbol -->
  <g fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round">
    <!-- Vertical bars -->
    <line x1="190" y1="120" x2="150" y2="380" />
    <line x1="330" y1="120" x2="290" y2="380" />
    <!-- Horizontal bars -->
    <line x1="120" y1="200" x2="380" y2="200" />
    <line x1="100" y1="300" x2="360" y2="300" />
  </g>

  <!-- W3 Accent Node Dot -->
  <circle cx="335" cy="180" r="22" fill="#38bdf8" stroke="#ffffff" stroke-width="6" />
</svg>
